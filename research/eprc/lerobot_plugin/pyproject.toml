[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_processor_eprc"
version = "0.1.0"
description = "EPRC/DEC contract gate ProcessorStep plugin for LeRobot"
requires-python = ">=3.10"
dependencies = ["lerobot"]

[tool.setuptools.packages.find]
where = ["src"]
