name: Validate CST effect compiler

on:
  push:
    branches:
      - "fix/joint-delta-to-joint-pos-semantics"
    paths:
      - "cst_validation/effect_compiler.py"
      - "cst_validation/test_effect_compiler.py"
      - ".github/workflows/validate-cst-effect-compiler.yml"
  workflow_dispatch:

jobs:
  effect-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pytest
      - name: Check proof-carrying effect commutation
        run: PYTHONPATH=. python -m pytest -q cst_validation/test_effect_compiler.py
