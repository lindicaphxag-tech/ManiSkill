name: Frozen two consecutive UNKNOWN ACK native target authority 16 new PhysX
on:
  push:
    branches: [research/compound-ack-target-authority-fresh16-20261009]
    paths:
      - 'research/TWO_ACK_ACTUATION_AUTHORITY_FRESH16_PRECOMMIT_V2.json'
      - 'research/frozen_ppo_compound_ack_multi_belief.py'
      - 'research/multi_ack_se3_bounded.py'
      - 'research/audit_two_ack_actuation_authority_fresh16.py'
      - '.github/workflows/two-consecutive-unknown-ack-actuation-authority16.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: two-ack-actual-native-hold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-before-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check actually frozen protocol, original released method, modified actual-physx source and certifier
        run: |
          set -euo pipefail
          test "$(git hash-object research/TWO_ACK_ACTUATION_AUTHORITY_FRESH16_PRECOMMIT_V2.json)" = "99f6c1e9f604e371fa0ae95480cfd1173b4d5f5f"
          test "$(git hash-object research/frozen_ppo_compound_ack_multi_belief.py)" = "fb9b4c2b82660593e05a5e30cb33da86051440f6"
          test "$(git hash-object research/multi_ack_se3_bounded.py)" = "36707a177549104ba5b4bd9bcebc76518f0d2840"
          test "$(git hash-object research/frozen_ppo_ack_bounded_query.py)" = "1dc653cdc44e422c8340475ad00f828b3a41eb4f"
          test "$(git hash-object research/two_history_se3_robust.py)" = "bb5fd155b7291fb127f94138fca321201c8271c3"
          python -m py_compile research/frozen_ppo_compound_ack_multi_belief.py research/audit_two_ack_actuation_authority_fresh16.py
          python -m pip install 'numpy>=1.24' 'scipy>=1.11'
          python -m unittest discover -s tests -p 'test_multi_ack_se3_bounded.py' -v
      - name: Fail if reset populations accidentally overlap the 360/370 known results
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/TWO_ACK_ACTUATION_AUTHORITY_FRESH16_PRECOMMIT_V2.json'))
          q=p['new_design']
          assert q['fresh_task_reset_seeds_pull']==list(range(430001,430009))
          assert q['fresh_task_reset_seeds_stack']==list(range(440001,440009))
          assert all(x<430001 for x in q['previous_failed_initial_attempt']['previous_source_seeds_pull']) if 'previous_failed_initial_attempt' in q else True
          print('PREOUTCOME_NEW16_SEEDS_AND_ACTUATION_DISPATCH_AUDIT_LOCKED')
          PY

  actual-physx:
    needs: frozen-before-outcomes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        task: [pull_cube, stack_cube]
    env:
      ABI_TASK: ${{ matrix.task }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Load actual native PhysX CPU and unchanged third-party frozen PPO dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers libgl1 libosmesa6
          python -m pip install -e . huggingface_hub
      - name: Pin original exact new-study source provenance before stepping official physics
        run: |
          mkdir -p /tmp/original-ack-physx
          git rev-parse HEAD > /tmp/original-ack-physx/commit.txt
          git hash-object research/frozen_ppo_compound_ack_multi_belief.py > /tmp/original-ack-physx/runner_blob.txt
          git hash-object research/TWO_ACK_ACTUATION_AUTHORITY_FRESH16_PRECOMMIT_V2.json > /tmp/original-ack-physx/preoutcome_protocol_blob.txt
          python -m pip freeze --all > /tmp/original-ack-physx/requirements_frozen.txt
      - name: Actual 8 original native CPU PhysX source episodes with 7 independent controller worlds
        run: |
          set -o pipefail
          PYTHONPATH="$PWD:$PWD/research" python research/frozen_ppo_compound_ack_multi_belief.py \
            2>&1 | tee /tmp/original-ack-physx/actual_physx_stdout.log
          test -s "compound_multi_ack_${ABI_TASK}_original8.json"
          cp "compound_multi_ack_${ABI_TASK}_original8.json" /tmp/original-ack-physx/
      - name: Hash each unchanged original source file and retain all failure logs
        if: always()
        run: |
          (cd /tmp/original-ack-physx && find . -maxdepth 1 -type f -print0 | xargs -0 sha256sum > SHA256SUMS) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unmodified-double-ack-target-hold-${{ matrix.task }}-${{ github.run_id }}
          path: /tmp/original-ack-physx/
          retention-days: 90

  complete-original-independent-audit:
    needs: actual-physx
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: unmodified-double-ack-target-hold-*
          path: /tmp/real-original-two-ack
          merge-multiple: true
      - name: Original 16 native tasks, real held target, belief histories, bounded certificates, no missing faults
        run: |
          set -euo pipefail
          python -m research.audit_two_ack_actuation_authority_fresh16 \
            --input-dir /tmp/real-original-two-ack \
            --output /tmp/complete_source_two_ack_real_audit.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/complete_source_two_ack_real_audit.json'))
          assert d['source_original_reset_states']==16
          assert d['all_seed_denominator_reached']
          assert len(d['groups'])==2
          print('SOURCE_ORIGINAL_PROSPECTIVE_HARD_GATE',
                {'all_faults_reached':d['all_seven_arms_have_two_physical_faults_per_seed'],
                 'task_success':d['success'],'reads_selective':d['reads_selective'],
                 'reads_mandatory':d['reads_mandatory'],
                 'hypotheses':d['max_belief_hypotheses'],
                 'missing_actual_faults':d['unexposed_conditions']})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-original-two-ack-target-authority-full-audit
          path: /tmp/complete_source_two_ack_real_audit.json
