name: PR1495 exact-current-head maintainer gate

on:
  push:
    branches:
      - "validation/maniskill1495-maintainer-request"
    paths:
      - "validation/pr1495/run_current_head_gate.sh"
      - "validation/pr1495/summarize_current_head_gate.py"
      - ".github/workflows/maniskill1495-current-head-gate.yml"
  pull_request:
    paths:
      - "validation/pr1495/run_current_head_gate.sh"
      - "validation/pr1495/summarize_current_head_gate.py"
      - ".github/workflows/maniskill1495-current-head-gate.yml"
  workflow_dispatch:

jobs:
  exact-head-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 mesa-vulkan-drivers vulkan-tools
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n1)"
          test -n "$LVP_ICD"
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$LVP_ICD" vulkaninfo --summary
      - name: Run exact current-head replay gate
        env:
          MS_SKIP_ASSET_DOWNLOAD_PROMPT: "1"
          REPEATS: "5"
          COUNT: "10"
        run: bash validation/pr1495/run_current_head_gate.sh
      - name: Publish gate
        if: always()
        run: |
          test ! -f .validation-pr1495-current-head/current_head_gate.json || cat .validation-pr1495-current-head/current_head_gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1495-exact-current-head-gate
          path: .validation-pr1495-current-head/current_head_gate.json
          if-no-files-found: warn
          include-hidden-files: true
