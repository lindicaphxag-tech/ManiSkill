name: Outside-investigator selectable Panda xArm ACK action-amplitude native PhysX

on:
  workflow_dispatch:
    inputs:
      robot:
        description: "Real robot articulation to test (different controller ABI)"
        type: choice
        options: [panda, xarm6_robotiq]
        required: true
        default: xarm6_robotiq
      amplitude:
        description: "Native applied-action scale (not used in 32 original sources)"
        type: choice
        options: ['0.45', '0.75', '1.2', '1.45']
        required: true
        default: '0.75'
      first_seed:
        description: "Your fresh reset-seed interval >= 700001"
        type: number
        required: true
        default: 710001
      number_of_reset_seeds:
        description: "Complete robot reset population, both actual delivery truths"
        type: choice
        options: ['1','4','8']
        required: true
        default: '4'
  push:
    branches: [feature/outsider-cross-robot-action-ood-replay-20261009]
    paths:
      - '.github/workflows/outsider-cross-robot-action-ood-ack.yml'
      - 'research/external_cross_robot_ack_reproduction.py'
      - 'tests/test_external_cross_robot_ack_reproduction.py'

permissions:
  contents: read

jobs:
  original-immutable-source-and-negative-authorization-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original physical solver/calibration source and reject invalid trials
        run: |
          set -euo pipefail
          test "$(git hash-object research/cross_robot_action_scale_physx.py)" = "2bfb8c29bd3b4d62c68186579ad0785689c83f27"
          test "$(git hash-object research/cross_robot_ack_calibration_portability.py)" = "743f0990cf4d72838c77e78a3fc78d0414496969"
          test "$(git hash-object research/frozen_policy_transfer/evidence/cross_robot_online_public_proprio_new32_480001_490008/SHA256SUMS)" = "bf731f19efb35228b8702f1a3f7b5251d7825afa"
          python -m py_compile research/external_cross_robot_ack_reproduction.py
          python -m unittest discover -s tests -p 'test_external_cross_robot_ack_reproduction.py' -v

  selected-six-native-controller-worlds:
    needs: original-immutable-source-and-negative-authorization-tests
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      PYTHONUNBUFFERED: '1'
      MS_SKIP_ASSET_DOWNLOAD_PROMPT: '1'
      TEST_ROBOT: ${{ github.event_name == 'workflow_dispatch' && inputs.robot || 'panda' }}
      TEST_SCALE: ${{ github.event_name == 'workflow_dispatch' && inputs.amplitude || '0.75' }}
      TEST_FIRST_SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.first_seed || 700001 }}
      TEST_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.number_of_reset_seeds || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuine maintained native ManiSkill PhysX runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers libgl1 libosmesa6
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Download native xArm6 URDF asset rather than relabel another robot
        if: ${{ env.TEST_ROBOT == 'xarm6_robotiq' }}
        run: python -m mani_skill.utils.download_asset xarm6 -y
      - name: Record exact source-code plus runtime identity and original requested inputs
        run: |
          mkdir -p outside_robot_reproduction
          git rev-parse HEAD > outside_robot_reproduction/source_commit.txt
          git hash-object research/cross_robot_action_scale_physx.py > outside_robot_reproduction/original_physx_method_git_blob.txt
          git hash-object research/cross_robot_ack_calibration_portability.py > outside_robot_reproduction/calibration_git_blob.txt
          git hash-object research/external_cross_robot_ack_reproduction.py > outside_robot_reproduction/reproducer_git_blob.txt
          python -m pip freeze --all > outside_robot_reproduction/python_environment_freeze.txt
          echo "robot=$TEST_ROBOT scale=$TEST_SCALE first_seed=$TEST_FIRST_SEED count=$TEST_COUNT" > outside_robot_reproduction/investigator_selected_inputs.txt
      - name: Execute BOTH actual ACK delivery truths and ALL six real PhysX controller arms per selected source seed
        run: |
          set -o pipefail
          PYTHONPATH="$PWD" python research/external_cross_robot_ack_reproduction.py \
            --robot "$TEST_ROBOT" --scale "$TEST_SCALE" \
            --first-seed "$TEST_FIRST_SEED" --count "$TEST_COUNT" \
            --output-dir outside_robot_reproduction \
            2>&1 | tee outside_robot_reproduction/all_original_real_physx_stdout.log
          test "$(find outside_robot_reproduction -name 'original_selected_native_ack_*.json' | wc -l)" -eq 1
          test -s outside_robot_reproduction/SOURCE_SHA256SUMS
      - name: Immutable original file manifest for outsiders, including failure logs
        if: always()
        run: |
          (cd outside_robot_reproduction && sha256sum ./*.json ./*.txt ./*.log > AUDIT_SHA256SUMS) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-investigator-chosen-real-cross-robot-physx-${{ github.run_id }}
          path: outside_robot_reproduction
          retention-days: 90
