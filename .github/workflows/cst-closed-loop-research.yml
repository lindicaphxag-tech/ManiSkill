name: Closed-loop semantic transport research

on:
  push:
    branches:
      - "research/closed-loop-semantic-transport-v1"
    paths:
      - "cst_research/**"
      - ".github/workflows/cst-closed-loop-research.yml"

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy pytest
      - name: Compile CST research modules
        run: python -m compileall -q cst_research
      - name: Run full CST research test suite
        working-directory: cst_research
        run: python -m pytest -q test_*.py
