name: Uncertain ACK common goal - independent LP oracle
on:
  push:
    branches: [research/uncertain-ack-common-goal-authority-20261014]
    paths:
      - research/terminal_common_action_certificate.py
      - tests/test_terminal_common_action_certificate.py
      - .github/workflows/uncertain-ack-common-position-oracle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-math-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only mathematics and test tools
        run: python -m pip install numpy scipy pytest
      - name: Verify 250 random cases against independent SciPy HiGHS LP solver
        run: python -m pytest -q tests/test_terminal_common_action_certificate.py
