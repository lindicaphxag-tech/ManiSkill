name: Validate CST L8 v2

on:
  push:
    branches:
      - "validation/cst-l8-v2"
    paths:
      - "cst_validation_v2/**"
      - ".github/workflows/validate-cst-l8-v2.yml"
  workflow_dispatch:

jobs:
  method:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: python -m pip install numpy scipy pytest
      - name: Compile CST modules
        working-directory: cst_validation_v2
        run: |
          python -m py_compile controller_semantic_ir.py semantic_morphism.py certified_transport.py temporal_anchor_contract.py nonlinear_semantic_transport.py
      - name: Run CST v2 gates
        working-directory: cst_validation_v2
        run: |
          python -m pytest -q             test_controller_semantic_ir.py             test_semantic_morphism.py             test_certified_transport.py             test_temporal_anchor_contract.py \
            test_nonlinear_semantic_transport.py
