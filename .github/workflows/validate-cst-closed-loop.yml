name: Validate CST closed-loop transport

on:
  push:
    branches:
      - "research/cst-closed-loop-v1"
    paths:
      - "cst_validation/closed_loop_certificate.py"
      - "cst_validation/closed_loop_probe.py"
      - "cst_validation/test_closed_loop_certificate.py"
      - "cst_validation/test_closed_loop_probe.py"
      - "cst_validation/linear_stateful_transport.py"
      - "cst_validation/test_linear_stateful_transport.py"
      - "cst_validation/CLOSED_LOOP_TRANSPORT_V0_1.md"
      - ".github/workflows/validate-cst-closed-loop.yml"
  workflow_dispatch:

jobs:
  closed-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pytest
      - name: Compile closed-loop modules
        run: |
          python -m py_compile cst_validation/closed_loop_certificate.py
          python -m py_compile cst_validation/closed_loop_probe.py
          python -m py_compile cst_validation/linear_stateful_transport.py
      - name: Run closed-loop certificate tests
        working-directory: cst_validation
        run: python -m pytest -q test_closed_loop_certificate.py
      - name: Run black-box probe tests
        working-directory: cst_validation
        run: python -m pytest -q test_closed_loop_probe.py
      - name: Run stateful handshake synthesis tests
        working-directory: cst_validation
        run: python -m pytest -q test_linear_stateful_transport.py
