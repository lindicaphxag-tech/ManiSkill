name: Archive exact five-state CRG negative evidence

on:
  pull_request:
    paths:
      - '.github/workflows/crg-direct-counterfactual-permanent-archive.yml'
      - 'research/crg_core/prospective/verify_frozen_counterfactual_archive.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/crg-direct-counterfactual-permanent-archive.yml'
      - 'research/crg_core/prospective/verify_frozen_counterfactual_archive.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the original upstream source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37808323459" --jq .head_sha)" = "2c1b910153450a156f83aa84d2eb52417b33086e"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37808323459" --jq .conclusion)" = success
      - name: Fetch all six immutable original evidence JSON files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/crg_originals
          gh run download 37808323459 --repo "$GITHUB_REPOSITORY" --name crg-direct-counterfactual-5state-original-evidence --dir /tmp/crg_originals
      - name: Exact hash plus independent frozen replay audit
        run: |
          python -m pip install -q numpy
          python -m research.crg_core.prospective.verify_frozen_counterfactual_archive --input-dir /tmp/crg_originals

  archive-on-trusted-main:
    if: github.event_name != 'pull_request'
    needs: verify-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the original upstream source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37808323459" --jq .head_sha)" = "2c1b910153450a156f83aa84d2eb52417b33086e"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/37808323459" --jq .conclusion)" = success
      - name: Fetch all six immutable original evidence JSON files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/crg_originals
          gh run download 37808323459 --repo "$GITHUB_REPOSITORY" --name crg-direct-counterfactual-5state-original-evidence --dir /tmp/crg_originals
      - name: Exact hash plus independent frozen replay audit
        run: |
          python -m pip install -q numpy
          python -m research.crg_core.prospective.verify_frozen_counterfactual_archive --input-dir /tmp/crg_originals
      - name: Preserve the exact original evidence under Git version control
        run: |
          set -euo pipefail
          dst=research/crg_core/evidence/direct_counterfactual_five_state_v1
          mkdir -p "$dst"
          cp /tmp/crg_originals/*.json "$dst/"
          cat > "$dst/README.md" <<'EOF'
          # Frozen five-state counterfactual response evidence
          Source: publicly successful CI run 37808323459, head 2c1b910153450a156f83aa84d2eb52417b33086e, pre-outcome protocol 5333216603586adfc6e4831df3c17ead48581a48.
          All six JSON files retain their original SHA-256 fingerprints recorded in MANIFEST.md. Verification recomputes every request from source actions. 
          Five restored PushT states, ten A/B requests, 240 first-action model calls.
          Zero statistically certified transfers: reliable policy/controller hard action bounds have not been proven.
          No independent third-party replication, physically safe transfer, or successful closed-loop task claim.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dst"
          if git diff --cached --quiet; then
            echo 'Exactly verified originals already committed'
            exit 0
          fi
          git commit -m 'evidence: preserve all six SHA-256 pinned counterfactual JSON records'
          git push origin HEAD:main
