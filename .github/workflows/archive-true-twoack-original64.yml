name: "Archive ORIGINAL source-authenticated true two-ACK 2x2 PhysX 64 states"
on:
  push:
    branches: [research/true-twoack-2x2-new64-20261009]
    paths:
      - .github/workflows/archive-true-twoack-original64.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  archive-original-data-with-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch completed authentic original eight physical shard sources
        uses: actions/download-artifact@v4
        with:
          run-id: 37919576643
          repository: lindicaphxag-tech/ManiSkill
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: original-2x2-*
          merge-multiple: true
          path: /tmp/true_twoack_original
      - name: Obtain completed independent all-population audit separately
        uses: actions/download-artifact@v4
        with:
          run-id: 37919576643
          repository: lindicaphxag-tech/ManiSkill
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: ORIGINAL_true_2x2_64_576_PhysX_all_negative_outcomes
          merge-multiple: true
          path: /tmp/true_twoack_comprehensive
      - name: Verify all original raw, per-shard, complete audits before Git archive
        run: |
          set -euo pipefail
          python -m research.audit_true_two_ack_2x2_new64 \
            --source-dir /tmp/true_twoack_original \
            --output /tmp/new_independent_64_audit.json
          test -s /tmp/true_twoack_comprehensive/full_2x2_original64_independent_audit.json
          python - <<'PY'
          import json,pathlib
          a=json.loads(pathlib.Path('/tmp/new_independent_64_audit.json').read_bytes())
          b=json.loads(pathlib.Path('/tmp/true_twoack_comprehensive/full_2x2_original64_independent_audit.json').read_bytes())
          assert a==b, 'The original completed all-population PhysX auditor was changed'
          assert a['actually_stepped_simulator_worlds']==576
          assert a['unique_source_reset_states']==64
          assert a['public_both_fault_events_exposed']==64
          assert a['outcomes']['public']=={'task_success':55,'private_reads':50}
          assert a['outcomes']['strong_task']=={'task_success':56,'private_reads':59}
          assert a['outcomes']['fixed_t5']=={'task_success':57,'private_reads':64}
          assert a['paired_new_vs_task_aware_strong']=={'both':54,'neither':7,'new_only':1,'strong_only':2}
          assert a['observed_confident_wrong_history']==0
          assert len(a['four_truth_strata'])==8
          print('GIT_SOURCE_ARCHIVE_MATCHED_ORIGINAL_COMPLETE_NATIVE_PHYSX_64')
          PY
      - name: Commit byte-identical originals and SHA256SUMS to the research branch
        run: |
          set -euo pipefail
          folder=research/frozen_policy_transfer/evidence/true_twoack_2x2_original64_1280001_1290032
          mkdir -p "$folder"
          cp /tmp/true_twoack_original/twoack_*_original8.json "$folder/"
          cp /tmp/true_twoack_original/twoack_*_audit.json "$folder/"
          cp /tmp/true_twoack_comprehensive/full_2x2_original64_independent_audit.json "$folder/"
          cd "$folder"
          sha256sum ./*.json | LC_ALL=C sort -k2 > SHA256SUMS
          cat > README.md <<'EOF'
          # Original PhysX physical two-unknown-ACK 2x2 complete evidence
          These are **byte-identical original source records** from completed author-owned GitHub Actions CI #37919576643, not independently rerun hardware data. All nine controllers were physically stepped on 64 original reset states, but strict-exact refusal prevented that particular negative-control arm from reaching the common probe; all seven other faulted arms did. The original complete audit's global common-probe flag is therefore false and must not be reinterpreted as a lack of probes for the actual primary methods. The results include 55/64 task successes and 50 privileged reads for the public method vs 56/64 and 59 for task-gated and 57/64 and 64 for fixed readback. Both commands t2 and t3 had all four physical APPLIED/HELD patterns balanced **across different seed identities**. No independent third party, real networking fault, real hardware safety, VLA-controlled task or peer review is claimed.
          The first attempted run #37919161678 failed for an observer contract violation; an explicit pre-result implementation amendment was retained on this branch. This archive is for the corrected source head b44f4e1bf5878140e0a21d472fd9c675d02b4328, with original sources pinned in the auditor.
          To verify: `sha256sum -c SHA256SUMS`. For complete source-level negative/positive and native physical truth audits, use `python -m research.audit_true_two_ack_2x2_new64 --source-dir <directory-containing-the-sixteen-JSONs> --output /tmp/reaudit.json` from repository root.
          EOF
          cd -
          git add "$folder"
          if git diff --cached --quiet; then
            echo "Archive already identical"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "evidence: permanently archive exact original true-2x2 64-native-PhysX JSON and SHA256SUMS"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
