name: Issue 429 v6 exact-head semantic regression

on:
  push:
    branches:
      - validation/issue429-v6-exact-head
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-green:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind validation to one-commit production head
        shell: bash
        run: |
          set -euo pipefail
          BASE=62ff3a5896b4d5b4cf0ac4c8d79afe600c9404a3
          PROD=b0e1b85d5002ead77fc42a793183e5e0c72e01cb
          git merge-base --is-ancestor "$PROD" HEAD
          test "$(git rev-list --count "$BASE".."$PROD")" = "1"
          test "$(git show "$PROD":mani_skill/trajectory/utils/actions/conversion.py | git hash-object --stdin)" = "$(git hash-object mani_skill/trajectory/utils/actions/conversion.py)"
          test "$(git show "$PROD":tests/test_pd_joint_delta_to_pos_semantics.py | git hash-object --stdin)" = "$(git hash-object tests/test_pd_joint_delta_to_pos_semantics.py)"
          test "$(git diff --name-only "$BASE" "$PROD" | sort)" = "$(printf '%s\n' mani_skill/trajectory/utils/actions/conversion.py tests/test_pd_joint_delta_to_pos_semantics.py | sort)"
          changed="$(git diff --name-only "$PROD"..HEAD | sort)"
          test "$changed" = ".github/workflows/issue429-v6-exact-head.yml"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff
          python -m pip install -e .

      - name: Full patch must pass semantic oracle
        run: |
          cd "$GITHUB_WORKSPACE"
          python -m pytest -q tests/test_pd_joint_delta_to_pos_semantics.py

      - name: Original upstream must expose transport fault
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="/tmp/maniskill-issue429-base-${{ matrix.python }}"
          git -C "$GITHUB_WORKSPACE" worktree add --detach "$BASE_DIR" 62ff3a5896b4d5b4cf0ac4c8d79afe600c9404a3
          cp "$GITHUB_WORKSPACE/tests/test_pd_joint_delta_to_pos_semantics.py" "$BASE_DIR/tests/test_pd_joint_delta_to_pos_semantics.py"
          set +e
          (
            cd "$BASE_DIR"
            PYTHONPATH="$BASE_DIR" python -m pytest -q tests/test_pd_joint_delta_to_pos_semantics.py
          ) > "/tmp/original-baseline-${{ matrix.python }}.log" 2>&1
          status=$?
          set -e
          cat "/tmp/original-baseline-${{ matrix.python }}.log"
          test "$status" -ne 0
          grep -q "TypeError: clip() received an invalid combination of arguments" "/tmp/original-baseline-${{ matrix.python }}.log"

      - name: Transport-only repair must still fail semantic chart oracle
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="/tmp/maniskill-issue429-base-${{ matrix.python }}"
          python - "$BASE_DIR/mani_skill/trajectory/utils/actions/conversion.py" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          old='''        delta_qpos = gym_utils.clip_and_scale_action(ori_action_dict["arm"], low, high)
          '''
          new='''        source_native = np.clip(
              np.asarray(ori_action_dict["arm"], dtype=np.float64), -1.0, 1.0
          )
          delta_qpos = (
              0.5 * (np.asarray(high) + np.asarray(low))
              + 0.5 * (np.asarray(high) - np.asarray(low)) * source_native
          )
          '''
          if old not in s:
              raise SystemExit("expected upstream transport block not found")
          p.write_text(s.replace(old,new,1))
          PY
          set +e
          (
            cd "$BASE_DIR"
            PYTHONPATH="$BASE_DIR" python -m pytest -q tests/test_pd_joint_delta_to_pos_semantics.py
          ) > "/tmp/transport-only-${{ matrix.python }}.log" 2>&1
          status=$?
          set -e
          cat "/tmp/transport-only-${{ matrix.python }}.log"
          test "$status" -ne 0
          ! grep -Eq "ImportError|ModuleNotFoundError|AttributeError|TypeError" "/tmp/transport-only-${{ matrix.python }}.log"
          grep -Eq "FAILED|AssertionError|Mismatched elements|Not equal to tolerance" "/tmp/transport-only-${{ matrix.python }}.log"

      - name: Hygiene on changed surface
        shell: bash
        run: |
          set -euo pipefail
          BASE=62ff3a5896b4d5b4cf0ac4c8d79afe600c9404a3
          PROD=b0e1b85d5002ead77fc42a793183e5e0c72e01cb
          git diff --check "$BASE" "$PROD"
          ruff check tests/test_pd_joint_delta_to_pos_semantics.py
          ruff format --check tests/test_pd_joint_delta_to_pos_semantics.py
          # The production file has three pre-existing repo-wide Ruff findings
          # (UP007/SIM101/SIM102) outside this patch. Enforce all other rules.
          ruff check mani_skill/trajectory/utils/actions/conversion.py --ignore UP007,SIM101,SIM102
          ruff format --check mani_skill/trajectory/utils/actions/conversion.py
