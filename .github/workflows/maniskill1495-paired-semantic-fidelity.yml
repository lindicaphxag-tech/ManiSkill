name: PR1495 paired semantic fidelity

on:
  push:
    branches:
      - "validation/maniskill1495-maintainer-request"
    paths:
      - "validation/pr1495/capture_rotation_request_corpus.py"
      - "validation/pr1495/evaluate_frozen_rotation_requests.py"
      - "validation/pr1495/summarize_paired_semantic_fidelity.py"
      - "validation/pr1495/run_paired_semantic_fidelity.sh"
      - ".github/workflows/maniskill1495-paired-semantic-fidelity.yml"
  pull_request:
    paths:
      - "validation/pr1495/capture_rotation_request_corpus.py"
      - "validation/pr1495/evaluate_frozen_rotation_requests.py"
      - "validation/pr1495/summarize_paired_semantic_fidelity.py"
      - "validation/pr1495/run_paired_semantic_fidelity.sh"
      - ".github/workflows/maniskill1495-paired-semantic-fidelity.yml"
  workflow_dispatch:

jobs:
  paired-semantic-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 mesa-vulkan-drivers vulkan-tools
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n1)"
          test -n "$LVP_ICD"
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$LVP_ICD" vulkaninfo --summary

      - name: Run paired two-corpus semantic assay
        env:
          COUNT: "10"
          MS_SKIP_ASSET_DOWNLOAD_PROMPT: "1"
        run: bash validation/pr1495/run_paired_semantic_fidelity.sh

      - name: Publish paired evidence
        if: always()
        run: |
          if [[ -f .validation-pr1495-paired-fidelity/paired_semantic_fidelity.json ]]; then
            cat .validation-pr1495-paired-fidelity/paired_semantic_fidelity.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1495-paired-semantic-fidelity
          path: |
            .validation-pr1495-paired-fidelity/baseline_generated.json
            .validation-pr1495-paired-fidelity/composed_generated.json
            .validation-pr1495-paired-fidelity/*__*.json
            .validation-pr1495-paired-fidelity/paired_semantic_fidelity.json
          if-no-files-found: warn
