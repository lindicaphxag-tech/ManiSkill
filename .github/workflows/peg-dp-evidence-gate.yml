name: Peg Diffusion Policy evidence acceptance

on:
  push:
    branches:
      - research/native-delta-pose-assay
    paths:
      - "research/kaggle_diffusion_policy_peg/policy_evidence_gate.py"
      - "research/kaggle_diffusion_policy_peg/assay_design.py"
      - "research/kaggle_diffusion_policy_peg/replay_itt.py"
      - "research/kaggle_diffusion_policy_peg/audit_replay_journal.py"
      - "research/kaggle_diffusion_policy_peg/verify_native_replay_outputs.py"
      - "research/kaggle_diffusion_policy_peg/tests/test_verify_native_replay_outputs.py"
      - "research/kaggle_diffusion_policy_peg/tests/test_audit_replay_journal.py"
      - "research/kaggle_diffusion_policy_peg/tests/test_replay_itt.py"
      - "research/kaggle_diffusion_policy_peg/tests/test_native_hdf5_replay_outcome.py"
      - "research/kaggle_diffusion_policy_peg/run_assay_factorial.py"
      - "research/kaggle_diffusion_policy_peg/tests/test_policy_evidence_gate.py"
      - ".github/workflows/peg-dp-evidence-gate.yml"
  pull_request:
    paths:
      - "research/kaggle_diffusion_policy_peg/policy_evidence_gate.py"
      - "research/kaggle_diffusion_policy_peg/assay_design.py"
      - "research/kaggle_diffusion_policy_peg/replay_itt.py"
      - "research/kaggle_diffusion_policy_peg/audit_replay_journal.py"
      - "research/kaggle_diffusion_policy_peg/verify_native_replay_outputs.py"
      - "research/kaggle_diffusion_policy_peg/tests/test_verify_native_replay_outputs.py"
      - "research/kaggle_diffusion_policy_peg/tests/test_audit_replay_journal.py"
      - "research/kaggle_diffusion_policy_peg/tests/test_replay_itt.py"
      - "research/kaggle_diffusion_policy_peg/tests/test_native_hdf5_replay_outcome.py"
      - "research/kaggle_diffusion_policy_peg/run_assay_factorial.py"
      - "research/kaggle_diffusion_policy_peg/tests/test_policy_evidence_gate.py"
      - ".github/workflows/peg-dp-evidence-gate.yml"

permissions:
  contents: read

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native HDF5 Python reader (no GPU)
        run: python -m pip install "h5py>=3.12,<4"
      - name: Compile evidence gate
        run: |
          python -m py_compile research/kaggle_diffusion_policy_peg/policy_evidence_gate.py
          python -m py_compile research/kaggle_diffusion_policy_peg/assay_design.py
          python -m py_compile research/kaggle_diffusion_policy_peg/replay_itt.py
          python -m py_compile research/kaggle_diffusion_policy_peg/audit_replay_journal.py
          python -m py_compile research/kaggle_diffusion_policy_peg/verify_native_replay_outputs.py
          python -m py_compile research/kaggle_diffusion_policy_peg/run_assay_factorial.py
      - name: Adversarial artifact acceptance tests (pure stdlib)
        run: python -m unittest discover -s research/kaggle_diffusion_policy_peg/tests -p 'test_*.py' -v
      - name: Known failed PegInsertionSide v3 remains refused
        shell: bash
        run: |
          set +e
          python research/kaggle_diffusion_policy_peg/policy_evidence_gate.py research/kaggle_diffusion_policy_peg/results/v3 > /tmp/refusal.json
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "FAILED: incomplete real run was not rejected; exit code=$status"
            exit 1
          fi
          python - <<'PY'
          import json
          record = json.load(open("/tmp/refusal.json"))
          assert record["status"] == "REJECTED", record
          print("Correctly refused archived zero-update PegInsertionSide experiment")
          PY
