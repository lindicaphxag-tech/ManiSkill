name: CST ManiSkill production controller gate

on:
  push:
    branches:
      - "research/controller-semantic-transport-v0"
    paths:
      - "research/controller_semantic_transport/integration/**"
      - "research/controller_semantic_transport/cst/**"
      - ".github/workflows/cst-maniskill-production.yml"
  workflow_dispatch:

jobs:
  production-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          LVP_ICD="$(find /usr/share/vulkan /etc/vulkan -type f -path '*/icd.d/*' -name '*lvp*.json' -print -quit 2>/dev/null || true)"
          if [ -n "$LVP_ICD" ]; then
            echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
            VK_ICD_FILENAMES="$LVP_ICD" vulkaninfo --summary
          else
            echo "No explicit Lavapipe ICD file found; testing Mesa auto-discovery"
            find /usr/share/vulkan /etc/vulkan -type f -path '*/icd.d/*' -name '*.json' -print 2>/dev/null || true
            vulkaninfo --summary
          fi
      - name: Install ManiSkill
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run production controller semantic gate
        env:
          PYTHONPATH: research/controller_semantic_transport
        run: python research/controller_semantic_transport/integration/maniskill_exact_family_gate.py
