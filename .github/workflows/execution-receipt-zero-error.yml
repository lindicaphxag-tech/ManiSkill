name: Exact receipt graph zero-error optimality and bounded-sensor replay
on:
  push:
    branches: ["research/zero-error-execution-receipts-20261013"]
    paths:
      - "research/EXECUTION_RECEIPT_FINITE_PREREG_20261013.json"
      - "research/zero_error_execution_receipt.py"
      - "research/test_zero_error_execution_receipt.py"
      - ".github/workflows/execution-receipt-zero-error.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-exhaustive-coloring:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Check every H3 chromatic number by independent brute partitions and all H4 safe decisions
        run: python -m pytest -q research/test_zero_error_execution_receipt.py
      - name: Replay all 288 frozen robot-like quantized-controller cases with matched Bayesian baseline
        run: python -m research.zero_error_execution_receipt --out exact_receipt_288_controller_cases.json
      - uses: actions/upload-artifact@v4
        with:
          name: full-288-execution-receipt-controller-results-${{ matrix.os }}
          path: exact_receipt_288_controller_cases.json
