name: Validate CST saturation semantics

on:
  push:
    branches:
      - "fix/joint-delta-to-joint-pos-semantics"
    paths:
      - "cst_validation/clipping_semantics.py"
      - "cst_validation/test_clipping_semantics.py"
      - ".github/workflows/validate-cst-saturation-semantics.yml"
  workflow_dispatch:

jobs:
  saturation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pytest
      - name: Run chart-local saturation tests
        run: PYTHONPATH=. python -m pytest -q cst_validation/test_clipping_semantics.py
