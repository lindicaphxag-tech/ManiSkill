name: Validate CCLAT native PhysX 2DoF

on:
  push:
    branches:
      - "fix/joint-delta-to-joint-pos-semantics"
    paths:
      - "cst_validation/closed_loop_transport.py"
      - "tests/test_cclat_native_physx_2dof.py"
      - ".github/workflows/validate-cclat-native-physx-2dof.yml"
  workflow_dispatch:

jobs:
  native-physx-2dof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ManiSkill test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run held-out 2DoF controller-swap assay
        run: python -m pytest -q -s tests/test_cclat_native_physx_2dof.py
