name: Seed 10014 original-code repeatability audit
on:
  push:
    branches:
      - validation/frozen-ppo-seed10014-repeatability-20261008
  workflow_dispatch:
jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers libgl1 libosmesa6
          python -m pip install --upgrade pip
          python -m pip install -e . huggingface_hub
      - name: Execute twelve independent exact-holdout-code runs
        run: |
          set -o pipefail
          python research/repeatability_seed10014.py 2>&1 | tee repeatability.log
          test -s repeatability_artifacts/repeatability.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed10014-original-holdout-repeatability
          path: |
            repeatability.log
            repeatability_artifacts/
