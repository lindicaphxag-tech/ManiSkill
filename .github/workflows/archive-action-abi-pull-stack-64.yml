          base=Path('/tmp/replay64')
          original=json.loads((base/'abi_pull_stack_prospective_aggregate.json').read_text())
          rerun=json.loads((base/'recomputed.json').read_text())
          assert original==rerun, 'unmatched numeric or nonnumeric original result'
          assert original['n_independent_tasks']==2
          assert original['total_original_task_states']==64
          a=original['results']['pull_cube']
          b=original['results']['stack_cube']
          assert a['success_by_arm']=={'source':31,'memory':17,'projected':31,'stateless':14,'naive':14}
          assert b['success_by_arm']=={'source':28,'memory':11,'projected':30,'stateless':0,'naive':0}
          assert (a['projected_only_success'],a['stateless_only_success'])==(17,0)
          assert (b['projected_only_success'],b['stateless_only_success'])==(30,0)
          assert a['status']==b['status']=='PREDECLARED_MEMORY_GAIN_PRESENT'
          print('Verified all original JSON hashes, two policies, 64 task states, every original source outcome')
          PY
      - name: Preserve all nine unmodified raw JSONs for permanent independent inspection
        run: |
          set -euo pipefail
          dest=research/frozen_policy_transfer/evidence/pull_stack_new_task_64
          mkdir -p "$dest"
          cp /tmp/replay64/abi_independent_*.json "$dest/"
          cp /tmp/replay64/abi_pull_stack_prospective_aggregate.json "$dest/"
          cat > "$dest/README.md" <<'EOF'
          # Source-pinned independent task-extension test, PullCube + StackCube
          Source: successful real PhysX Actions 37815152548 on 9ffa86c6d3a86d2cee44b6e13c560033a8b373cf.
          Frozen before code: protocol commit 582e39206cedf3565217514b1fdc1872c1cffae7.
          Two new released frozen PPOs. Every original controller/task row is copied unchanged and SHA-256 verified against this workflow.
          PullCube: source 31/32; naive 14/32; exact 17/32; memory bounded 31/32; state-blind bounded 14/32; paired memory-only 17 vs blind-only 0.
          StackCube: source 28/32; naive 0/32; exact 11/32; memory bounded 30/32; state-blind bounded 0/32; paired memory-only 30 vs blind-only 0.
          Original task competence and declared memory-gain criteria PASSED on both new task families.
          NON-EXACT bounded projections: PullCube 15, StackCube 33. This is not an exact action equivalence or safety proof.
          Owner-run simulation, NOT independent external replication, hardware transfer or general VLA performance.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"
          if git diff --cached --quiet; then
            echo 'Already source-verified and committed'
            exit 0
          fi
          git commit -m 'evidence: permanently preserve nine independent PullCube StackCube original JSONs'
          git push origin HEAD:main
