name: "Reproduce frozen same-compiler 64-seed two-ACK PhysX study (9 worlds each)"
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replay-frozen-shared-compiler-causal64-main.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze-identity-and-audit-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 12b0156be54222e4a3ecf573898ab337c046426e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail before physics if prereg, new 2x2 runner, or independent auditor has drifted
        run: |
          set -euo pipefail
          test "$(git hash-object research/SHARED_COMPILER_TWOACK_FROZEN_PPO64_PREOUTCOME_V1.json)" = b57973e28897c40125069fb0205e83b1c46d1885
          test "$(git hash-object research/frozen_ppo_mixed_ack_truth_physx.py)" = 36e672446407435e656cbf8aba6fa2de7c1e9d0e
          test "$(git hash-object research/empirical_probe_response_classifier.py)" = 064bb46831b61af73ad445bc836326837ec5468f
          test "$(git hash-object research/frozen_ppo_shared_compiler_twoack_2x2_physx.py)" = 89248363b5bc52c0568495f3f78efc58d9a1ac67
          test "$(git hash-object research/run_shared_compiler_twoack_new64.py)" = 7b1cf4a39bda292bb52980f450928942503571da
          test "$(git hash-object research/audit_shared_compiler_twoack_new64.py)" = d8a4492b2b77b0cee76edd0e4675d3d8975b9f96
          python -m py_compile research/frozen_ppo_shared_compiler_twoack_2x2_physx.py research/run_shared_compiler_twoack_new64.py research/audit_shared_compiler_twoack_new64.py
          python - <<'PY'
          import ast
          from pathlib import Path
          from research.run_shared_compiler_twoack_new64 import select,assert_preoutcome,truth
          assert_preoutcome()
          for task in ('pull_cube','stack_cube'):
              seeds=[x for c in range(4) for x in select(task,c)]
              assert len(seeds)==32 and len(set(seeds))==32
              assert set(seeds).isdisjoint(list(range(1280001,1280033))+list(range(1380001,1380033))+list(range(1390001,1390033)))
              assert {truth(x) for x in seeds}=={
                  ('applied','applied'),('applied','held'),
                  ('held','applied'),('held','held')}
              assert all(sum(truth(x)==pair for x in seeds)==8 for pair in {
                  ('applied','applied'),('applied','held'),
                  ('held','applied'),('held','held')})
          src=Path('research/frozen_ppo_shared_compiler_twoack_2x2_physx.py').read_text()
          tree=ast.parse(src)
          assert 'step==4' in src and 'step==5' in src
          assert 'shared_neutral_probe_step4' in src
          assert 't3_physically_applied' in src
          assert 'privileged_target_readback_decision_count' in src
          # The first native attempt exposed an actual t5 caching-order bug.
          # Fail before any expensive PhysX if fixed-reader cardinality is
          # determined before its authoritative resync.
          key='if n=="fault_always_single_privileged_query" and step==5:'
          start=src.index(key)
          fixed_resync=src.index('beliefs[n].require_external_resync(actual)',start)
          cardinality=src.index('maybe_two=(name_belief and len(beliefs[n].hypotheses)>1)',start)
          multi_branch=src.index('if maybe_two:',start)
          assert start < fixed_resync < cardinality < multi_branch
          assert 'POSTQUERY_SHARED_COMPILER_STATE_MACHINE_DRIFT' in src
          print('PREOUTCOME_SHARED_COMPILER_CAUSAL_GATE_GREEN')
          PY
  nine-native-worlds-per-episode:
    needs: freeze-identity-and-audit-source
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        task: [pull_cube, stack_cube]
        chunk: [0, 1, 2, 3]
    env:
      ABI_TASK: ${{ matrix.task }}
      CHUNK: ${{ matrix.chunk }}
      PYTHONUNBUFFERED: '1'
      MS_SKIP_ASSET_DOWNLOAD_PROMPT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 12b0156be54222e4a3ecf573898ab337c046426e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unchanged frozen PPO runtime and actual ManiSkill CPU PhysX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers libgl1 libosmesa6
          python -m pip install --upgrade pip
          python -m pip install -e . huggingface_hub
      - name: Freeze machine-readable execution environment
        run: |
          git rev-parse HEAD > ORIGINAL_SOURCE_COMMIT.txt
          python -m pip freeze --all > ORIGINAL_RUNTIME_PACKAGES.txt
      - name: Physically execute and independently audit 8 prospective seeds times 9 controller worlds
        run: |
          set -o pipefail
          PYTHONPATH="$PWD:$PWD/research" python research/run_shared_compiler_twoack_new64.py --task "$ABI_TASK" --chunk "$CHUNK" 2>&1 | tee original_physics_stdout.log
          test -s "sharedcompiler_${ABI_TASK}_chunk${CHUNK}_original8.json"
          test -s "sharedcompiler_${ABI_TASK}_chunk${CHUNK}_audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-shared-compiler-${{ matrix.task }}-chunk${{ matrix.chunk }}
          path: |
            sharedcompiler_*_original8.json
            sharedcompiler_*_audit.json
            original_physics_stdout.log
            ORIGINAL_SOURCE_COMMIT.txt
            ORIGINAL_RUNTIME_PACKAGES.txt
          retention-days: 90
  independent-original-all-64-audit:
    needs: nine-native-worlds-per-episode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 12b0156be54222e4a3ecf573898ab337c046426e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: original-shared-compiler-*
          merge-multiple: true
          path: /tmp/original_shared_compiler_2x2
      - name: Complete source-hash, episode, all-four-truth and all-negative audit
        run: |
          set -euo pipefail
          python -m research.audit_shared_compiler_twoack_new64 --source-dir /tmp/original_shared_compiler_2x2 --output /tmp/full_shared_compiler_original64_audit.json
          test -s /tmp/full_shared_compiler_original64_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ORIGINAL_shared_compiler_2x2_64_576_PhysX_all_negative_outcomes
          path: |
            /tmp/original_shared_compiler_2x2/*.json
            /tmp/full_shared_compiler_original64_audit.json
          retention-days: 90
