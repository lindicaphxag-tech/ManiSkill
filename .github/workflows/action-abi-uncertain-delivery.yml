name: Uncertain command delivery -- controller target belief certificate

on:
  pull_request:
    paths:
      - 'research/action_abi_uncertain_delivery_belief.py'
      - 'research/ACTION_ABI_UNCERTAIN_DELIVERY_BOUNDARY.md'
      - 'tests/test_action_abi_uncertain_delivery_belief.py'
      - '.github/workflows/action-abi-uncertain-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-set-valued-authority:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install numpy scipy
      - name: Assert uncertainty branching, preservation and exact transport authority
        run: |
          python -m py_compile research/action_abi_history_observer.py research/action_abi_uncertain_delivery_belief.py
          python -m unittest discover -s tests -p test_action_abi_uncertain_delivery_belief.py -v
