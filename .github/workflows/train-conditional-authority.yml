name: Intervention-conditioned residual-energy learning; disjoint reset calibration

on:
  push:
    branches: [research/conditional-authority-learning-20261010]
    paths:
      - research/first_source_256_public_residual_training_records.json
      - research/conditional_residual_energy.py
      - research/train_conditional_authority.py
      - tests/test_conditional_residual_energy.py
      - .github/workflows/train-conditional-authority.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze_train_cal_source_and_learn_finite_intervention_witness:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PYTHONUNBUFFERED: '1'
      MS_SKIP_ASSET_DOWNLOAD_PROMPT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lock actual original dataset before training and label split
        run: |
          set -euo pipefail
          test "$(git hash-object research/first_source_256_public_residual_training_records.json)" = e0483afeb5d885fa17a4078fed0da5c70dd4b0bd
          python -m py_compile research/conditional_residual_energy.py research/train_conditional_authority.py tests/test_conditional_residual_energy.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/first_source_256_public_residual_training_records.json').read_text())
          assert d['actual_physx_source_workflow_run']==38014679801
          assert d['independent_source_sha_review_run']==38015149933
          assert len(d['rows'])==256
          for task,start in (('pull_cube',4100000),('stack_cube',4200000)):
              r=[x for x in d['rows'] if x['task']==task]
              assert len(r)==128
              assert {x['seed'] for x in r}==set(range(start+1,start+17))
              assert len([x for x in r if x['seed']<=start+8])==64
          print('TRAIN_AND_CALIBRATION_RESET_CLUSTERS_FROZEN_NO_FUTURE_TEST_LABELS')
          PY
      - name: Install differentiable equivariant energy modeling runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Source-only online inference leakage and equivariance adversarial tests
        run: |
          python -m unittest discover -s tests -p 'test_conditional_residual_energy.py' -v
      - name: Fit and compare true models on only original SOURCE reset clusters
        shell: bash
        run: |
          set -o pipefail
          python -m research.train_conditional_authority --output-dir train_only_original_frozen_model --steps 300 2>&1 | tee TRAIN_ONLY_FIRST_LOG.txt
          test -s train_only_original_frozen_model/model_registry.json
          (cd train_only_original_frozen_model && sha256sum *.pt model_registry.json > ORIGINAL_TRAIN_ONLY_SHA256SUMS.txt)
      - name: Preserve candidate full/no-action/no-consistency/no-robustness weights and disjoint calibration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-source-only-conditional-authority-trained-models
          retention-days: 90
          path: |
            train_only_original_frozen_model/
            TRAIN_ONLY_FIRST_LOG.txt
