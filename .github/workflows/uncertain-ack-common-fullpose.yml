name: Two-history source-target common full-pose controller certificate
on:
  push:
    branches: [research/uncertain-ack-common-goal-authority-20261014]
    paths:
      - research/common_two_history_pose.py
      - tests/test_common_two_history_pose.py
      - .github/workflows/uncertain-ack-common-fullpose.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-platform-so3:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install numpy scipy pytest
      - run: python -m pytest -q tests/test_common_two_history_pose.py
