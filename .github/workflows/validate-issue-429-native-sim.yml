name: Validate issue 429 native simulator

on:
  push:
    branches:
      - "validation/issue-429-native-sim-v1"
    paths:
      - "mani_skill/trajectory/utils/actions/conversion.py"
      - "tests/test_pd_joint_delta_to_pos_native_sim.py"
      - ".github/workflows/validate-issue-429-native-sim.yml"
  workflow_dispatch:

jobs:
  native-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ManiSkill test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run native PickCube controller-equivalence assay
        env:
          DISPLAY: ""
        run: |
          python -m pytest -q tests/test_pd_joint_delta_to_pos_native_sim.py -vv
