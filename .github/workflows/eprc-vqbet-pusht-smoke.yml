name: EPRC VQ-BeT PushT Public Policy Smoke

on:
  pull_request:
    paths:
      - "research/eprc/public_policy/vqbet_pusht_dec_smoke.py"
      - ".github/workflows/eprc-vqbet-pusht-smoke.yml"
  workflow_dispatch:

concurrency:
  group: eprc-vqbet-pusht-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vqbet-pusht:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout pinned LeRobot
        run: |
          git clone --depth 1 https://github.com/huggingface/lerobot.git /tmp/lerobot
          cd /tmp/lerobot
          git fetch --depth 1 origin 8c920c4270460851cedd2737657584586d3dc66f
          git checkout 8c920c4270460851cedd2737657584586d3dc66f
      - name: Install pinned public-policy stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "/tmp/lerobot[pusht]"
      - name: Run official VQ-BeT PushT intervention smoke
        run: |
          python research/eprc/public_policy/vqbet_pusht_dec_smoke.py             --output /tmp/vqbet_pusht_dec_smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vqbet-pusht-dec-smoke
          path: /tmp/vqbet_pusht_dec_smoke.json
          if-no-files-found: warn
