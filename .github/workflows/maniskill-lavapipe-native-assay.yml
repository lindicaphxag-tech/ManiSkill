name: ManiSkill exact-head renderless PhysX CPU proof

on:
  push:
    branches: [research/native-delta-pose-assay]
    paths:
      - "research/kaggle_native_assay/lavapipe_production_semantics_smoke.py"
      - ".github/workflows/maniskill-lavapipe-native-assay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-native:
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    env:
      MS_SKIP_ASSET_DOWNLOAD_PROMPT: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Freeze exact current public upstream PR source
        run: |
          cp research/kaggle_native_assay/lavapipe_production_semantics_smoke.py /tmp/pr1495_native_smoke.py
          git fetch --no-tags --depth=1 https://github.com/mani-skill/ManiSkill.git 69facfaafaa0ef233d36ef19e6cd9a0f03532ee0
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "69facfaafaa0ef233d36ef19e6cd9a0f03532ee0"
      - name: Install actual CPU native controller dependency stack
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest
      - name: Run actual converter tests at exact source commit
        run: python -m pytest -q tests/test_action_conversion.py
      - name: Test real initialized production controller and PhysX CPU step
        run: |
          set -o pipefail
          python /tmp/pr1495_native_smoke.py 2>&1 | tee native_controller_console.log
          test -s native_cpu_controller_parity.json
      - name: Retain environment result or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1495-cpu-vulkan-attempt
          if-no-files-found: warn
          path: |
            native_controller_console.log
            native_cpu_controller_parity.json
