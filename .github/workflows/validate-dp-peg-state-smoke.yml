name: PegInsertion DP paired state smoke

on:
  push:
    branches:
      - validation/dp-peg-state-smoke-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-state-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run paired state-only smoke
        env:
          SEMREPAIR_DP_SMOKE: "1"
        run: |
          python research/kaggle_diffusion_policy_peg/run_assay.py

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dp-peg-state-smoke
          path: ${{ runner.temp }}/semrepair_dp_smoke/assay_output
          if-no-files-found: warn
