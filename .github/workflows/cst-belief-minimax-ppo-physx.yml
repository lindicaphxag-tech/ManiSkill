name: Prospectively frozen two-world belief-minimax PPO PhysX

on:
  pull_request:
    paths:
      - 'research/frozen_ppo_belief_minimax_recovery.py'
      - 'research/CST_BELIEF_MINIMAX_PROSPECTIVE_64_V1.json'
      - '.github/workflows/cst-belief-minimax-ppo-physx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predeclared-real-physx:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        task: [pull_cube, stack_cube]
        fault: [applied_no_ack, neutral_arm_delta_no_ack]
        chunk: [0, 1]
    env:
      ABI_TASK: ${{ matrix.task }}
      ABI_FAULT: ${{ matrix.fault }}
      ABI_CHUNK: ${{ matrix.chunk }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce immutable preregistered frozen method and compile evaluator
        run: |
          test "$(git hash-object research/CST_BELIEF_MINIMAX_PROSPECTIVE_64_V1.json)" = "b5b2b03a45919d39aa37e38a20bf1ce2deb557a2"
          python -m py_compile research/frozen_ppo_belief_minimax_recovery.py
      - name: Install official ManiSkill PhysX CPU and frozen-PPO checkpoint client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers libgl1 libosmesa6
          python -m pip install --upgrade pip
          python -m pip install -e . huggingface_hub
          python -m pip freeze > cst_minimax_pip_freeze.txt
      - name: Run full original PhysX paired eight-seed unknown-ACK experiment
        run: |
          set -o pipefail
          PYTHONPATH="$PWD:$PWD/research" python research/frozen_ppo_belief_minimax_recovery.py 2>&1 | tee cst_minimax_original.log
          test -s belief_minimax_${ABI_TASK}_${ABI_FAULT}_chunk${ABI_CHUNK}_fresh8.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimax-original-${{ matrix.task }}-${{ matrix.fault }}-chunk-${{ matrix.chunk }}
          path: |
            belief_minimax_*.json
            cst_minimax_original.log
            cst_minimax_pip_freeze.txt
          retention-days: 90
