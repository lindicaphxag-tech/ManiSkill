          test -s "/tmp/public-or-read-source/public-or-read-native-stack_cube-neutral_arm_delta_no_ack-part-0/public_or_read_stack_cube_neutral_arm_delta_no_ack_0_fresh4.json" && cp "/tmp/public-or-read-source/public-or-read-native-stack_cube-neutral_arm_delta_no_ack-part-0/public_or_read_stack_cube_neutral_arm_delta_no_ack_0_fresh4.json" "/tmp/public-or-read-exact/public_or_read_stack_cube_neutral_arm_delta_no_ack_0_fresh4.json"
          test -s "/tmp/public-or-read-source/public-or-read-native-stack_cube-neutral_arm_delta_no_ack-part-4/public_or_read_stack_cube_neutral_arm_delta_no_ack_4_fresh4.json" && cp "/tmp/public-or-read-source/public-or-read-native-stack_cube-neutral_arm_delta_no_ack-part-4/public_or_read_stack_cube_neutral_arm_delta_no_ack_4_fresh4.json" "/tmp/public-or-read-exact/public_or_read_stack_cube_neutral_arm_delta_no_ack_4_fresh4.json"
          python -m research.audit_public_response_or_read32 --input-dir /tmp/public-or-read-exact --output /tmp/public-or-read-original-audit.json
          python - <<'PY'
          import tempfile, shutil, json
          from pathlib import Path
          from research.audit_public_response_or_read32 import audit
          src=Path('/tmp/public-or-read-exact')
          files=sorted(src.glob('*.json'))
          assert len(files)==8
          x=audit(src)
          assert x['total_task_seed_fault_conditions']==32
          assert x['unique_reset_states']==16
          assert x['hybrid_privileged_reads']==11
          assert x['privileged_always_reads']==32
          assert x['hybrid_decided_by_public']==21
          assert x['hybrid_false_confident_labels']==0
          assert x['native_task_success']['PUBLIC_FIT_OR_EXPLICIT_ONE_PRIVATE_READ']==27
          assert x['native_task_success']['privileged_once_after_probe']==27
          assert x['paired_hybrid_only']==0 and x['paired_authority_only']==0
          for tamper in ('remove','flip_task_success','hide_private_read','duplicate_seed','fabricate_public_label'):
              with tempfile.TemporaryDirectory() as d:
                  q=Path(d)/'mutated'
                  shutil.copytree(src,q)
                  f=q/files[0].name
                  if tamper=='remove':f.unlink()
                  else:
                      j=json.loads(f.read_text())
                      row=j['rows'][0]
                      if tamper=='flip_task_success':
                          k='PUBLIC_FIT_OR_EXPLICIT_ONE_PRIVATE_READ'
                          row['success_once'][k]=not row['success_once'][k]
                      if tamper=='hide_private_read':
                          row['private_memory_reads_during_action_decision']['privileged_once_after_probe']=0
                      if tamper=='duplicate_seed':
                          row['seed']=j['rows'][1]['seed']
                      if tamper=='fabricate_public_label':
                          h=row['hybrid_classifier']
                          h['empirical_response_epsilon_m']=5.0
                      f.write_text(json.dumps(j))
                  try:audit(q); raise AssertionError('Auditor accepted tampering '+tamper)
                  except ValueError:pass
          print('PASS all eight original source SHA archives, complete 32 paired conditions and five deliberate data corruption attacks')
          PY
