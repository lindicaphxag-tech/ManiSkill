name: Archive and adversarially audit original public-evidence-or-read32 PhysX

on:
  pull_request:
    paths:
      - '.github/workflows/archive-public-or-read-new32-original.yml'
      - 'research/audit_public_response_or_read32.py'
      - 'research/PHYSICAL_RESPONSE_OR_READ32_PREDECLARED_V1.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-public-or-read-new32-original.yml'
      - 'research/audit_public_response_or_read32.py'
      - 'research/PHYSICAL_RESPONSE_OR_READ32_PREDECLARED_V1.json'

permissions:
  contents: read
  actions: read

jobs:
  source-provenance-and-five-adversarial-tamper-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact original 8 PhysX source ZIP digests, all truth labels and privilege ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object research/PHYSICAL_RESPONSE_OR_READ32_PREDECLARED_V1.json)" = "bdcad7dff2fbe55ef7f1215f15adcda9d7372407"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37834088246 --jq .head_sha)" = "f1423b307ed37c2e6413868d3213412424c6dc97"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37834088246 --jq .conclusion)" = "success"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11575141229 --jq .digest)" = "sha256:23bc95132925cbbc5ccd88c2cd00fd9437e3adf4afe52a87d31371bb9bf68695"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11575580533 --jq .digest)" = "sha256:2c903ed05acc6d3af178630eb305d66772c9bdad126cdfd72f5ff995dc037040"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11575505568 --jq .digest)" = "sha256:8bab08d037e19655d832cf3cc2bf32deed49c9bfd36818702271f9d6daa5e822"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11574119834 --jq .digest)" = "sha256:376cba6c4566a6ba124de412766d635ef3640791366aeb6282b327d82611be65"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11574817153 --jq .digest)" = "sha256:8f2be3d5f2815ebb1a84424a99b808b2e764ec7c65cf7c8ac84dd6a4a300789e"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11575835044 --jq .digest)" = "sha256:afccd7126a6dd2ac05f5cc072d9523d10b3f021afaccbce83d4f3050f88a909d"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11574911831 --jq .digest)" = "sha256:23d6b82d51dfba3c327f1e8cd3e744a55c3b16af17ce1e3659a4e4fb9b88de30"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11575725221 --jq .digest)" = "sha256:a922c65a92a61c111114340f75d9b2bc991ae39638aa304ca06356711097d53b"
          mkdir -p /tmp/public-or-read-source /tmp/public-or-read-exact
          gh run download 37834088246 --repo "$GITHUB_REPOSITORY" --pattern "public-or-read-native-*" --dir /tmp/public-or-read-source
          test -s "/tmp/public-or-read-source/public-or-read-native-pull_cube-applied_no_ack-part-0/public_or_read_pull_cube_applied_no_ack_0_fresh4.json" && cp "/tmp/public-or-read-source/public-or-read-native-pull_cube-applied_no_ack-part-0/public_or_read_pull_cube_applied_no_ack_0_fresh4.json" "/tmp/public-or-read-exact/public_or_read_pull_cube_applied_no_ack_0_fresh4.json"
