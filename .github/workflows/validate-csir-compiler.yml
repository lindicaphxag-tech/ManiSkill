name: Validate CSIR compiler

on:
  push:
    branches:
      - "fix/joint-delta-to-joint-pos-semantics"
    paths:
      - "cst_validation/controller_semantic_ir.py"
      - "cst_validation/test_controller_semantic_ir.py"
      - ".github/workflows/validate-csir-compiler.yml"
  workflow_dispatch:

jobs:
  csir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pytest
      - name: Run CSIR compiler tests
        working-directory: cst_validation
        run: |
          python -m py_compile controller_semantic_ir.py
          python -m pytest -vv test_controller_semantic_ir.py
