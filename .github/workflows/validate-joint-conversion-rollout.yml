name: Validate joint conversion simulator trace

on:
  push:
    branches:
      - "fix/joint-delta-to-joint-pos-semantics"
    paths:
      - ".github/workflows/validate-joint-conversion-rollout.yml"

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ManiSkill
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compare converted controller targets and simulator state
        env:
          MS_ASSET_DOWNLOAD_PROMPT: "0"
        run: |
          python - <<'PY'
          import numpy as np
          import gymnasium as gym
          import mani_skill.envs
          from mani_skill.trajectory.utils.actions.conversion import from_pd_joint_delta_pos

          common = dict(
              obs_mode="state",
              num_envs=1,
              sim_backend="physx_cpu",
              render_backend="none",
          )
          source = gym.make(
              "PickCube-v1",
              control_mode="pd_joint_delta_pos",
              **common,
          )
          target = gym.make(
              "PickCube-v1",
              control_mode="pd_joint_pos",
              **common,
          )
          try:
              source.reset(seed=23)
              target.reset(seed=23)
              target.unwrapped.set_state_dict(source.unwrapped.get_state_dict())

              controller = source.unwrapped.agent.controller
              dim = controller.single_action_space.shape[0]
              actions = np.zeros((4, dim), dtype=np.float32)
              actions[:, :7] = np.asarray(
                  [
                      [0.20, -0.10, 0.05, 0.00, 0.10, -0.05, 0.02],
                      [-0.10, 0.15, 0.00, -0.05, 0.02, 0.04, -0.03],
                      [0.05, 0.00, -0.08, 0.06, -0.04, 0.03, 0.01],
                      [0.00, -0.05, 0.10, -0.02, 0.03, -0.01, 0.04],
                  ],
                  dtype=np.float32,
              )
              if dim > 7:
                  actions[:, 7:] = 0.0

              from_pd_joint_delta_pos(
                  output_mode="pd_joint_pos",
                  ori_actions=actions,
                  ori_env=source,
                  env=target,
                  verbose=True,
              )

              source_arm = source.unwrapped.agent.controller.controllers["arm"]
              target_arm = target.unwrapped.agent.controller.controllers["arm"]
              source_target = source_arm._target_qpos.detach().cpu().numpy()
              target_target = target_arm._target_qpos.detach().cpu().numpy()
              target_error = float(np.max(np.abs(source_target - target_target)))

              source_qpos = source_arm.qpos.detach().cpu().numpy()
              target_qpos = target_arm.qpos.detach().cpu().numpy()
              state_error = float(np.max(np.abs(source_qpos - target_qpos)))

              print(f"TARGET_QPOS_MAX_ABS_ERROR={target_error:.12g}")
              print(f"REALIZED_QPOS_MAX_ABS_ERROR={state_error:.12g}")
              if target_error > 1e-7:
                  raise SystemExit("converted controller targets are not equivalent")
              if state_error > 1e-5:
                  raise SystemExit("simulator joint traces diverged beyond tolerance")
          finally:
              source.close()
              target.close()
          PY
