name: PegInsertion locked 100-199 holdout four-arm replay

on:
  push:
    branches: [fix/peg-heldout-source-selection-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peg-heldout-fixed-v2
  cancel-in-progress: true

jobs:
  four-cell-replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      SEMREPAIR_DP_SMOKE: "1"
      SEMREPAIR_DP_FACTORIAL_REPLAY: "1"
      SEMREPAIR_DP_FACTORIAL_SAMPLE_SIZE: "100"
      SEMREPAIR_DP_FACTORIAL_OFFSET: "100"
      PYTHONFAULTHANDLER: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: "llvmpipe"
      VK_ICD_FILENAMES: "/usr/share/vulkan/icd.d/lvp_icd.x86_64.json"
      VK_DRIVER_FILES: "/usr/share/vulkan/icd.d/lvp_icd.x86_64.json"
      MESA_VK_DEVICE_SELECT: "10005:0000"
    steps:
      - uses: actions/checkout@v4
      - name: Install headless software Vulkan and record physical rendering driver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             libvulkan1 mesa-vulkan-drivers vulkan-tools libegl1 libgl1
          test -f "$VK_ICD_FILENAMES"
          vulkaninfo --summary 2>&1 | tee /tmp/semrepair-vulkaninfo.txt
          grep -E -i 'llvmpipe|lavapipe|software' /tmp/semrepair-vulkaninfo.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only Torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Enforce locked source cohort indices 100 through 199
        shell: bash
        run: |
          set -euo pipefail
          test "$SEMREPAIR_DP_FACTORIAL_OFFSET" = "100"
          test "$SEMREPAIR_DP_FACTORIAL_SAMPLE_SIZE" = "100"
          python -m py_compile research/kaggle_diffusion_policy_peg/run_assay.py
          grep -q 'source_offset:source_offset + CONFIG\["replay_count"\]' research/kaggle_diffusion_policy_peg/run_assay.py
      - name: Test exact source trajectory slicing before expensive replay
        run: |
          python -m pip install h5py
          python research/kaggle_diffusion_policy_peg/slice_source_cohort.py
      - name: Replay all four exact-code factor cells and freeze source-seed matrix
        shell: bash
        run: |
          set -o pipefail
          python research/kaggle_diffusion_policy_peg/run_assay.py 2>&1 | tee /tmp/semrepair-dp-lavapipe.log
      - name: Upload complete factorial outcome and raw logs even if a cell fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dp-peg-heldout-fixed-v2
          path: |
            ${{ runner.temp }}/semrepair_dp_smoke/assay_output/
            /tmp/semrepair-vulkaninfo.txt
            /tmp/semrepair-dp-lavapipe.log
          if-no-files-found: warn
