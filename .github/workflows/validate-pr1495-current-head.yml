name: Validate PR1495 current head

on:
  push:
    branches:
      - "validation/pr1495-current-head-v1"
  pull_request:
    paths:
      - "mani_skill/trajectory/utils/actions/conversion.py"
      - "tests/test_action_conversion.py"
      - ".github/workflows/validate-pr1495-current-head.yml"
  workflow_dispatch:

jobs:
  exact-head:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Assert production files match upstream PR head
        run: |
          git diff --exit-code 69facfaafaa0ef233d36ef19e6cd9a0f03532ee0 --             mani_skill/trajectory/utils/actions/conversion.py             tests/test_action_conversion.py

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ManiSkill
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run focused exact-head regression suite
        run: |
          python -m pytest -q tests/test_action_conversion.py

      - name: Compile touched files
        run: |
          python -m py_compile             mani_skill/trajectory/utils/actions/conversion.py             tests/test_action_conversion.py

      - name: Diff check
        run: git diff --check
