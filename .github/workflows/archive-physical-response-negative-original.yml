name: Archive original 32-state achieved-pose inference falsification
on:
  pull_request:
    paths:
      - '.github/workflows/archive-physical-response-negative-original.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-physical-response-negative-original.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-32-readonly-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticated original 10/10 PhysX source, immutable ZIP and all 32 rows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object research/frozen_ppo_physical_response_ack.py)" = "06a6cc465c4f0cd896ddc6e761f291c1e8287417"
          test "$(git hash-object research/PHYSICAL_RESPONSE_ACK_PROSPECTIVE_V1.json)" = "de2109c36cbb767ee1a4af11c981f1256ed60eac"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37829520809 --jq .head_sha)" = "1200105601326dce541cebdd037770472300b0b8"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37829520809 --jq .conclusion)" = "success"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11573696512 --jq .digest)" = "sha256:b2bc10d9f2217ccff8b49b771d2e53be23ea631377160e66f03947f8e7e4a9b7"
          mkdir -p /tmp/probe-raw /tmp/probe-exact
          gh run download 37829520809 --repo "$GITHUB_REPOSITORY" --name original-32-causal-physical-probe-full-audit --dir /tmp/probe-raw
          for task in pull_cube stack_cube; do
            for fault in applied_no_ack neutral_arm_delta_no_ack; do
              for shard in 0 4; do
                name="physical_response_${task}_${fault}_${shard}_fresh4.json"
                test "$(find /tmp/probe-raw -type f -name "$name" | wc -l)" -eq 1
                find /tmp/probe-raw -type f -name "$name" -exec cp -t /tmp/probe-exact {} +
                test -s "/tmp/probe-exact/$name"
              done
            done
          done
          test "$(find /tmp/probe-raw -type f -name full-32-source-auditor.json | wc -l)" -eq 1
          find /tmp/probe-raw -type f -name full-32-source-auditor.json -exec cp -t /tmp/probe-exact {} +
          python -m research.audit_physical_response_32 --input-dir /tmp/probe-exact --output /tmp/probe-recomputed.json
          cmp /tmp/probe-exact/full-32-source-auditor.json /tmp/probe-recomputed.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/probe-recomputed.json'))
          a=list(d['results'].values())
          assert d['trial_conditions']==32 and len(a)==8
          assert sum(x['paired_fault_exposed'] for x in a)==32
          assert sum(x['classifier_covered'] for x in a)==32
          assert sum(x['classifier_wrong_authorizations'] for x in a)==15
          expected={'achieved_probe_classifier':19,'blind_probe_optimistic':21,'blind_probe_pessimistic':18,
                    'privileged_once_after_probe':28,'source_pause_no_fault':28}
          assert {k:sum(x['success'][k] for x in a) for k in expected}==expected
          print('AUDITED ORIGINAL 32-state PhysX, 15 wrong history guesses')
          PY
          python -m unittest discover -s tests -p test_physical_response_32.py -v

  trusted-main-permanent-exact-source:
    if: github.event_name != 'pull_request'
    needs: original-32-readonly-validation
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently re-verify exact original before any trusted write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object research/frozen_ppo_physical_response_ack.py)" = "06a6cc465c4f0cd896ddc6e761f291c1e8287417"
          test "$(git hash-object research/PHYSICAL_RESPONSE_ACK_PROSPECTIVE_V1.json)" = "de2109c36cbb767ee1a4af11c981f1256ed60eac"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37829520809 --jq .head_sha)" = "1200105601326dce541cebdd037770472300b0b8"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37829520809 --jq .conclusion)" = "success"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11573696512 --jq .digest)" = "sha256:b2bc10d9f2217ccff8b49b771d2e53be23ea631377160e66f03947f8e7e4a9b7"
          mkdir -p /tmp/probe-raw /tmp/probe-exact
          gh run download 37829520809 --repo "$GITHUB_REPOSITORY" --name original-32-causal-physical-probe-full-audit --dir /tmp/probe-raw
          for task in pull_cube stack_cube; do
            for fault in applied_no_ack neutral_arm_delta_no_ack; do
              for shard in 0 4; do
                name="physical_response_${task}_${fault}_${shard}_fresh4.json"
                test "$(find /tmp/probe-raw -type f -name "$name" | wc -l)" -eq 1
                find /tmp/probe-raw -type f -name "$name" -exec cp -t /tmp/probe-exact {} +
                test -s "/tmp/probe-exact/$name"
              done
            done
          done
          test "$(find /tmp/probe-raw -type f -name full-32-source-auditor.json | wc -l)" -eq 1
          find /tmp/probe-raw -type f -name full-32-source-auditor.json -exec cp -t /tmp/probe-exact {} +
          python -m research.audit_physical_response_32 --input-dir /tmp/probe-exact --output /tmp/probe-recomputed.json
          cmp /tmp/probe-exact/full-32-source-auditor.json /tmp/probe-recomputed.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/probe-recomputed.json'))
          a=list(d['results'].values())
          assert d['trial_conditions']==32 and len(a)==8
          assert sum(x['paired_fault_exposed'] for x in a)==32
          assert sum(x['classifier_covered'] for x in a)==32
          assert sum(x['classifier_wrong_authorizations'] for x in a)==15
          expected={'achieved_probe_classifier':19,'blind_probe_optimistic':21,'blind_probe_pessimistic':18,
                    'privileged_once_after_probe':28,'source_pause_no_fault':28}
          assert {k:sum(x['success'][k] for x in a) for k in expected}==expected
          print('AUDITED ORIGINAL 32-state PhysX, 15 wrong history guesses')
          PY
          python -m unittest discover -s tests -p test_physical_response_32.py -v
      - name: Persist 8 original source JSONs, original full auditor and SHA256SUMS
        run: |
          set -euo pipefail
          dest=research/frozen_policy_transfer/evidence/physical_response_negative_32_140001_150008
          mkdir -p "$dest"
          cp /tmp/probe-exact/*.json "$dest/"
          (cd "$dest" && sha256sum *.json > SHA256SUMS && sha256sum -c SHA256SUMS)
          cat > "$dest/README.md" <<'EOF'
          # Preregistered 32-state real PhysX physical-response observer NEGATIVE result
          Original pre-outcome protocol f237fadb70895bc94889f3ff44cb6c41d296b323, immutable protocol blob de2109c36cbb767ee1a4af11c981f1256ed60eac.
          Original exact method blob 06a6cc465c4f0cd896ddc6e761f291c1e8287417, full real PhysX run 37829520809, successful exact source head 1200105601326dce541cebdd037770472300b0b8.
          Original complete source archive artifact 11573696512, original ZIP SHA256 b2bc10d9f2217ccff8b49b771d2e53be23ea631377160e66f03947f8e7e4a9b7.
          Eight original four-state per-condition JSONs and one original complete auditor JSON copied BYTE FOR BYTE; SHA256SUMS pins all nine files.
          This is a FAILED public achieved-pose-nearest-target ACK history classifier, NOT a working general state estimator. It made 15 WRONG confident history authorizations out of 32 official task conditions, although 19 of 32 task flags succeeded.
          Both physical ACK execution truths, two genuine frozen third-party ActionShift PPO policies, zero-training, all 32 fault/probe exposures and every original failure are retained.
          Official source task success /32: achieved-only 19, equal-probe optimistic 21, equal-probe pessimistic 18, one privileged state read after equal probe 28, fault-free source 28.
          Privileged state read adds information; not a fair equal-information comparison. Native zero-arm-delta delivery is not real network loss, real-robot testing or hardware safety.
          No independent outside researcher, robot-family policy transfer or accepted upstream research paper is claimed.
          To audit: sha256sum -c SHA256SUMS (from this folder); python -m research.audit_physical_response_32 --input-dir THIS_FOLDER --output /tmp/independent.json (from repository root).
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"
          if git diff --cached --quiet; then echo 'Already archived'; exit 0; fi
          git commit -m 'evidence: preserve exact original 32 real PhysX failed ACK-history probe records'
          git pull --rebase origin main
          git push origin HEAD:main
