name: Validate joint action conversion

on:
  push:
    branches:
      - "fix/joint-delta-to-joint-pos-semantics"
    paths:
      - "mani_skill/trajectory/utils/actions/conversion.py"
      - "tests/test_action_conversion_joint_semantics.py"
      - ".github/workflows/validate-joint-action-conversion.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile conversion module
        run: python -m py_compile mani_skill/trajectory/utils/actions/conversion.py
      - name: Run joint conversion semantic tests
        run: python -m pytest -q tests/test_action_conversion_joint_semantics.py
