name: 'RECOVER original 2304 PhysX worlds: first 256-cell independent frozen audit only'
on:
  push:
    branches: [research/confirmatory-256-original-source-recovery-20261009]
    paths:
      - .github/workflows/recover-first-original-confirmatory-256.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  immutable_first_run_all256_independent_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve original unsuccessful FIRST CI and 32 genuinely completed PhysX physical shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37934425888 --jq .head_sha)" = 4fcef52271c93f30447f9c76bf5604fd01642c10
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37934425888 --jq .conclusion)" = failure
          test "$(git hash-object research/CONFIRMATORY_FOUR_TRUTH_NEW64CLUSTERS_PREOUTCOME_V1.json)" = ac563f4d2594c4d791b257c19e0a940393261fe8
          test "$(git hash-object research/frozen_ppo_numeric_parity_factorial_physx.py)" = 8022ab3a0d5bc97a982e78fc8ca17931aeae586c
          test "$(git hash-object research/run_confirmatory_four_truth_new64clusters.py)" = 2a9fcf978a84d22b1125930c26041c36f58ef418
          test "$(git hash-object research/audit_confirmatory_four_truth_new64clusters.py)" = 861100f728a4e0f7a8ac1f8ad027dc299c09de95
          python -m py_compile research/audit_confirmatory_four_truth_new64clusters.py research/run_confirmatory_four_truth_new64clusters.py
          test "$(gh api 'repos/'"$GITHUB_REPOSITORY"'/actions/runs/37934425888/artifacts?per_page=100' --jq '[.artifacts[] | select(.name | startswith("factorial-"))] | length')" = 32
      - name: Download ALL 32 original physically stepped shards without modification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/first_256_zip /tmp/first_256_orig
          gh run download 37934425888 --repo "$GITHUB_REPOSITORY" --pattern 'factorial-*' --dir /tmp/first_256_zip
          find /tmp/first_256_zip -type f \( -name 'factorial_*_original8.json' -o -name 'factorial_*_audit.json' \) -exec cp '{}' /tmp/first_256_orig/ \;
          test "$(find /tmp/first_256_orig -maxdepth 1 -name 'factorial_*_original8.json' | wc -l)" -eq 32
          test "$(find /tmp/first_256_orig -maxdepth 1 -name 'factorial_*_audit.json' | wc -l)" -eq 32
      - name: Audit ONLY the 256-case preregistered frozen complete original per-seed evidence
        run: |
          set -euo pipefail
          python -m research.audit_confirmatory_four_truth_new64clusters --source-dir /tmp/first_256_orig --output /tmp/recovered_all256_first_physx.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/recovered_all256_first_physx.json'))
          assert d['registered_source_reset_clusters']==64
          assert d['registered_task_seed_truth_cells']==256
          assert d['separate_physx_worlds']==2304
          assert len(d['complete_32_shard_sha256'])==64
          assert d['numerically_matched_public_source_observation_per_truth_verified']
          assert d['numeric_max_public_policy_obs_gap']<=5e-5
          assert d['numeric_max_initial_achieved_ee_pose_gap']<=5e-5
          assert sum(d['paired_public_vs_strong'].values())==256
          score=d['method_success_delta_public_minus_strong_per_cell']
          p=d['seed_cluster_exact_swap_two_sided_sensitivity_p_not_randomized_proof']
          print('FIRST_ORIGINAL_256_TRUE_PHYSX_CONFIRMATORY_RESULT',json.dumps({'64_source_clusters':64,'256_real_truth_cells':256,'2304_native_comparison_worlds':2304,'same_start_numeric_verified':True,'orig_tasks':d['primary_outcomes'],'paired':d['paired_public_vs_strong'],'sample_cost':d['total_public_xyz_sample_events'],'incorrect_authorizations':d['public_wrong_confident_count'],'incomplete_two_fault_exposure':d['incomplete_both_fault_exposure_count'],'observed_effect':score,'cluster_swap_sensitivity_p':p,'pre_registered_practical_effect_geq_004':score>=0.04,'descriptive_p_leq_005':p<=0.05,'author_run_only':True,'native_t3_command_abi_also_matched_NOT_PROVEN':True},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-first-original-256-64cluster-physical-independent-audit
          path: |
            /tmp/recovered_all256_first_physx.json
          retention-days: 90
