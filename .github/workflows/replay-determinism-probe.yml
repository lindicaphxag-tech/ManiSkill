name: Replay determinism probe

on:
  push:
    branches:
      - "validation/maniskill1495-maintainer-request"
    paths:
      - "validation/pr1495/run_replay_determinism_probe.sh"
      - "validation/pr1495/summarize_replay_determinism_probe.py"
      - ".github/workflows/replay-determinism-probe.yml"
  pull_request:
    paths:
      - "validation/pr1495/run_replay_determinism_probe.sh"
      - "validation/pr1495/summarize_replay_determinism_probe.py"
      - ".github/workflows/replay-determinism-probe.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  determinism-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 mesa-vulkan-drivers vulkan-tools
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n1)"
          test -n "$LVP_ICD"
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$LVP_ICD" vulkaninfo --summary

      - name: Run repeatability probe
        env:
          REPEATS: "5"
          COUNT: "10"
          MS_SKIP_ASSET_DOWNLOAD_PROMPT: "1"
        run: bash validation/pr1495/run_replay_determinism_probe.sh

      - name: Publish probe
        if: always()
        run: |
          if [[ -f .validation-replay-determinism/replay_determinism_probe.json ]]; then
            cat .validation-replay-determinism/replay_determinism_probe.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-determinism-probe
          path: .validation-replay-determinism/replay_determinism_probe.json
          if-no-files-found: warn
          include-hidden-files: true
