name: Controller-contract adapter v2 PickCube 100-demo gate

on:
  push:
    branches:
      - validation/controller-contract-adapter-v2-pickcube
    paths:
      - "validation/controller_contract_v2/**"
      - ".github/workflows/controller-contract-v2-pickcube.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pickcube-100:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 mesa-vulkan-drivers vulkan-tools
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n1)"
          test -n "$LVP_ICD"
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$LVP_ICD" vulkaninfo --summary
      - name: Run externally specified PickCube cross-task gate
        env:
          COUNT: "100"
          MS_SKIP_ASSET_DOWNLOAD_PROMPT: "1"
        run: bash validation/controller_contract_v2/run_pickcube_100.sh
      - name: Publish result
        if: always()
        run: |
          if [[ -f .validation-contract-adapter-v2-pickcube/pickcube_100_demo_gate.json ]]; then
            cat .validation-contract-adapter-v2-pickcube/pickcube_100_demo_gate.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controller-contract-v2-pickcube-100
          path: .validation-contract-adapter-v2-pickcube/pickcube_100_demo_gate.json
          if-no-files-found: warn
