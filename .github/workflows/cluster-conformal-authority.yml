name: Cluster conformal authority - actual repeated ACK reset unit

on:
  push:
    branches: [research/conditional-authority-learning-20261010]
    paths:
      - research/cluster_conformal_authority.py
      - tests/test_cluster_conformal_authority.py
      - .github/workflows/cluster-conformal-authority.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit_non_iid_truth_repetitions_and_conformal_coverage:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest,windows-latest,macos-latest]
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate exact finite sample calibration / no dataset multiplier
        run: python -m unittest discover -s tests -p test_cluster_conformal_authority.py -v
