name: ManiSkill compensating semantic defects matrix

on:
  push:
    branches:
      - "validation/maniskill1495-maintainer-request"
    paths:
      - "validation/pr1495/run_compensating_defects_matrix.sh"
      - "validation/pr1495/summarize_replay_matrix.py"
      - ".github/workflows/maniskill1495-compensating-defects.yml"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 mesa-vulkan-drivers vulkan-tools
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n1)"
          test -n "$LVP_ICD"
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$LVP_ICD" vulkaninfo --summary
      - name: Run four-way paired replay matrix
        env:
          COUNT: "10"
          MS_SKIP_ASSET_DOWNLOAD_PROMPT: "1"
        run: bash validation/pr1495/run_compensating_defects_matrix.sh
      - name: Publish matrix
        if: always()
        run: |
          test ! -f .validation-pr1495-compensating/compensating_defects_matrix.json || cat .validation-pr1495-compensating/compensating_defects_matrix.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maniskill-compensating-semantic-defects-matrix
          path: .validation-pr1495-compensating/compensating_defects_matrix.json
          if-no-files-found: warn
