name: PR1495 fresh temporal admissibility

on:
  pull_request:
    paths:
      - "mani_skill/trajectory/utils/actions/conversion.py"
      - ".github/workflows/pr1495-fresh-temporal.yml"
  push:
    branches:
      - "validation/pr1495-effect-certified-temporal"

jobs:
  official-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 mesa-vulkan-drivers vulkan-tools
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n1)"
          test -n "$LVP_ICD"
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$LVP_ICD" vulkaninfo --summary

      - name: Install exact temporal prototype
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download official PegInsertionSide demos
        run: |
          cd /tmp
          python -m mani_skill.utils.download_demo PegInsertionSide-v1

      - name: Replay with fresh per-microstep admissibility
        env:
          MS_SKIP_ASSET_DOWNLOAD_PROMPT: "1"
        run: |
          ROOT=.validation-pr1495-temporal
          mkdir -p "$ROOT"
          cp "$HOME/.maniskill/demos/PegInsertionSide-v1/motionplanning/trajectory.h5" "$ROOT/trajectory.h5"
          cp "$HOME/.maniskill/demos/PegInsertionSide-v1/motionplanning/trajectory.json" "$ROOT/trajectory.json"
          python -m mani_skill.trajectory.replay_trajectory \
            --traj-path "$ROOT/trajectory.h5" \
            --use-first-env-state \
            -c pd_ee_delta_pose -o state --save-traj \
            --count 10 --num-envs 2 -b physx_cpu
          python - <<'PY'
          import h5py, json
          from pathlib import Path
          root=Path(".validation-pr1495-temporal")
          path=root/"trajectory.state.pd_ee_delta_pose.physx_cpu.h5"
          with h5py.File(path,"r") as f:
              keys=[k for k in f if k.startswith("traj_")]
              steps=sum(len(f[k]["actions"]) for k in keys if "actions" in f[k])
          result={
              "schema_version":1,
              "expected_episodes":10,
              "episodes":len(keys),
              "steps":int(steps),
              "success_fraction":len(keys)/10.0,
              "current_main_reference":0.9,
              "prior_adaptive_reference":0.8,
              "acceptance_gate":"episodes >= 9; no loop-count tuning after observation",
              "passes_baseline_non_regression":len(keys)>=9,
              "claim_boundary":"Official-demo trajectory replay only; not learned-policy performance or real-robot safety."
          }
          (root/"fresh_temporal_summary.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          if len(keys)<9:
              raise SystemExit("fresh temporal semantics did not recover current-main replay parity")
          PY

      - name: Upload public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1495-fresh-temporal-admissibility
          path: .validation-pr1495-temporal/fresh_temporal_summary.json
          if-no-files-found: warn
