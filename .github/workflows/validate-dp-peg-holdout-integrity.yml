name: Independent integrity audit — locked 100–199 ManiSkill 2x2

on:
  push:
    branches: [validation/dp-peg-heldout-integrity-v1]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit-frozen-factorial-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile independent source-seed auditor
        run: python -m py_compile research/kaggle_diffusion_policy_peg/audit_factorial_replay.py
      - name: Verify six falsifying mutations are rejected
        run: python research/kaggle_diffusion_policy_peg/audit_factorial_replay.py --self-test
      - name: Retrieve immutable 100-demo factorial artifact from successful run
        uses: actions/download-artifact@v4
        with:
          name: dp-peg-factorial-holdout-100-199-replay
          repository: lindicaphxag-tech/ManiSkill
          run-id: 37745942944
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original_artifact
      - name: Derive all counts, pairwise discordances and SHA256 consistency
        run: |
          python research/kaggle_diffusion_policy_peg/audit_factorial_replay.py \
            --search original_artifact --expected-size 100 \
            --source-offset 100 --origin-run-id 37745942944 \
            --output verified_factorial_holdout_100_199_report.json
      - name: Archive derived audit report
        uses: actions/upload-artifact@v4
        with:
          name: factorial-holdout-100-199-independent-audit
          path: verified_factorial_100_report.json
          if-no-files-found: error
