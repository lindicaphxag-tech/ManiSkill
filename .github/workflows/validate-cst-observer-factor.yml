name: Frozen PPO seed10014 state-read causal interventions
on:
  push:
    branches:
      - validation/frozen-ppo-seed10014-probe-intervention-20261008
  workflow_dispatch:
jobs:
  factor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real ManiSkill CPU environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers libgl1 libosmesa6
          python -m pip install --upgrade pip
          python -m pip install -e . huggingface_hub
      - name: Apply single-factor observer interventions, identical original PPO code
        run: |
          set -o pipefail
          python research/factor_probe_state_read.py 2>&1 | tee observer_factors.log
          test -s probe_results/probe_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observer-effect-causal-factor-10014
          path: |
            observer_factors.log
            probe_results/
