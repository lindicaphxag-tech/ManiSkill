name: Validate issue 429 conversion

on:
  push:
    branches:
      - "fix/issue-429-joint-delta-pos-semantic-roundtrip"
    paths:
      - "mani_skill/trajectory/utils/actions/conversion.py"
      - "tests/test_pd_joint_delta_to_pos_regression.py"
      - ".github/workflows/validate-issue-429-conversion.yml"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile conversion module
        run: python -m py_compile mani_skill/trajectory/utils/actions/conversion.py
      - name: Assert upstream base fails issue 429 regressions
        shell: bash
        run: |
          set +e
          git show 62ff3a5896b4d5b4cf0ac4c8d79afe600c9404a3:mani_skill/trajectory/utils/actions/conversion.py > mani_skill/trajectory/utils/actions/conversion.py
          python -m pytest -q tests/test_pd_joint_delta_to_pos_regression.py
          rc=$?
          git checkout -- mani_skill/trajectory/utils/actions/conversion.py
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Regression unexpectedly passes on upstream base"
            exit 1
          fi
          echo "Confirmed: upstream base fails the focused regressions"
      - name: Assert patch passes issue 429 regressions
        run: python -m pytest -q tests/test_pd_joint_delta_to_pos_regression.py
