name: SO3 source hypotheses vs strong reset-centering native PhysX heldout

on:
  push:
    branches:
      - "research/two-ack-so3-source-vs-reset-20261013"
    paths:
      - "research/two_ack_so3_real_heldout_strong_baselines.py"
      - "research/TWO_ACK_SO3_FROZEN_TRAIN_CENTROIDS_20261013.json"
      - ".github/workflows/two-ack-so3-real-heldout-physx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heldout-strong-so3:
    name: 160 real heldout PhysX / ${{ matrix.robot }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        robot: [panda, xarm6_robotiq]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real ManiSkill CPU PhysX native assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers libgl1 libosmesa6
          python -m pip install --disable-pip-version-check -e .
      - name: Execute complete frozen test factorial without dropping failed seeds
        env:
          PYTHONUNBUFFERED: "1"
          MS_SKIP_ASSET_DOWNLOAD_PROMPT: "1"
        run: |
          set -o pipefail
          python -m research.two_ack_so3_real_heldout_strong_baselines --robot ${{ matrix.robot }} 2>&1 | tee "two_ack_so3_strong_baselines_${{ matrix.robot }}.log"
          test -s "two_ack_so3_new_holdout_${{ matrix.robot }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-so3-physx-strong-baselines-${{ matrix.robot }}
          path: |
            two_ack_so3_new_holdout_${{ matrix.robot }}.json
            two_ack_so3_strong_baselines_${{ matrix.robot }}.log
