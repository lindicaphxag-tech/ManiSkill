name: PR1495 squashed-head exact compatibility

on:
  push:
    branches:
      - validation/pr1495-squashed-head-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-current-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind validation to exact squashed PR1495 head
        shell: bash
        run: |
          set -euo pipefail
          PR1495=69facfaafaa0ef233d36ef19e6cd9a0f03532ee0
          git merge-base --is-ancestor "$PR1495" HEAD
          test "$(git show "$PR1495":mani_skill/trajectory/utils/actions/conversion.py | git hash-object --stdin)" = "438c4c41c7fe067194d8e090b9114ad0b5251128"
          test "$(git show "$PR1495":tests/test_action_conversion.py | git hash-object --stdin)" = "71254e58d690c2d4d8690eea4c6b8f637f157dd4"
          test "$(git hash-object mani_skill/trajectory/utils/actions/conversion.py)" = "438c4c41c7fe067194d8e090b9114ad0b5251128"
          test "$(git hash-object tests/test_action_conversion.py)" = "71254e58d690c2d4d8690eea4c6b8f637f157dd4"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused ManiSkill environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run squashed-head regressions
        run: |
          python -m pytest -q tests/test_action_conversion.py
          python -m py_compile             mani_skill/trajectory/utils/actions/conversion.py             tests/test_action_conversion.py
          git diff --check

  real-pr1472-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind converter to exact squashed PR1495 head
        shell: bash
        run: |
          set -euo pipefail
          PR1495=69facfaafaa0ef233d36ef19e6cd9a0f03532ee0
          git merge-base --is-ancestor "$PR1495" HEAD
          test "$(git hash-object mani_skill/trajectory/utils/actions/conversion.py)" = "438c4c41c7fe067194d8e090b9114ad0b5251128"
          test "$(git hash-object tests/test_action_conversion.py)" = "71254e58d690c2d4d8690eea4c6b8f637f157dd4"

      - name: Overlay exact upstream PR1472 controller and test blobs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/VihaanAgarwal/ManiSkill.git             eed9be164797d41540421bda8adb3840377d7087
          git show FETCH_HEAD:mani_skill/agents/controllers/pd_ee_pose.py             > mani_skill/agents/controllers/pd_ee_pose.py
          git show FETCH_HEAD:tests/test_pd_ee_pose_controller.py             > tests/test_pd_ee_pose_controller.py
          test "$(git hash-object mani_skill/agents/controllers/pd_ee_pose.py)" =             "bc4e811f336ef67d0f6cccf30116be238bb4031d"
          test "$(git hash-object tests/test_pd_ee_pose_controller.py)" =             "ce7e6e66cf3e286168d3d82f763307e18b587659"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused ManiSkill environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run squashed converter against real PR1472 mapper
        run: |
          python -m pytest -q             tests/test_action_conversion.py             tests/test_pd_ee_pose_controller.py
          python -m py_compile             mani_skill/trajectory/utils/actions/conversion.py             mani_skill/agents/controllers/pd_ee_pose.py             tests/test_action_conversion.py             tests/test_pd_ee_pose_controller.py
