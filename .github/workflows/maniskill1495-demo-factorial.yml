name: PR1495 official-demo four-cell factorial

on:
  push:
    branches:
      - "validation/maniskill1495-maintainer-request"
    paths:
      - "validation/pr1495/run_demo_factorial.sh"
      - "validation/pr1495/summarize_demo_factorial.py"
      - ".github/workflows/maniskill1495-demo-factorial.yml"
  workflow_dispatch:
    inputs:
      count:
        description: "Official PegInsertionSide source episodes"
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  official-demo-factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU/headless simulation runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 mesa-vulkan-drivers vulkan-tools
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n1)"
          test -n "$LVP_ICD"
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$LVP_ICD" vulkaninfo --summary
          python -m pip install --upgrade pip

      - name: Run four-cell official-demo factorial
        env:
          COUNT: ${{ inputs.count || '10' }}
          MS_SKIP_ASSET_DOWNLOAD_PROMPT: "1"
        run: bash validation/pr1495/run_demo_factorial.sh

      - name: Publish factorial summary
        if: always()
        run: |
          if [[ -f .validation-pr1495-demo-factorial/demo_factorial.json ]]; then
            cat .validation-pr1495-demo-factorial/demo_factorial.json
          fi

      - name: Upload factorial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1495-official-demo-four-cell-factorial
          path: |
            .validation-pr1495-demo-factorial/demo_factorial.json
            .validation-pr1495-demo-factorial/identities.json
          if-no-files-found: warn
