name: "New frozen-PPO matched-public Bayesian history comparator (16 genuine PhysX resets)"
on:
  push:
    branches: [research/matched-public-bayes-native16-20261009]
    paths:
      - 'research/MATCHED_PUBLIC_BAYES_NATIVE16_PREOUTCOME_V1.json'
      - 'research/frozen_ppo_matched_public_bayes_physx.py'
      - '.github/workflows/matched-public-bayes-native16.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-frozen-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original new16 prereg and original model/decision code exact SHA
        run: |
          set -euo pipefail
          test "$(git hash-object research/MATCHED_PUBLIC_BAYES_NATIVE16_PREOUTCOME_V1.json)" = "d229db10a75effafda1be269f556c0bf9ca104bb"
          test "$(git hash-object research/frozen_ppo_matched_public_bayes_physx.py)" = "6e039af56006827fc2fe063b541cfa3dcd1ddc89"
          python -m py_compile research/frozen_ppo_matched_public_bayes_physx.py
          python - <<'PY'
          import json
          d=json.load(open("research/MATCHED_PUBLIC_BAYES_NATIVE16_PREOUTCOME_V1.json"))
          assert d["schema"]=="matched_public_information_bayesian_ack_history_native_physx_preoutcome_v1"
          assert d["sigma_rule"].startswith("sigma=previously frozen")
          assert d["tasks"]["pull_cube"]["seeds"]==[1700001,1700008]
          assert d["tasks"]["stack_cube"]["seeds"]==[1710001,1710008]
          print("PASS: untouched 16-source prereg, posterior threshold, fixed physical truth conditions")
          PY
  real-ten-arm-new16:
    needs: source-frozen-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        task: [pull_cube, stack_cube]
    env:
      ABI_TASK: ${{ matrix.task }}
      MS_SKIP_ASSET_DOWNLOAD_PROMPT: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original genuine CPU PhysX and third-party frozen PPO weights
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers libgl1 libosmesa6
          python -m pip install --upgrade pip
          python -m pip install -e . huggingface_hub
      - name: Physically step original 10 independent native controller arms per 8 reset states
        run: |
          set -o pipefail
          mkdir -p original_native_physx
          PYTHONPATH="$PWD:$PWD/research" python -m research.frozen_ppo_matched_public_bayes_physx \
            2>&1 | tee "original_native_physx/${{ matrix.task }}_real_physx_complete.log"
          mv "mixed_ack_${{ matrix.task }}_original8.json" original_native_physx/
      - name: Verify per-seed sensor and physical prefix equality and native task outcomes
        run: |
          python - <<'PY'
          import json,pathlib,os
          t=os.environ["ABI_TASK"]
          d=json.load(open(f"original_native_physx/mixed_ack_{t}_original8.json"))
          A="fault_public_t3_fourhistory_or_t4_query"
          B="fault_same_public_posterior_or_query"
          F="fault_always_single_privileged_query"
          assert d["real_physx_simulator"] is True and len(d["episodes"])==8
          expected=list(range(1700001,1700009)) if t=="pull_cube" else list(range(1710001,1710009))
          assert d["original_seed_population"]==expected
          report={"task":t,"n":8,"method_success":0,"posterior_success":0,"fixed_success":0,"method_reads":0,"posterior_reads":0,"fixed_reads":0,"method_confident":0,"posterior_confident":0,"posterior_wrong":0,"all_native_prefix_verified":True}
          for row in d["episodes"]:
            for k in (A,B,F):
              assert len(row["faults"][k])==2
              assert [z["step"] for z in row["faults"][k]]==[2,3]
              assert row["public_motion_observation_cost_samples"][k]==(2 if k in (A,B) else 0)
              assert type(row["success_once"][k]) is bool
            for key in ("matched_prefix_physical_audit","matched_posterior_prefix_audit"):
              v=row[key]
              assert v["valid_exact_prefix"] is True
              assert all(x<=5e-5 for x in v["native_fault_dispatch_linf_each"])
              assert v["pre_t5_target_position_max_abs_m"]<=5e-5
              assert v["pre_t5_achieved_position_max_abs_m"]<=5e-5
            ev=row["same_sensor_posterior_evidence"]
            assert ev["posterior_threshold_predeclared"]==0.95
            assert len(ev["posterior_weights"])>=1
            assert abs(sum(ev["posterior_weights"])-1)<1e-5
            assert ev["wrong_confident"] is False or ev["authorized"] is True
            report["posterior_wrong"]+=int(ev["wrong_confident"])
            for k,v in ((A,"method"),(B,"posterior"),(F,"fixed")):
              report[v+"_success"]+=int(row["success_once"][k])
              report[v+"_reads"]+=row["privileged_target_readback_decision_count"][k]
            report["method_confident"]+=int(row["public_t3_evidence"]["authorized"])
            report["posterior_confident"]+=int(ev["authorized"])
          pathlib.Path(f"original_native_physx/{t}_source_audit.json").write_text(json.dumps(report,indent=2,sort_keys=True))
          print("NEW16_ORIGINAL_NATIVE_PHYSX_FULL_SHARD",json.dumps(report,sort_keys=True))
          PY
      - name: Preserve SHA256 and source/provenance even on failures
        if: always()
        run: |
          mkdir -p original_native_physx
          git rev-parse HEAD > original_native_physx/ORIGINAL_RUN_COMMIT_SHA.txt
          (cd original_native_physx && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "original-matched-public-posterior-physx-${{ matrix.task }}-8"
          path: original_native_physx/
          retention-days: 90
  full16-source-review:
    needs: real-ten-arm-new16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: original-matched-public-posterior-physx-*
          path: original_two_task_shards
      - name: Fail on missing or duplicate negative source rows and preserve exact all16 aggregate
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path("original_two_task_shards")
          a=list(root.rglob("*_source_audit.json"))
          assert len(a)==2,a
          stats=[json.loads(p.read_text()) for p in a]
          assert {x["task"] for x in stats}=={"pull_cube","stack_cube"}
          assert all(x["n"]==8 and x["all_native_prefix_verified"] for x in stats)
          out={"status":"AUTHOR_RAN_REAL_PHYSX_NOT_INDEPENDENT_EXTERNAL_REPLICATION",
               "declared_reset_count":16,
               "native_controller_worlds":160,
               "per_task_original_statistics":stats}
          pathlib.Path("new16_full_original_source_audit.json").write_text(json.dumps(out,indent=2,sort_keys=True))
          print("COMPLETE_NEW16_PHYSX",json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: all16-independently-reaggregated-original-physx
          path: new16_full_original_source_audit.json
