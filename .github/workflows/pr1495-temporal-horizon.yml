name: PR1495 bounded-control temporal horizon

on:
  pull_request:
    paths:
      - "validation/pr1495/run_temporal_horizon.sh"
      - "validation/pr1495/summarize_temporal_horizon.py"
      - ".github/workflows/pr1495-temporal-horizon.yml"
      - "mani_skill/trajectory/utils/actions/conversion.py"
  push:
    branches:
      - "validation/pr1495-temporal-horizon"
  workflow_dispatch:

jobs:
  horizon:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 mesa-vulkan-drivers vulkan-tools
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n1)"
          test -n "$LVP_ICD"
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$LVP_ICD" vulkaninfo --summary

      - name: Install exact geodesic prototype
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run retry-horizon causal ladder
        env:
          MS_SKIP_ASSET_DOWNLOAD_PROMPT: "1"
        run: bash validation/pr1495/run_temporal_horizon.sh

      - name: Upload temporal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1495-temporal-horizon
          path: evidence/pr1495-temporal-horizon
          if-no-files-found: error
