name: Fresh16 corrected target-readback singleton belief original PhysX
on:
  push:
    branches: [research/resync-semantic-control-fresh16-20261009]
    paths:
      - '.github/workflows/readback-resync-fresh16-physx.yml'
      - 'research/run_readback_resync_fresh16.py'
      - 'research/frozen_ppo_fixed_resync_corrected.py'
      - 'research/phase_information_gate.py'
      - 'tests/test_phase_information_gate.py'
      - 'research/READBACK_RESYNC_BELIEF_INVALIDATION_FRESH16_V1.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readback-resync-fresh16-${{ github.ref }}
  cancel-in-progress: true
jobs:
  freeze-and-falsify-query-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze pre-outcome corrected post-readback singleton semantics and unchanged PPO
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_phase_information_gate.py' -v
          python -m research.run_phase_information_new64 --self-test
          python -c 'from research.run_phase_information_new64 import frozen_source; frozen_source(); print("PASS frozen phase-study source and preregistration")'
          python -m py_compile research/frozen_ppo_fixed_resync_corrected.py research/run_readback_resync_fresh16.py
          test "$(git hash-object research/frozen_ppo_compound_ack_multi_belief.py)" = '99836af14205fe3e95e52a2e0d68237c7c8a9045'
          test "$(git hash-object research/multi_ack_se3_bounded.py)" = '36707a177549104ba5b4bd9bcebc76518f0d2840'
          test "$(git hash-object research/frozen_ppo_fixed_resync_corrected.py)" = '45784cf901e028ffc43c0e8cce58d8d89f431955'
          test -s research/READBACK_RESYNC_BELIEF_INVALIDATION_FRESH16_V1.json
  native-nine-world-source-shards:
    needs: freeze-and-falsify-query-gate
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        task: [pull_cube, stack_cube]
        chunk: [0]
    env:
      PYTHONUNBUFFERED: '1'
      TASK: ${{ matrix.task }}
      CHUNK: ${{ matrix.chunk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU true PhysX with original ManiSkill and hash-verified ActionShift PPO weights
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers libgl1 libosmesa6
          python -m pip install -e . huggingface_hub
      - name: Record source and exact software before unknown physical results
        run: |
          mkdir -p resync_originals
          git rev-parse HEAD > resync_originals/current_commit.txt
          git hash-object research/frozen_ppo_fixed_resync_corrected.py > resync_originals/phase_runner_blob.txt
          git hash-object research/frozen_ppo_compound_ack_multi_belief.py > resync_originals/unchanged_base_runner_blob.txt
          git hash-object research/READBACK_RESYNC_BELIEF_INVALIDATION_FRESH16_V1.json > resync_originals/preregistered_protocol_blob.txt
          python -m pip freeze --all > resync_originals/environment.txt
          printf 'original_task=%s original_shard=%s nine_physx_worlds=true fault_steps=2,3 phase_query_rule=low_margin_on_Pull_fixed_read_on_Stack\n' "$TASK" "$CHUNK" > resync_originals/source_identity.txt
      - name: Execute all native controller worlds and actual protected setpoint audits
        run: |
          set -o pipefail
          PYTHONPATH="$PWD:$PWD/research" python research/run_readback_resync_fresh16.py \
            --task "$TASK" --chunk "$CHUNK" \
            --out resync_originals 2>&1 | tee resync_originals/actual_physx.log
          test -s "resync_originals/fixed_resync_${TASK}_chunk${CHUNK}_original8.json"
          test -s resync_originals/summary.json
      - name: Preserve failures and all raw SHA256 proof
        if: always()
        run: |
          (cd resync_originals && sha256sum *.json *.txt *.log > SHA256SUMS) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resyncproof-${{ matrix.task }}-${{ matrix.chunk }}-${{ github.run_id }}
          path: resync_originals/
          retention-days: 90

# New phase query policy intentionally uses known task identity; the prior naive authority-slack comparator does not.
# Publisher-facing claims require whole-denominator source audit and strong task-routed comparator.