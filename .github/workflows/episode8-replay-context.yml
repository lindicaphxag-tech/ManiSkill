name: Episode 8 replay-context witness

on:
  push:
    branches:
      - "validation/maniskill1495-maintainer-request"
    paths:
      - "validation/pr1495/capture_episode8_trace.py"
      - "validation/pr1495/summarize_episode8_context.py"
      - "validation/pr1495/run_episode8_context.sh"
      - ".github/workflows/episode8-replay-context.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  context-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 mesa-vulkan-drivers vulkan-tools
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n1)"
          test -n "$LVP_ICD"
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$LVP_ICD" vulkaninfo --summary

      - name: Compare prefix and fresh isolated episode 8
        env:
          MS_SKIP_ASSET_DOWNLOAD_PROMPT: "1"
        run: bash validation/pr1495/run_episode8_context.sh

      - name: Publish context witness
        if: always()
        run: |
          if [[ -f .validation-episode8-context/episode8_context.json ]]; then
            cat .validation-episode8-context/episode8_context.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode8-replay-context-witness
          path: |
            .validation-episode8-context/prefix.json
            .validation-episode8-context/isolated.json
            .validation-episode8-context/episode8_context.json
          if-no-files-found: warn
          include-hidden-files: true
