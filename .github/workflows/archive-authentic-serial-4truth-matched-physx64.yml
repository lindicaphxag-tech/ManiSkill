name: Preserve authentic serial 16-seed x four-truth 576 native PhysX originals
on:
  push:
    branches: [evidence/serial-fourtruth-matched-source64-20261009]
    paths: [.github/workflows/archive-authentic-serial-4truth-matched-physx64.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  source-locked-unmodified-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Demand exact prospectively frozen unmodified native method
        run: |
          set -euo pipefail
          test "$(git hash-object research/frozen_ppo_same_reset_factorial_physx.py)" = 14882a4efcd36351f8cb5873e706488788446f32
          test "$(git hash-object research/empirical_probe_response_classifier.py)" = 064bb46831b61af73ad445bc836326837ec5468f
          python -m py_compile research/audit_serial_physx_same_reset_fourtruth_new64.py
      - name: Read genuine previously executed serial four-truth original native task shards
        uses: actions/download-artifact@v4
        with:
          run-id: 37934195836
          github-token: ${{ github.token }}
          pattern: authentic-serial-fourtruth-*
          merge-multiple: true
          path: /tmp/all_original_serial_physx
      - name: Read unmodified full16-cluster independent all64 original physics audit
        uses: actions/download-artifact@v4
        with:
          run-id: 37934195836
          github-token: ${{ github.token }}
          name: ORIGINAL_NATIVE_MATCHED_RESET_16_CLUSTER_64_TRUTH_FULL_AUDIT
          path: /tmp/original_full64
      - name: Independently recompute and compare byte-for-byte against entire ORIGINAL real physic-source audit
        run: |
          set -euo pipefail
          python -m research.audit_serial_physx_same_reset_fourtruth_new64 \
            --source-dir /tmp/all_original_serial_physx/original_serial64 \
            --output /tmp/recomputed_authentic_serial64.json
          python - <<'PY'
          from pathlib import Path
          import json
          old=list(Path("/tmp/original_full64").rglob("full_original_64_real_serial_physx_audit.json"))
          if len(old)!=1: raise RuntimeError(f"Original complete original-source audit missing: {old}")
          new=Path("/tmp/recomputed_authentic_serial64.json")
          if old[0].read_bytes()!=new.read_bytes():
              raise RuntimeError("Original complete native PhysX audited SHA-based report CHANGED")
          doc=json.loads(new.read_text())
          if doc["all_original_true_physical_ACK_cells"]!=64 or doc["all_original_real_native_PhysX_worlds"]!=576:
              raise RuntimeError("Physical denominator not genuine 64×9")
          if doc["matched_reset_clusters"]!=16 or doc["missing_or_failed_reset_identity_clusters"]!=0:
              raise RuntimeError("Matching native initial source observation identities NOT verified")
          if (doc["total_official_success_public"],doc["total_official_success_task_aware"],
              doc["total_private_reads_public"],doc["total_private_reads_task_aware"])!=(57,54,47,61):
              raise RuntimeError("Original source-authenticated success/read endpoints drifted")
          print("BYTE_EXACT_16_SEED_64_CELL_NATIVE_PHYSX_AUDIT_VERIFIED")
          PY
      - name: Commit original source bytes and SHA256 permanently
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil,hashlib
          origin=Path("/tmp/all_original_serial_physx/original_serial64")
          dst=Path("research/frozen_policy_transfer/evidence/serial_same_process_fourtruth_original64_1970001_1980008")
          dst.mkdir(parents=True,exist_ok=True)
          expected={f"serial_{task}_truth{t}_{kind}.json"
             for task in ("pull_cube","stack_cube") for t in range(4)
             for kind in ("original8","audit")}
          expected|={f"serial_{task}_all_truth_reset_authenticity.json" for task in ("pull_cube","stack_cube")}
          found={p.name for p in origin.glob("serial_*.json")}
          if expected!=found:raise RuntimeError(f"Missing original real task physic files: {expected-found}; extra {found-expected}")
          for n in sorted(expected):shutil.copyfile(origin/n,dst/n)
          shutil.copyfile("/tmp/recomputed_authentic_serial64.json",dst/"original_independent_all64_reaudit.json")
          (dst/"README.md").write_text(
            "# Original prospective 16-seed x 4 actual unknown ACK truths · 576 native PhysX worlds\n\n"
            "Original author-operated actual native CPU PhysX: https://github.com/lindicaphxag-tech/ManiSkill/actions/runs/37934195836\n\n"
            "Genuinely new frozen PPO source seed 1970001–1970008 PullCube and 1980001–1980008 StackCube, all 4 ACK physically applied/held truths per seed, all 9 native controller worlds per source condition. "
            "Each task's four truths were executed serially in ONE Python process. 16/16 source seed clusters showed exact same INITIAL SOURCE PPO input tensor SHA256 over four conditions. "
            "Per-source/native independent audit verified all 64 actual physical command traces, retained task failures and original source. "
            "Public whole-history method: 57/64 official task successes, 47 target-memory reads, 0 WRONG observed confident histories; task-aware strong comparator 54/64, 61 reads; fixed read 53/64 successes. "
            "Exact seed-cluster paired sign-swap exploratory p=0.25; task superiority NOT statistically established, no evidence of noninferiority/safety. "
            "Identical raw initial PPO observation tensor does NOT prove all unobserved simulator state identical. Extra achieved public samples and neutral-probe actuation costs are not normalized to private reads. "
            "No actual ROS/TCP packet-drop study, learned VLA recovery or independent external investigator execution. "
            "Original 32-seed CROSS-PROCESS experiment from CI 37930607707 remains publicly failed for 7/32 StackCube input initial-hash mismatches; it was not retconned as matched physics. "
            "This repository stores unchanged original per-8 physics JSON and original independent all64 re-audit, plus SHA256 ledger.\n"
          )
          paths=sorted(p for p in dst.iterdir() if p.is_file())
          with (dst/"ORIGINAL_SHA256SUMS").open("w") as f:
              for p in paths:
                  f.write(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n")
          print("PERMANENT_UNALTERED_NATIVE_PHYSX_SOURCE_FILES",len(expected))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/frozen_policy_transfer/evidence/serial_same_process_fourtruth_original64_1970001_1980008
          git commit -m "Evidence: source-preserve all matched actual four-truth 576 PhysX originals, hash witness and failed outcomes"
          git push origin HEAD:evidence/serial-fourtruth-matched-source64-20261009
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete_16_cluster_4truth_576_native_PhysX_original_SHA_archive
          path: research/frozen_policy_transfer/evidence/serial_same_process_fourtruth_original64_1970001_1980008/
          retention-days: 90
