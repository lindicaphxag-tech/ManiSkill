name: JAX upstream PR 41228 exact source focused CPU regression evidence
on:
  push:
    branches: [validation/jax41228-exact-pr-source-20261010]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-submitted-pr-CPU-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      JAX_ENABLE_X64: 'true'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lindicaphxag-tech/jax
          ref: b370df9b3b89bc5cb925cab3b2b3b190c0efdafd
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact source and tests submitted to upstream PR 41228
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b370df9b3b89bc5cb925cab3b2b3b190c0efdafd
          test "$(git hash-object jax/_src/random/core.py)" = 8e6477ea8c59cfa448e46d0a45d2a82654a7bf14
          test "$(git hash-object jax/_src/scipy/stats/poisson.py)" = 9d519197342499fb8757e585644ce55d74f5e7ef
          test "$(git hash-object tests/random_lax_test.py)" = 4667aab445f58d62e333994a0d730e719103de5b
          test "$(git hash-object tests/scipy_stats_test.py)" = d8d0adbfbed6d577daf1b760341ed11ae39b7ec5
          python -m py_compile jax/_src/random/core.py jax/_src/scipy/stats/poisson.py tests/random_lax_test.py tests/scipy_stats_test.py
      - name: Install published matching CPU jaxlib plus exact PR JAX source
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -e '.[ci]' pytest absl-py hypothesis parameterized portpicker
          python - <<'PY'
          import jax, jaxlib, scipy, numpy
          print("EXACT_JAX_PR41228", jax.__version__, jaxlib.__version__, scipy.__version__, numpy.__version__)
          PY
      - name: Execute native JAX Poisson and Binomial statistical regression cases
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/random_lax_test.py -k 'PoissonLargeLambdaLogPmf or PoissonRejectionLogPmfMatchesScipy or PoissonLargeLambdaVariance or StirlingTailUsesUnclampedLargeArgument or BinomialLargeCountTailRegression' 2>&1 | tee random_focus.log
          python -m pytest -q tests/scipy_stats_test.py -k 'PoissonLogPmfLargeLambda or PoissonLogPmfTinyRateFarTail' 2>&1 | tee scipy_focus.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-exact-jax41228-${{ matrix.python }}
          path: |
            random_focus.log
            scipy_focus.log
          if-no-files-found: warn
