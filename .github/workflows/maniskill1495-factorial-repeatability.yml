name: PR1495 exact four-cell repeatability

on:
  push:
    branches:
      - "validation/maniskill1495-maintainer-request"
    paths:
      - "validation/pr1495/run_factorial_repeatability.sh"
      - "validation/pr1495/summarize_factorial_repeatability.py"
      - ".github/workflows/maniskill1495-factorial-repeatability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  factorial-repeatability:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU/headless simulation runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 mesa-vulkan-drivers vulkan-tools
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n1)"
          test -n "$LVP_ICD"
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$LVP_ICD" vulkaninfo --summary

      - name: Repeat exact four-cell official-demo factorial
        env:
          MS_SKIP_ASSET_DOWNLOAD_PROMPT: "1"
          REPEATS: "5"
          COUNT: "10"
        run: bash validation/pr1495/run_factorial_repeatability.sh

      - name: Publish four-cell repeatability certificate
        if: always()
        run: |
          if [[ -f .validation-pr1495-factorial-repeatability/factorial_repeatability.json ]]; then
            cat .validation-pr1495-factorial-repeatability/factorial_repeatability.json
          fi

      - name: Upload repeatability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "pr1495-four-cell-repeatability"
          path: |
            .validation-pr1495-factorial-repeatability/factorial_repeatability.json
            .validation-pr1495-factorial-repeatability/identities.json
            .validation-pr1495-factorial-repeatability/*/repeat_*.log
          if-no-files-found: warn
          include-hidden-files: true
