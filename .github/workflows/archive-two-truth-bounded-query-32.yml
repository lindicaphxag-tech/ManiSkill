name: Permanent frozen source archive of 32 paired execution-truth PhysX faults

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-two-truth-bounded-query-32.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  archive-unchanged-source-episodes:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Require the exact original completed four-way genuine-PhysX experiment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37828787703 --jq .conclusion)" = "success"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37828787703 --jq .head_sha)" = "3d61c625fcc8ca88a22817276562d0fdc4447067"
      - name: Materialize original completed source results and complete auditor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/two-truth-source /tmp/two-truth-exact
          gh run download 37828787703 --repo "$GITHUB_REPOSITORY" \
            --name two-truth-32-complete-original-physx-audit --dir /tmp/two-truth-source
          for spec in \
            pull_cube:applied_no_ack pull_cube:neutral_arm_delta_no_ack \
            stack_cube:applied_no_ack stack_cube:neutral_arm_delta_no_ack; do
            task="${spec%%:*}"
            fault="${spec#*:}"
            name="two_truth_bounded_query_${task}_${fault}_original8.json"
            actual=$(find /tmp/two-truth-source -name "$name" -type f)
            test "$(find /tmp/two-truth-source -name "$name" -type f | wc -l)" -eq 1
            cp "$actual" "/tmp/two-truth-exact/$name"
          done
          actual=$(find /tmp/two-truth-source -name full_original_two_truth_32_audit.json -type f)
          test "$(find /tmp/two-truth-source -name full_original_two_truth_32_audit.json -type f | wc -l)" -eq 1
          cp "$actual" /tmp/two-truth-exact/full_original_two_truth_32_audit.json
      - name: Independently recompute original complete denominator without installing robotics dependencies
        run: |
          set -euo pipefail
          python research/audit_ack_bounded_two_truth_32.py \
            --input-dir /tmp/two-truth-exact \
            --output /tmp/recomputed_two_truth_32.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected=json.loads(Path('/tmp/two-truth-exact/full_original_two_truth_32_audit.json').read_text())
          actual=json.loads(Path('/tmp/recomputed_two_truth_32.json').read_text())
          assert actual==expected, 'Original complete source summary differs from main branch independent audit'
          assert expected['n_original_task_truth_conditions']==32
          assert expected['total_reads_selective']==10 and expected['total_reads_mandatory']==32
          assert expected['total_success']['fault_robust_then_single_privileged_query']==28
          assert expected['total_success']['fault_always_single_privileged_query']==29
          assert expected['overall_selective_vs_always']=={
            'both':27,'first_only':1,'neither':2,'second_only':2}
          print('SOURCE_PINNED_ORIGINAL_32_PASS')
          PY
      - name: Commit all five unchanged original JSON files and SHA256 proof
        run: |
          set -euo pipefail
          dest=research/frozen_policy_transfer/evidence/bounded_or_query_two_truth_32
          mkdir -p "$dest"
          cp /tmp/two-truth-exact/*.json "$dest/"
          (cd "$dest" && sha256sum ./*.json > SOURCE_SHA256SUMS)
          cat > "$dest/README.md" <<'EOF'
          # Frozen-PPO bounded-or-query: two *actual* controller execution truths
          Original 4-job real PhysX run (not an outside independent lab):
          https://github.com/lindicaphxag-tech/ManiSkill/actions/runs/37828787703
          Exact running code head: 3d61c625fcc8ca88a22817276562d0fdc4447067.
          The prospectively frozen condition/seed/budget contract and its outcomes are unchanged.
          Actual applied arm command vs actual neutral native arm command are separately simulated
          with unknown ACK, four matched groups x eight original seeds, two fixed external PPOs.
          Summary: selective bounded-or-query 28/32 official task success vs mandatory one-read 29/32;
          one READ is used in 10/32 compared with 32/32 always-query (68.75 percent reduction).
          Per-pair discordance selective-only 1, mandatory-only 2. Do not claim equal success.
          Source conditions: Pull applied 8/8 vs always 8/8, Pull held 8/8 vs always 8/8;
          Stack applied 6/8 vs always 7/8; Stack held 6/8 vs always 6/8.
          The neutral-held task/seeds 142001-142008 and 152001-152008 overlap the separate
          64-state validation source on these same reset seeds (Actions 37828426195).
          NEVER combine these overlapping episodes as independent extra holdout observations.
          This is conditional native-controller COMMAND TARGET error, not robot task-safety,
          hardware network packet-loss handling or independently reproduced scientific adoption.
          Study's most important failure: StackCube applied seed 152001 authorized 47
          robust common commands (no readback), failed the task; mandatory query succeeded.
          Geometric tolerance is NOT task-success sufficiency, especially near contact.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"
          if git diff --cached --quiet; then echo 'Already archived'; exit 0; fi
          git commit -m 'evidence: preserve untouched two-truth 32-state PPO faults and query tradeoff'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Could not safely rebase archive over current main'
          exit 1
