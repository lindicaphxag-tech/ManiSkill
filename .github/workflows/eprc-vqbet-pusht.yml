name: EPRC VQ-BeT PushT Probe

on:
  pull_request:
    paths:
      - "research/eprc/real_policy/**"
      - "research/eprc/contract_signature.py"
      - "research/eprc/dec_uncertainty.py"
      - "research/eprc/robust_repairability.py"
      - "research/eprc/linear_authority.py"
      - ".github/workflows/eprc-vqbet-pusht.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eprc-vqbet-pusht-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned LeRobot PushT stack
        run: |
          git clone -q https://github.com/huggingface/lerobot.git /tmp/lerobot
          git -C /tmp/lerobot checkout -q 3c0a209f9fac4d2a57617e686a7f2a2309144ba2
          # Replace obsolete PyPI distribution name only; runtime code still imports `av`.
          sed -i 's/^pyav = ">=12.0.5"/av = ">=12.0.5"/' /tmp/lerobot/pyproject.toml
          grep -q '^av = ">=12.0.5"' /tmp/lerobot/pyproject.toml
          python -m pip install -q -e '/tmp/lerobot[pusht]'
      - name: Probe official frozen VQ-BeT checkpoint
        run: |
          python research/eprc/real_policy/vqbet_pusht_probe.py --output /tmp/eprc-real-policy/vqbet_pusht_probe.json
      - name: Validate frozen cross-policy protocol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/eprc-real-policy/vqbet_pusht_probe.json")
          d=json.loads(p.read_text())
          assert d["protocol_id"] == "pusht-block-xyt-fine-4px-4px-0.02rad-coarse-8px-8px-0.04rad-v1"
          assert d["environment_reset_seed"] == 17
          assert d["fine_physical_probe"] == [4.0, 4.0, 0.02]
          assert d["coarse_physical_probe"] == [8.0, 8.0, 0.04]
          assert d["state_restore_protocol"] == "reset-fresh-space-exact-readback-v1"
          assert d["jacobian_support_units"] == ["pixel", "pixel", "radian"]
          assert d["heldout_physical_delta"] == [10.0, -6.0, 0.35]
          assert len(d["heldout_first_action_response"]) == 2
          assert len(d["dec"]["first_action_step_jacobian"]) == 2
          assert len(d["dec"]["first_action_step_jacobian"][0]) == 3
          assert d["paired_policy_repeat_max_error"] < 1e-6
          assert d["preprocess_repeat_max_error"] < 1e-7
          assert len(d["dec"]["rng_seed_replicates"]) == 5
          assert d["dec"]["replicate_count"] == 5
          assert d["dec"]["certification_eligible"] == d["dec"]["replicate_stability_certified"]
          assert len(d["robust_crg"]["first_action_replicate_maps"]) == 5
          assert d["robust_crg"]["decision"] in {"CERTIFIED_REPAIR", "CERTIFIED_IMPOSSIBLE", "INCONCLUSIVE"}
          assert d["robust_crg"]["operator_norm_uncertainty_observed_max"] >= 0.0
          assert d["robust_crg"]["support_trust_radius"] == 0.5
          assert d["robust_crg"]["action_residual_tolerance"] == 4.0
          if d["robust_crg"]["decision"] == "CERTIFIED_IMPOSSIBLE":
              w = d["robust_crg"]["proof_carrying_impossibility_witness"]
              assert w is not None
              assert w["verified"] is True
              assert w["margin_over_tolerance"] > 0.0
          else:
              assert d["robust_crg"]["proof_carrying_impossibility_witness"] is None
          assert d["active_minimal_certificate"]["status"] == "planning_only_no_additional_policy_queries_executed"
          assert d["active_minimal_certificate"]["planned_probe_count"] <= 6
          assert d["active_minimal_certificate"]["planned_symmetric_policy_evaluations"] == 2 * d["active_minimal_certificate"]["planned_probe_count"]
          assert len(d["active_minimal_certificate"]["normalized_support_probe_directions"]) == d["active_minimal_certificate"]["planned_probe_count"]
          assert len(d["active_minimal_certificate"]["physical_symmetric_probe_deltas"]) == d["active_minimal_certificate"]["planned_probe_count"]
          print("validated protocol", d["protocol_id"])
          PY
      - name: Upload raw frozen-policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eprc-vqbet-pusht-probe
          path: /tmp/eprc-real-policy
          if-no-files-found: warn
          retention-days: 30
