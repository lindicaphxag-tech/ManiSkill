name: "Permanent source-locked archive of 640 actually stepped AEF action-equivalence PhysX OOD worlds"
on:
  push:
    branches: [research/action-equivalence-first-ack-20261009]
    paths:
      - '.github/workflows/archive-first-original-aef-640-real-physx.yml'
permissions:
  contents: write
  actions: read
jobs:
  full-original-640-native-PhysX-source-and-result-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_RUN: '37938466825'
      ORIGINAL_ARTIFACT: '11620930178'
      ORIGINAL_ZIP_SHA256: '1f3f1ca9e2b0e80dc3f271b4ef75b8971c88d86bb9a03b6b419851e63982cf8c'
      DEST: research/frozen_policy_transfer/evidence/aef_robust_public_hybrid_original64_1000101_1010132
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Demand FIRST original successful physical producer, unchanged protocol, real frozen AEF method and original source audit
        run: |
          set -euo pipefail
          test "$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/"$ORIGINAL_RUN" --jq '.conclusion')" = success
          test "$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/"$ORIGINAL_RUN" --jq '.head_sha')" = 2553851eda76916937675a00bba863eab64c6290
          test "$(gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/"$ORIGINAL_ARTIFACT" --jq '.digest')" = "sha256:$ORIGINAL_ZIP_SHA256"
          test "$(git hash-object research/ACTION_EQUIVALENCE_FIRST_OOD_NEW64_PREOUTCOME_V1.json)" = 6e7db0a6af7dd4e6f33f7119ca0ae30f6fcbfd3b
          test "$(git hash-object research/frozen_ppo_aef_hybrid_ood_physx_v7.py)" = 52906222cdacb4893594ac17faac706a2d9f89b9
          test "$(git hash-object research/run_aef_hybrid_ood_new64.py)" = 9488bab66398fbceb3e71d0c902600b870010eb2
          test "$(git hash-object research/audit_aef_hybrid_ood_new64.py)" = 45adac7998a7bfde51aa4856d3834250a8d26ffa
      - name: Download and independently hash EXACT original combined 17-file physical source artifact
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ORIGINAL_ARTIFACT/zip" \
            -o /tmp/aef_original_real640.zip
          echo "$ORIGINAL_ZIP_SHA256  /tmp/aef_original_real640.zip" | sha256sum -c -
          mkdir -p /tmp/orig_aef640
          unzip -q /tmp/aef_original_real640.zip -d /tmp/orig_aef640
          test "$(find /tmp/orig_aef640 -type f -name '*.json' | wc -l)" -eq 17
      - name: Recompute all original 640 actual PhysX OOD controller worlds without rerunning any simulator
        run: |
          set -euo pipefail
          SOURCE_DIR="$(dirname "$(find /tmp/orig_aef640 -name 'aef_hybrid_pull_cube_chunk0_original8.json' -print -quit)")"
          ORIGINAL_FULL="$(find /tmp/orig_aef640 -name 'INDEPENDENT_AEF_REAL_640_PHYSX_ALL64.json' -print -quit)"
          test -s "$ORIGINAL_FULL"
          python -m research.audit_aef_hybrid_ood_new64 --source-dir "$SOURCE_DIR" --output /tmp/again_independent_native640.json
          ORIGINAL_FULL="$ORIGINAL_FULL" python - <<'PY'
          import json,os
          first=json.load(open(os.environ["ORIGINAL_FULL"]))
          second=json.load(open("/tmp/again_independent_native640.json"))
          if first!=second:raise SystemExit("Corruption/source changed or original negative trials omitted")
          assert first["source_original_native_physx_worlds"]==640
          assert first["original_registered_source_reset_states"]==64
          t=first["total"]
          assert t["old"]=={"task_success":49,"privileged_native_target_reads":53,"public_unique_history_authorizations":11,"wrong_confident_native_history":0,"true_history_response_model_outside_frozen_eps":4,"public_xyz_observation_samples":128}
          assert t["hybrid"]=={"task_success":47,"privileged_native_target_reads":25,"public_unique_history_authorizations":11,"wrong_confident_native_history":0,"true_history_response_model_outside_frozen_eps":4,"public_xyz_observation_samples":128}
          assert t["hybrid_t5_robust_common_action_admissions"]==34
          assert t["hybrid_public_history_ACTUALLY_used_for_policy"]==9
          assert t["task_sensitive_query_success"]==53 and t["task_sensitive_privileged_reads"]==50
          assert first["by_task"]["stack_cube"]["old"]["task_success"]==18
          assert first["by_task"]["stack_cube"]["hybrid"]["task_success"]==16
          print("HONEST_ORIGINAL_AEF_640_PHYSX_RESOURCE_SAVING_WITH_TASK_SUCCESS_REGRESSION_CONFIRMED",True)
          PY
      - name: Copy all 17 original exact files, include SHA256SUMS, do not omit any negative success/task row
        run: |
          set -euo pipefail
          SOURCE_DIR="$(dirname "$(find /tmp/orig_aef640 -name 'aef_hybrid_pull_cube_chunk0_original8.json' -print -quit)")"
          ORIGINAL_FULL="$(find /tmp/orig_aef640 -name 'INDEPENDENT_AEF_REAL_640_PHYSX_ALL64.json' -print -quit)"
          mkdir -p "$DEST"
          cp "$SOURCE_DIR"/*.json "$DEST"/
          cp "$ORIGINAL_FULL" "$DEST"/
          (cd "$DEST" && sha256sum *.json > SHA256SUMS)
          cat > "$DEST/README.md" <<'EOF'
          # ORIGINAL 640 real PhysX OOD AEF controller trajectories: privileged-read savings DO NOT imply task benefit

          Source-preregistered original successful full eight real native PhysX shard jobs and independent source audit: https://github.com/lindicaphxag-tech/ManiSkill/actions/runs/37938466825, original exact physics source commit 2553851eda76916937675a00bba863eab64c6290. Original pre-outcome public protocol Git blob 6e7db0a6af7dd4e6f33f7119ca0ae30f6fcbfd3b; original complete physical and source audit artifact 11620930178, ZIP SHA256 1f3f1ca9e2b0e80dc3f271b4ef75b8971c88d86bb9a03b6b419851e63982cf8c.
          
          This contains **17 EXACT byte-unchanged original** JSON records (eight original 8-seed real native PhysX PPO trajectories, eight complete original shard audits, one original independent full64 audit) and SHA256SUMS; failures, false positives and refusals are retained. Native first/second ACK actual APPLIED/HELD truth AA/AH/HA/HH per task × actual seven-joint Panda PD-drive slow (500/70), fast (1500/130), 64 genuinely new physical initial state identities PullCube 1000101–1000132, StackCube 1010101–1010132; ten separately physically stepped source/native policy controller worlds per seed.
          
          Original public t4 model: **49/64 official task successes, 53 private target decision reads, 11 public unique history labels, 128 public achieved XYZ observations, zero observed wrong confident**. ACTION-EQUIVALENCE FIRST (AEF) hybrid: **47/64 task successes, 25 private getter reads, 11 public t4 unique candidate labels (only 9 ACTUALLY USED), 34 source-counted t5 robust common command admissions, 128 public achieved XYZ observations, zero observed wrong confident**. On PullCube AEF and original each 31/32 successes, with 14 vs 27 reads; on StackCube AEF 16/32 vs original 18/32 successes and 11 vs 26 reads. Task-ID strong actual comparator **53/64 successes with 50 reads**. AEF's strong cost improvement is NOT a task-success advantage; cannot claim noninferiority or physical robot safety.
          
          The robust command certificate limits documented native **commanded-target translation/rotation error**, not actual task contact precision, object stability, collisions, forces or mechanical safety. The StackCube failures demonstrate why a 5 cm native target envelope may be insufficient to preserve task utility despite formal boundedness. This is simulated native physical action omission, NOT genuine lost ROS/TCP receipts, external independent laboratory replication, learned VLA manipulation or accepted CoRL/RSS/ICRA main paper.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git diff --cached --quiet && exit 0
          git commit -m "evidence: permanently preserve original 640 actually stepped PhysX AEF worlds with task-regression negative result"
          git push origin HEAD:research/action-equivalence-first-ack-20261009
      - uses: actions/upload-artifact@v4
        with:
          name: original-640-native-AEF-information-vs-task-negative-signed-source
          path: research/frozen_policy_transfer/evidence/aef_robust_public_hybrid_original64_1000101_1010132/
          retention-days: 90
