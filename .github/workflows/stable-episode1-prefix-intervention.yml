name: Stable episode 1 causal prefix intervention

on:
  push:
    branches:
      - "validation/maniskill1495-maintainer-request"
    paths:
      - "validation/pr1495/scan_stable_episode1_prefix_intervention.py"
      - "validation/pr1495/run_stable_episode1_prefix_intervention.sh"
      - "validation/pr1495/STABLE_EPISODE1_PREFIX_INTERVENTION_PROTOCOL.md"
      - ".github/workflows/stable-episode1-prefix-intervention.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  causal-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 mesa-vulkan-drivers vulkan-tools
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n1)"
          test -n "$LVP_ICD"
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$LVP_ICD" vulkaninfo --summary

      - name: Run preregistered serial-context prefix scan
        env:
          MS_SKIP_ASSET_DOWNLOAD_PROMPT: "1"
        run: bash validation/pr1495/run_stable_episode1_prefix_intervention.sh

      - name: Publish causal prefix certificate
        if: always()
        run: |
          if [[ -f .validation-stable-episode1-prefix/episode1_prefix_intervention.json ]]; then
            cat .validation-stable-episode1-prefix/episode1_prefix_intervention.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-episode1-causal-prefix-intervention
          path: .validation-stable-episode1-prefix/episode1_prefix_intervention.json
          if-no-files-found: error
          include-hidden-files: true
