name: Independent all-64 new-native-world corrupt ACK decision audit
on:
  push:
    branches: ["research/adversarial-ack-selective-confirm-20261013"]
    paths:
      - research/audit_adversarial_ack_selective_confirmation_physx.py
      - .github/workflows/audit-adversarial-ack-selective-physx.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-source-independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Download both actual native robot original completed PhysX shards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38376713806
          pattern: unseen-native-corrupt-ACK-*
          path: /tmp/original_true_physx_corrupt_ack
      - name: Independent source-quaternion, posterior and worst-case corruption recomputation
        run: |
          python -m research.audit_adversarial_ack_selective_confirmation_physx --source /tmp/original_true_physx_corrupt_ack --out independently_verified_native_corrupt_ACK.json
          test -s independently_verified_native_corrupt_ACK.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-all-64-original-physx-corrupt-ack-evidence
          path: independently_verified_native_corrupt_ACK.json
