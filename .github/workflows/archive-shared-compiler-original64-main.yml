name: "Permanently source-verify and archive shared postquery compiler PPO64"
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/archive-shared-compiler-original64-main.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  reverify-completed-physics-no-reexecution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: research/shared-compiler-evidence-original64-20261009
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm ORIGINAL prereg, physical runner and corrected source auditor
        run: |
          set -euo pipefail
          test "$(git hash-object research/SHARED_COMPILER_TWOACK_FROZEN_PPO64_PREOUTCOME_V1.json)" = b57973e28897c40125069fb0205e83b1c46d1885
          test "$(git hash-object research/frozen_ppo_shared_compiler_twoack_2x2_physx.py)" = 89248363b5bc52c0568495f3f78efc58d9a1ac67
          test "$(git hash-object research/run_shared_compiler_twoack_new64.py)" = 7b1cf4a39bda292bb52980f450928942503571da
          test "$(git hash-object research/audit_shared_compiler_twoack_new64.py)" = d8a4492b2b77b0cee76edd0e4675d3d8975b9f96
          python -m py_compile research/frozen_ppo_shared_compiler_twoack_2x2_physx.py research/run_shared_compiler_twoack_new64.py research/audit_shared_compiler_twoack_new64.py
          python - <<'PY'
          from research.run_shared_compiler_twoack_new64 import assert_preoutcome
          assert_preoutcome()
          print('ORIGINAL_PHYSICS_UNALTERED_SOURCE_AUDITOR_ONLY_REPAIRED')
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 37925044658
          repository: lindicaphxag-tech/ManiSkill
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: original-shared-compiler-*
          merge-multiple: true
          path: /tmp/original_shared_compiler64
      - name: Independent full 64 source-only audit over 16 ORIGINAL PhysX JSONs
        run: |
          set -euo pipefail
          python -m research.audit_shared_compiler_twoack_new64 --source-dir /tmp/original_shared_compiler64 --output /tmp/full_shared_compiler_original64_audit.json
          test -s /tmp/full_shared_compiler_original64_audit.json
          python - <<'PY'
          import json, pathlib
          a=json.loads(pathlib.Path('/tmp/full_shared_compiler_original64_audit.json').read_text())
          assert a['unique_source_reset_states']==64
          assert a['actually_stepped_simulator_worlds']==576
          assert len(a['four_truth_strata'])==8
          assert a['public_both_fault_events_exposed']==64
          assert all(x['pre_t5_matched'] is True for x in a['all_episodes'])
          assert sum(x['new_success'] for x in a['all_episodes'])==a['outcomes']['public']['task_success']
          assert a['all_compiler_traces_valid'] is True
          assert a['outcomes']['public']=={'task_success':53,'private_reads':48}
          assert a['outcomes']['fixed_t5']=={'task_success':53,'private_reads':64}
          assert a['outcomes']['strong_task']=={'task_success':50,'private_reads':60}
          assert a['outcomes']['always_held']=={'task_success':33,'private_reads':0}
          assert a['public_confident_history_admissions']==16
          assert a['observed_confident_wrong_history']==0
          assert a['all_faulted_worlds_received_shared_probe']==0
          print('64_REAL_PHYSX_SHARED_COMPILER_CAUSAL_FULL_INDEPENDENT_SOURCE_AUDIT_SUCCESS')
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 37925044658
          repository: lindicaphxag-tech/ManiSkill
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: ORIGINAL_shared_compiler_2x2_64_576_PhysX_all_negative_outcomes
          merge-multiple: true
          path: /tmp/completed_frozen_original_full
      - name: Prove source-only original64 audit is byte-identical to the completed native-run source auditor
        run: |
          set -euo pipefail
          cmp /tmp/full_shared_compiler_original64_audit.json /tmp/completed_frozen_original_full/full_shared_compiler_original64_audit.json
      - name: Preserve original byte-identical source files, independent audit and SHA-256
        run: |
          set -euo pipefail
          folder=research/frozen_policy_transfer/evidence/shared_compiler_twoack_original64_1480001_1490032
          mkdir -p "$folder"
          cp /tmp/original_shared_compiler64/sharedcompiler_*_original8.json "$folder/"
          cp /tmp/original_shared_compiler64/sharedcompiler_*_audit.json "$folder/"
          cp /tmp/full_shared_compiler_original64_audit.json "$folder/"
          cd "$folder"
          sha256sum ./*.json | LC_ALL=C sort -k2 > SHA256SUMS
          cat > README.md <<'EOF'
          # Original physical shared-compiler 2x2 unknown-ACK evidence (64 resets / 576 worlds)
          **Research status:** Authentic author-controlled ManiSkill CPU PhysX source and full independent SOURCE-ONLY re-audit of finished native run [37925044658](https://github.com/lindicaphxag-tech/ManiSkill/actions/runs/37925044658). This is not independent external third-party execution, packet-level ACK loss, a VLA result, physical robot safety, statistical noninferiority, or paper acceptance.

          A **prior original physical attempt** [37924300007](https://github.com/lindicaphxag-tech/ManiSkill/actions/runs/37924300007) FAILED a guard: it cached multi-history cardinality before t5 fixed-read target resynchronization. The single source-order correction was disclosed in `research/SHARED_COMPILER_PROSPECTIVE_FAILURE_DISCLOSURE_20261009.md` and a corrected SHA-pinned trial was rerun. The intermediate main-workflow replay [37924949613](https://github.com/lindicaphxag-tech/ManiSkill/actions/runs/37924949613) also failed *before physics* because the main workflow's hash gate still expected old source SHA. These failures have not been reclassified or combined with the successful original source set.

          The corrected registered 64 fresh states are PullCube 1480001–1480032 plus StackCube 1490001–1490032, four balanced actually stepped t2/t3 APPLIED/HELD patterns per task, and nine real controller-policy worlds per state. Physical prefix native arm commands and pre-t5 achieved and target SE(3) were matched audit-only; both core post-t5 methods used **the same UncertainDeliveryBelief state-machine implementation and base.normalized_target_delta compiler**. Different target information (public admissible history vs fixed private target read) can legitimately make their subsequent commands diverge.

          Full original-source-audited outcome: public observer **53/64 task successes, 48 private reads, 16 public confident histories, 0/16 wrong in this batch**; common-code fixed reader **53/64, 64 reads**; preselected strong **50/64, 60 reads**; always-held **33/64, zero reads**. Public requires two PUBLIC achieved XYZ samples plus one known-neutral physical t4 probe, so fewer PRIVILEGED reads is not necessarily lower wall-clock overhead. The strict negative common-exact arm can refuse before t4; do **NOT** say all nine arms saw the same probe. 0/16 wrong is not a guarantee; another separately published prospective 64-state batch observed a wrong-confident public history.

          Every eight-shard physical original8.json and independent shard audit are byte-preserved here, plus fresh full64 audit and SHA256SUMS. Run `sha256sum -c SHA256SUMS` and from repository root `python -m research.audit_shared_compiler_twoack_new64 --source-dir <this-directory> --output /tmp/rechecked_full64.json`. The GitHub Actions archiver requires the recomputed complete JSON to match the completed simulation original full audit.
          EOF
          cd -
          git add "$folder"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "evidence: archive byte-exact 64 shared-compiler 576-PhysX originals and independent full audit"
          git push origin "HEAD:research/shared-compiler-evidence-original64-20261009"
