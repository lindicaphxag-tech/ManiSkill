name: Source-native reachable SO3 against finite-midpoint
on:
  push:
    branches: [research/reachable-so3-ppo-20261014]
    paths:
      - research/reachable_native_so3_robust.py
      - tests/test_reachable_native_so3_robust.py
      - .github/workflows/reachable-so3-cpu-falsifiers.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install numpy scipy pytest
      - run: python -m pytest -q tests/test_reachable_native_so3_robust.py
