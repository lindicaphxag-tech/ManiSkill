# trigger-v4
name: Validate ManiSkill PR 1495 geometry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-pr1495.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/delta-pose-euler-action

      - name: Resolve exact PR head
        id: prhead
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused ManiSkill test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run upstream-focused regressions
        run: |
          python -m pytest -q tests/test_action_conversion.py

      - name: Measure non-commuting rotation witness
        env:
          PR_HEAD: ${{ steps.prhead.outputs.sha }}
        run: |
          python - <<'PY'
          import json
          import math
          import numpy as np
          import os
          import torch
          from transforms3d.quaternions import quat2axangle

          from mani_skill.trajectory.utils.actions.conversion import (
              inverse_delta_to_pd_ee_euler,
          )
          from mani_skill.utils.geometry import rotation_conversions

          expected_euler = torch.tensor([0.31, -0.27, 0.42], dtype=torch.float64)
          expected_matrix = rotation_conversions.euler_angles_to_matrix(
              expected_euler, "XYZ"
          )
          desired_quat = rotation_conversions.matrix_to_quaternion(expected_matrix)
          inverse_delta = rotation_conversions.quaternion_invert(desired_quat)

          # Isolate the representation mismatch itself: interpret the same
          # desired rotation first as an axis-angle vector (old converter
          # representation) and then as XYZ Euler angles (controller contract).
          axis, angle = quat2axangle(desired_quat.numpy())
          old_axis_angle = torch.as_tensor(
              np.asarray(axis) * float(angle), dtype=torch.float64
          )
          old_matrix = rotation_conversions.euler_angles_to_matrix(
              old_axis_angle, "XYZ"
          )

          encoded_euler = torch.from_numpy(
              inverse_delta_to_pd_ee_euler(inverse_delta.numpy())
          )
          fixed_matrix = rotation_conversions.euler_angles_to_matrix(
              encoded_euler, "XYZ"
          )

          def angular_error_deg(actual, expected):
              rel = actual.transpose(-1, -2) @ expected
              cos_theta = ((torch.trace(rel) - 1.0) / 2.0).clamp(-1.0, 1.0)
              return math.degrees(float(torch.acos(cos_theta)))

          report = {
              "pr_head": os.environ["PR_HEAD"],
              "witness_euler_xyz_rad": expected_euler.tolist(),
              "old_axis_angle_as_euler_error_deg": angular_error_deg(
                  old_matrix, expected_matrix
              ),
              "patched_xyz_euler_error_deg": angular_error_deg(
                  fixed_matrix, expected_matrix
              ),
              "claim_boundary": (
                  "deterministic production-convention witness; not a policy "
                  "training-success claim"
              ),
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          with open("/tmp/maniskill-pr1495-geometry.json", "w") as f:
              json.dump(report, f, indent=2, sort_keys=True)
          assert report["old_axis_angle_as_euler_error_deg"] > 1.0
          assert report["patched_xyz_euler_error_deg"] < 1e-5
          PY

      - name: Stress-test patched representation over seeded SO(3) sweep
        env:
          PR_HEAD: ${{ steps.prhead.outputs.sha }}
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import torch

          from mani_skill.trajectory.utils.actions.conversion import (
              inverse_delta_to_pd_ee_euler,
          )
          from mani_skill.utils.geometry import rotation_conversions

          torch.manual_seed(1495)
          n = 50000
          desired_q = rotation_conversions.random_quaternions(
              n, dtype=torch.float64
          )
          inverse_delta = rotation_conversions.quaternion_invert(desired_q)

          encoded = torch.from_numpy(
              inverse_delta_to_pd_ee_euler(inverse_delta.numpy())
          )
          actual = rotation_conversions.euler_angles_to_matrix(
              encoded, "XYZ"
          )
          expected = rotation_conversions.quaternion_to_matrix(desired_q)

          relative = actual.transpose(-1, -2) @ expected
          trace = relative.diagonal(dim1=-2, dim2=-1).sum(-1)
          cos_theta = ((trace - 1.0) / 2.0).clamp(-1.0, 1.0)
          errors_deg = torch.rad2deg(torch.acos(cos_theta))
          normalized_norm = torch.linalg.norm(
              encoded / (2.0 * math.pi), dim=-1
          )

          # Explicitly probe near the XYZ Tait-Bryan singular surface too.
          eps = 1e-5
          near_gimbal = torch.tensor(
              [
                  [0.7, math.pi / 2 - eps, -0.9],
                  [-1.2, math.pi / 2 - eps, 1.1],
                  [0.4, -math.pi / 2 + eps, 1.3],
                  [-0.8, -math.pi / 2 + eps, -1.0],
              ],
              dtype=torch.float64,
          )
          gimbal_matrix = rotation_conversions.euler_angles_to_matrix(
              near_gimbal, "XYZ"
          )
          gimbal_q = rotation_conversions.matrix_to_quaternion(gimbal_matrix)
          gimbal_input = rotation_conversions.quaternion_invert(gimbal_q)
          gimbal_encoded = torch.from_numpy(
              inverse_delta_to_pd_ee_euler(gimbal_input.numpy())
          )
          gimbal_actual = rotation_conversions.euler_angles_to_matrix(
              gimbal_encoded, "XYZ"
          )
          gimbal_rel = gimbal_actual.transpose(-1, -2) @ gimbal_matrix
          gimbal_trace = gimbal_rel.diagonal(dim1=-2, dim2=-1).sum(-1)
          gimbal_cos = ((gimbal_trace - 1.0) / 2.0).clamp(-1.0, 1.0)
          gimbal_errors_deg = torch.rad2deg(torch.acos(gimbal_cos))

          report = {
              "pr_head": os.environ["PR_HEAD"],
              "seed": 1495,
              "samples": n,
              "max_roundtrip_error_deg": float(errors_deg.max()),
              "p999_roundtrip_error_deg": float(
                  torch.quantile(errors_deg, 0.999)
              ),
              "near_gimbal_max_error_deg": float(gimbal_errors_deg.max()),
              "max_normalized_rotation_norm": float(normalized_norm.max()),
              "claim_boundary": (
                  "representation round-trip stress test; not a policy "
                  "training-success claim"
              ),
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          with open("/tmp/maniskill-pr1495-sweep.json", "w") as f:
              json.dump(report, f, indent=2, sort_keys=True)

          assert report["max_roundtrip_error_deg"] < 1e-4
          assert report["near_gimbal_max_error_deg"] < 1e-3
          assert report["max_normalized_rotation_norm"] < 1.0
          PY

      - name: Upload geometry evidence
        uses: actions/upload-artifact@v4
        with:
          name: maniskill-pr1495-geometry
          path: |
            /tmp/maniskill-pr1495-geometry.json
            /tmp/maniskill-pr1495-sweep.json
          if-no-files-found: error
      - name: Publish PR-head commit status
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ steps.prhead.outputs.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["PR_HEAD"]
          url = f"https://api.github.com/repos/{repo}/statuses/{sha}"
          payload = json.dumps(
              {
                  "state": "success",
                  "target_url": os.environ["RUN_URL"],
                  "description": "Euler encoding + 50k SO(3) sweep passed",
                  "context": "fork/geometry-validation",
              }
          ).encode()
          request = urllib.request.Request(
              url,
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request) as response:
              print(response.read().decode())
          PY
