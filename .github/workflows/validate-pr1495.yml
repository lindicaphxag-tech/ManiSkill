# trigger-v1
name: Validate ManiSkill PR 1495 geometry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-pr1495.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 034e40c3c3540e68487171fc8095554f5748ec7a

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused ManiSkill test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run upstream-focused regressions
        run: |
          python -m pytest -q tests/test_action_conversion.py

      - name: Measure non-commuting rotation witness
        run: |
          python - <<'PY'
          import json
          import math
          import numpy as np
          import torch
          from transforms3d.quaternions import quat2axangle

          from mani_skill.utils.geometry import rotation_conversions

          expected_euler = torch.tensor([0.31, -0.27, 0.42], dtype=torch.float64)
          expected_matrix = rotation_conversions.euler_angles_to_matrix(
              expected_euler, "XYZ"
          )
          desired_quat = rotation_conversions.matrix_to_quaternion(expected_matrix)
          inverse_delta = rotation_conversions.quaternion_invert(desired_quat)

          axis, angle = quat2axangle(inverse_delta.numpy())
          old_physical = np.asarray(axis) * float(angle)
          # inv_scale_action maps symmetric [-2pi, 2pi] to x/(2pi), while
          # PDEEPoseController multiplies normalized rotation by rot_lower=-2pi.
          old_controller_euler = torch.as_tensor(
              -old_physical, dtype=torch.float64
          )
          old_matrix = rotation_conversions.euler_angles_to_matrix(
              old_controller_euler, "XYZ"
          )

          # The patched converter causes the controller to receive exactly the
          # XYZ Euler representation of the desired relative rotation.
          fixed_matrix = rotation_conversions.euler_angles_to_matrix(
              expected_euler, "XYZ"
          )

          def angular_error_deg(actual, expected):
              rel = actual.transpose(-1, -2) @ expected
              cos_theta = ((torch.trace(rel) - 1.0) / 2.0).clamp(-1.0, 1.0)
              return math.degrees(float(torch.acos(cos_theta)))

          report = {
              "pr_head": "034e40c3c3540e68487171fc8095554f5748ec7a",
              "witness_euler_xyz_rad": expected_euler.tolist(),
              "old_axis_angle_as_euler_error_deg": angular_error_deg(
                  old_matrix, expected_matrix
              ),
              "patched_xyz_euler_error_deg": angular_error_deg(
                  fixed_matrix, expected_matrix
              ),
              "claim_boundary": (
                  "deterministic production-convention witness; not a policy "
                  "training-success claim"
              ),
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          with open("/tmp/maniskill-pr1495-geometry.json", "w") as f:
              json.dump(report, f, indent=2, sort_keys=True)
          assert report["old_axis_angle_as_euler_error_deg"] > 1.0
          assert report["patched_xyz_euler_error_deg"] < 1e-5
          PY

      - name: Upload geometry evidence
        uses: actions/upload-artifact@v4
        with:
          name: maniskill-pr1495-geometry
          path: /tmp/maniskill-pr1495-geometry.json
          if-no-files-found: error