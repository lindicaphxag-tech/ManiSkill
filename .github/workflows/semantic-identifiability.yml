name: SemRepair semantic identifiability certificate

on:
  pull_request:
    paths:
      - "validation/semrepair/semantic_identifiability_certificate.py"
      - "validation/semrepair/test_semantic_identifiability_certificate.py"
      - "validation/crossstack/lerobot_identifiability_collision.json"
      - ".github/workflows/semantic-identifiability.yml"
  push:
    branches:
      - "validation/maniskill1495-maintainer-request"
    paths:
      - "validation/semrepair/semantic_identifiability_certificate.py"
      - "validation/semrepair/test_semantic_identifiability_certificate.py"
      - "validation/crossstack/lerobot_identifiability_collision.json"
      - ".github/workflows/semantic-identifiability.yml"

jobs:
  certificate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run certificate tests
        run: |
          python -m pip install pytest
          python -m pytest -q validation/semrepair/test_semantic_identifiability_certificate.py
      - name: Issue LeRobot collision certificate
        run: |
          python validation/semrepair/semantic_identifiability_certificate.py             validation/crossstack/lerobot_identifiability_collision.json             --output /tmp/lerobot_identifiability_certificate.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/lerobot_identifiability_certificate.json"))
          assert p["status"]=="fail"
          assert p["collisions"]
          print("certificate_sha256=",p["certificate_sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-identifiability-${{ matrix.python-version }}
          path: /tmp/lerobot_identifiability_certificate.json
