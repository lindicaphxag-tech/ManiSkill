name: CRG Core Artifact

on:
  push:
    branches:
      - "artifact/crg-core-v1-2026-10-06"
  pull_request:
    paths:
      - "research/eprc/**"
      - "tests/test_eprc_*.py"
      - "CRG_CORE_REVIEW.md"
      - ".github/workflows/crg-core-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependencies
        run: python -m pip install -q numpy pytest
      - name: Run frozen CRG core tests
        run: >-
          python -m pytest -q
          tests/test_eprc_contract_signature.py
          tests/test_eprc_repairability_geometry.py
          tests/test_eprc_robust_repairability.py
          tests/test_eprc_repairability_witness.py
          tests/test_eprc_robust_repairability_witness.py
          tests/test_eprc_certificate_directed_probing.py
          tests/test_eprc_active_minimal_certificate.py
          tests/test_eprc_certificate_identifiability.py
          tests/test_eprc_external_replication_gate.py
          tests/test_eprc_evidence_action_router.py
