name: SemRepair evidence-qualified repair authority

on:
  pull_request:
    paths:
      - "validation/semrepair/evidence_qualified_authority.py"
      - "validation/semrepair/test_evidence_qualified_authority.py"
      - "validation/semrepair/evidence_authority_case_*.json"
      - ".github/workflows/evidence-qualified-authority.yml"
  push:
    branches:
      - "validation/maniskill1495-maintainer-request"
    paths:
      - "validation/semrepair/evidence_qualified_authority.py"
      - "validation/semrepair/test_evidence_qualified_authority.py"
      - "validation/semrepair/evidence_authority_case_*.json"
      - ".github/workflows/evidence-qualified-authority.yml"

jobs:
  authority:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run authority tests
        run: |
          python -m pip install pytest
          python -m pytest -q validation/semrepair/test_evidence_qualified_authority.py
      - name: Evaluate frozen public evidence cases
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from validation.semrepair.evidence_qualified_authority import authorize_pre_dispatch, from_mapping
          expected={
              "evidence_authority_case_lerobot.json":"measurement_qualification",
              "evidence_authority_case_maniskill.json":"execution_effect",
          }
          out={}
          for name,stage in expected.items():
              payload=json.loads((Path("validation/semrepair")/name).read_text())
              d=authorize_pre_dispatch(from_mapping(payload))
              assert not d.authorized
              assert d.stage==stage
              out[name]=d.to_dict()
          Path("/tmp/evidence-qualified-authority.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-qualified-authority-${{ matrix.python-version }}
          path: /tmp/evidence-qualified-authority.json
