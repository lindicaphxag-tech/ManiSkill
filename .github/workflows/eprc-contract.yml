name: EPRC Contract Capsule

on:
  pull_request:
    paths:
      - "research/eprc/**"
      - "tests/test_eprc_*.py"
      - ".github/workflows/eprc-contract.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest numpy
      - run: pip wheel --no-deps research/eprc/lerobot_plugin -w /tmp/eprc-wheel
      - run: python -m pytest -q tests/test_eprc_runtime.py tests/test_eprc_authority_transfer_gate.py tests/test_eprc_public_evidence.py tests/test_eprc_physical_ir.py tests/test_eprc_contract_signature.py tests/test_eprc_maniskill_joint_dec.py tests/test_eprc_support_restricted_authority.py tests/test_eprc_groot_joint_dec.py tests/test_eprc_authority_loss.py tests/test_eprc_cross_policy_dec_gate.py tests/test_eprc_local_chart_equivalence.py tests/test_eprc_replication_record.py tests/test_eprc_plugin_conformance.py tests/test_eprc_lerobot_plugin_core.py tests/test_eprc_lerobot_plugin_package.py
