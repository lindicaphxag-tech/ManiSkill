name: EPRC Contract Capsule

on:
  pull_request:
    paths:
      - "research/eprc/**"
      - "tests/test_eprc_runtime.py"
      - ".github/workflows/eprc-contract.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tests/test_eprc_runtime.py tests/test_eprc_public_evidence.py tests/test_eprc_physical_ir.py tests/test_eprc_contract_signature.py
