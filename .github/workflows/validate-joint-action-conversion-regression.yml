name: Validate joint action conversion regression

on:
  push:
    branches:
      - "fix/joint-delta-to-joint-pos-semantics"
    paths:
      - "mani_skill/trajectory/utils/actions/conversion.py"
      - "tests/test_action_conversion_joint_semantics.py"
      - "tests/test_pd_joint_delta_to_pos_regression.py"
      - ".github/workflows/validate-joint-action-conversion-regression.yml"

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Preserve end-to-end regression outside worktree
        run: cp tests/test_pd_joint_delta_to_pos_regression.py /tmp/test_pd_joint_delta_to_pos_regression.py
      - name: Confirm upstream base fails
        shell: bash
        run: |
          BASE_SHA="$(git merge-base HEAD origin/main)"
          git checkout --detach "$BASE_SHA"
          set +e
          python -m pytest -q /tmp/test_pd_joint_delta_to_pos_regression.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected upstream base to fail, but it passed."
            exit 1
          fi
          echo "BASE_FAIL_CONFIRMED=1" >> "$GITHUB_ENV"
          git checkout --detach "$GITHUB_SHA"
      - name: Confirm patch passes
        run: |
          python -m py_compile mani_skill/trajectory/utils/actions/conversion.py
          python -m pytest -q             tests/test_action_conversion_joint_semantics.py             tests/test_pd_joint_delta_to_pos_regression.py
      - name: Record evidence contract
        run: |
          test "$BASE_FAIL_CONFIRMED" = "1"
          echo "base-fail / patch-pass evidence complete"
