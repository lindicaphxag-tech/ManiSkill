name: Final joint conversion evidence

on:
  push:
    branches:
      - "fix/joint-delta-to-joint-pos-semantics-clean"
    paths:
      - ".github/workflows/final-joint-conversion-evidence.yml"
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ManiSkill
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run focused patched-branch tests
        run: |
          python -m pytest -q             tests/test_action_conversion_joint_semantics.py             tests/test_pd_joint_delta_to_pos_regression.py
      - name: Preserve end-to-end regression witness
        run: cp tests/test_pd_joint_delta_to_pos_regression.py /tmp/regression.py
      - name: Prove upstream base fails identical witness
        shell: bash
        run: |
          set -euo pipefail
          git checkout 107c9528b23b55bd276cf723c260a45ae7ce00ec
          cp /tmp/regression.py tests/_semantic_regression.py
          set +e
          python -m pytest -q tests/_semantic_regression.py > /tmp/base.log 2>&1
          status=$?
          set -e
          cat /tmp/base.log
          if [ "$status" -eq 0 ]; then
            echo "Unexpected: upstream base passes the semantic regression"
            exit 1
          fi
          echo "EXPECTED_BASE_FAILURE=1"
      - name: Prove clean branch passes identical witness
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$GITHUB_SHA"
          python -m pip install -e . --no-deps
          python -m pytest -q tests/test_pd_joint_delta_to_pos_regression.py
          echo "CLEAN_BRANCH_PASS=1"
