name: "Known ACK authority pure-python proofs, false confidence counterexample, and no-private-state contract"
on:
  push:
    branches: [research/dynamics-shift-anchor-ack-new64-20261009]
    paths:
      - 'research/public_ack_authority_core.py'
      - 'research/test_public_ack_authority_core.py'
      - '.github/workflows/ack-known-action-public-core-regression.yml'
permissions:
  contents: read
jobs:
  seven-real-falsification-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        py: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Static pure-stdlib public model/no hidden target regression + negative safety guarantee
        run: |
          set -euo pipefail
          python -m unittest -v research.test_public_ack_authority_core
          python -m py_compile research/public_ack_authority_core.py
