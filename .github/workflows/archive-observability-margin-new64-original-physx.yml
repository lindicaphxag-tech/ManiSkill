name: "Preserve and independently re-audit ORIGINAL new64 margin-gate 640 PhysX worlds"
on:
  push:
    branches: [research/observability-margin-gate-new64-20261009]
    paths:
      - .github/workflows/archive-observability-margin-new64-original-physx.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  recheck-original-640-native-worlds-no-physics-reexecution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/observability-margin-gate-new64-20261009
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Refuse mutable new rule / prereg / scorer revisions after native outcomes
        run: |
          set -euo pipefail
          test "$(git hash-object research/OBSERVABILITY_MARGIN_GATE_NEW64_PREOUTCOME_V1.json)" = f336ee90629f3d9098506d316687b66aaabaa5e8
          test "$(git hash-object research/frozen_ppo_observability_margin_physx.py)" = ff044c2b0c291cc6573edcc39c8514c024762b18
          python -m py_compile research/audit_observability_margin_original64.py
      - uses: actions/download-artifact@v4
        with:
          repository: lindicaphxag-tech/ManiSkill
          run-id: 37928735993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: original-new64-*
          path: /tmp/original_margin_8_shards
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          repository: lindicaphxag-tech/ManiSkill
          run-id: 37928735993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: exploratory-new64-margin-640world-original-native-physx-full-audit
          path: /tmp/original_margin_full
          merge-multiple: true
      - name: Recalculate every single original native outcome and source SHA256 independently
        run: |
          set -euo pipefail
          mkdir -p /tmp/new_audit
          python -m research.audit_observability_margin_original64 \
             --originals /tmp/original_margin_8_shards \
             --completed-full /tmp/original_margin_full/new64_actual_physx_full_audit.json \
             --output /tmp/new_audit/independent_original64_source_reaudit.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/new_audit/independent_original64_source_reaudit.json'))
          a=d['overall']
          assert a=={'n':64,'A_success':52,'B_success':52,'C_success':53,
                     'A_reads':39,'B_reads':41,'C_reads':64,
                     'A_authorized':25,'B_authorized':23,'A_wrong':0,'B_wrong':0,
                     'both_A_B_success':52,'both_A_B_fail':12,'A_only':0,'B_only':0}
          assert d['by_task']['pull_cube']['n']==32 and d['by_task']['stack_cube']['n']==32
          assert len(d['SHA256_original_shards'])==8
          assert len(d['per_actual_original_state'])==64
          print('PASS: SEPARATE COMPLETE PHYSICAL-SOURCE AUDITOR; NEGATIVE FINDING PRESERVED')
          PY
      - name: Permanently preserve exact originals and both independent full audits
        run: |
          set -euo pipefail
          folder=research/frozen_policy_transfer/evidence/observability_margin_gate_new64_original_2020001_2030032
          mkdir -p "$folder"
          for sub in /tmp/original_margin_8_shards/original-new64-*; do
            name="$(basename "$sub")"
            test -s "$sub/GIT_SOURCE_SHA.txt"
            test -s "$sub/original8_verified_summary.json"
            cp "$sub/GIT_SOURCE_SHA.txt" "$folder/${name}_source_commit.txt"
            cp "$sub/original8_verified_summary.json" "$folder/${name}_audit.json"
            for p in "$sub"/mixed_ack_*_original8.json; do
              test -s "$p"
              cp "$p" "$folder/${name}_original8.json"
            done
          done
          cp /tmp/original_margin_full/new64_actual_physx_full_audit.json "$folder/original_run_full64_audit.json"
          cp /tmp/new_audit/independent_original64_source_reaudit.json "$folder/independent_new_source_only_original64_audit.json"
          cd "$folder"
          sha256sum ./*.json ./*_source_commit.txt | LC_ALL=C sort -k2 > SHA256SUMS
          cat > README.md <<'EOF'
          # Original 64 source-authenticated true 2x2 ACK histories — 640 actual native PhysX controller worlds

          ## Actual original execution and source
          The exact 8 genuine ten-world per-seed native PhysX source shards were physically executed by the author's controlled CI: [run 37928735993](https://github.com/lindicaphxag-tech/ManiSkill/actions/runs/37928735993). Two frozen publicly released PPOs on PullCube and StackCube, **64 entirely new source reset states**, actual t2/t3 independent APPLIED/HELD hidden ACKs, 4 physically balanced history truths per task. The *initial attempted native workflow* [37928384548](https://github.com/lindicaphxag-tech/ManiSkill/actions/runs/37928384548) failed BEFORE physics because it invoked the old experiment module. The invocation was corrected and rerun with unchanged exact native source blob `ff044c2b0c291cc6573edcc39c8514c024762b18` and unchanged prereg blob `f336ee90629f3d9098506d316687b66aaabaa5e8`. Do not pool the failed attempt as a real completed experiment.

          ## Negative discovery (do not selectively report favorable numbers)
          The baseline public complete-history method A succeeded 52/64 with 39 decision-time private target reads, 25 public authorized histories and 0 **observed** wrong labels on this cohort. The extra 4.5-mm separation gate B succeeded on **exactly the same 52 reset states**, required **41** private target reads and had 23 authorizations/0 observed wrong. Fixed authoritative-reader C succeeded 53/64 and used 64 reads. The new gate **did not demonstrate improved task performance or empirical wrong-label reduction**, costing two extra private reads. The threshold was selected retrospectively after an older wrong confident history on seed 1730027; this is a new prospective *falsification* of any claim that simply raising the margin must improve a risk-vs-read frontier.

          ## Technical fairness and falsifiers
          A and B used **same two PUBLIC achieved XYZ samples**, identical actual t2/t3 executed native six-axis command prefixes, the same known-delivered neutral t4, pre-t5 matched achieved/target physical SE(3) and the same belief/compiler semantics. All complete original PhysX scripts include a fixed reader and seven other native controls. Strict-exact refusal can end before the shared probe; do not claim all ten arms receive it. Zero wrong history observations in this sample are NOT a safety guarantee. No real packet loss, VLA task recovery, cross-embodiment policy transfer, formal noninferiority or external independent execution is implied.

          The physical source, first native source auditor, independent full original source-only rerun, all actual 8 original source and shard audit JSON files, frozen source SHA identifiers and SHA256SUMS are retained without editing original bytes. Use `sha256sum -c SHA256SUMS` and `python -m research.audit_observability_margin_original64 --originals ... --completed-full ... --output /tmp/new.json` to recheck.
          EOF
          cd -
          git add "$folder"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m "evidence: preserve and independently audit complete original 640 PhysX margin-gate negative trial"
            git push origin HEAD:research/observability-margin-gate-new64-20261009
          fi
