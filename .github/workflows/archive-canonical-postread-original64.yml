          test "$(printf '%s\n' "$agg" | wc -l)" -eq 1
          cp "$agg" /tmp/canonical_flat/
          test "$(find /tmp/canonical_flat -maxdepth 1 -type f | wc -l)" -eq 17
          cat > /tmp/canonical_flat/SOURCE_SHA256SUMS <<'SHA_LOCK'
          57fc17b8c7fb90985f3ff8bc76a09938d43460ed3ef5238801cbe20a5eae2816  canonical_post_read_fresh64_original_complete.json
          2614b4632a3d28088c904393ed4f34dac2d3e48fb40e266742600a8efc3af259  canonical_post_read_pull_cube_chunk0_original8.json
          64410d68690608a593628310b450db5f2491c1edf5168f46f79f0d07c3c9a4e7  canonical_post_read_pull_cube_chunk1_original8.json
          e63750224be62fc29a0cca4b172f2f901cb6dc9e0426d5af39e989a15c83712d  canonical_post_read_pull_cube_chunk2_original8.json
          ffb04367f4bf5c08186dd8c5240b54643cb98a4bf827ecb06aaef901500d6de2  canonical_post_read_pull_cube_chunk3_original8.json
          3d62e87edf2d6d3f278d9319cf7379fd5c79350311d15e75f44d1091220410a0  canonical_post_read_stack_cube_chunk0_original8.json
          a7894debcd3d46a969b86a1602e7b27300f9282f6f45d4faad7849c97981a9c7  canonical_post_read_stack_cube_chunk1_original8.json
          69ad3064395daa7d21155ab90469ab1c94b6bc2d4c81d6b60305f7eebb4d003a  canonical_post_read_stack_cube_chunk2_original8.json
          5268561f4fce9062ed59cb42598b702e1d4c4e695543b29cfa03f5a2d2d697ae  canonical_post_read_stack_cube_chunk3_original8.json
          d2e2a6902bb8ad2d4eb5dc7b8c278481c2e7536e9447bf2f6b0d37a4eccd1665  canonical_pull_cube_chunk0.log
          26f08fd22536635bd7f4162e465fe783b55205f7007832dbf76bd639891c1ef1  canonical_pull_cube_chunk1.log
          a5d87a84dc899e51bee1405861663c45b1d615c8851545fce7ec9d145b33d576  canonical_pull_cube_chunk2.log
          a47b769369e7ea38d3c362140233def2198b3efa7f3d6a719d2c528ceb6bc286  canonical_pull_cube_chunk3.log
          aa0b2840294ac1cb5aed5d00c70d8cf729a120210bf22dd1b7c8697c2716b5e2  canonical_stack_cube_chunk0.log
          1a768776101ba74006fe639af7c902e11c9799bf51924c98d4a9a8d157025ad1  canonical_stack_cube_chunk1.log
          9f38d1e2fd05ee4f73fb869db0442bf5b5db9d5b483aa7054d113e90b4d880ca  canonical_stack_cube_chunk2.log
          5229fd39bd061c7df35afa61d5faad9c2603c2320e784af17d8787aeddff4618  canonical_stack_cube_chunk3.log
