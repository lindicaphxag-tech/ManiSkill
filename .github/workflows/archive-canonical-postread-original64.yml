      - name: Preserve untouched source JSONs and full original log on main without overwriting
        run: |
          set -euo pipefail
          dst=research/frozen_policy_transfer/evidence/canonical_post_read_64_970001_980032
          mkdir -p "$dst"
          cp /tmp/canonical_flat/*.json /tmp/canonical_flat/*.log /tmp/canonical_flat/SOURCE_SHA256SUMS "$dst/"
          cat > "$dst/README.md" <<'EOF'
          # Corrected post-read canonical controller, negative novelty result
          Original full genuine author-operated ten-controller-arm PhysX execution: run 37914020907, head 0b8e05f1f4787f5b385d666f427bd20d74a2ca78, attempt 1.
