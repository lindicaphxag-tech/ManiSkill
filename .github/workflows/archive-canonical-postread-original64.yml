          git add "$dst"
          if git diff --cached --quiet; then echo 'Source evidence already permanently saved'; exit 0; fi
          git commit -m 'evidence: archive 64 10-arm canonical post-read negative original PhysX episodes with source SHA'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then echo 'Successfully preserved original evidence on new main'; exit 0; fi
          done
          echo 'Safe non-force push could not complete after four attempts'
          exit 1
