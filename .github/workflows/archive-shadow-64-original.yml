name: Archive exact 64-state prospective shadow target observer original evidence
on:
  pull_request:
    paths:
      - '.github/workflows/archive-shadow-64-original.yml'
      - 'research/action_abi_shadow_aggregate.py'
      - 'research/ACTION_ABI_SHADOW_OBSERVER_PREREG_V1.json'
      - 'research/frozen_policy_transfer/verify_shadow_source.py'
      - 'tests/test_action_abi_shadow_observer_auditor.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-shadow-64-original.yml'
      - 'research/action_abi_shadow_aggregate.py'
      - 'research/ACTION_ABI_SHADOW_OBSERVER_PREREG_V1.json'
      - 'research/frozen_policy_transfer/verify_shadow_source.py'
      - 'tests/test_action_abi_shadow_observer_auditor.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  immutable-original-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only validate the original complete CI run, artifact ZIP digest and frozen protocol
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object research/ACTION_ABI_SHADOW_OBSERVER_PREREG_V1.json)" = "285a7457e4aa05240b970e5550bcf06942535ceb"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37818985343 --jq .head_sha)" = "f2bee90ef7ff2550351f579056688bd441044857"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37818985343 --jq .conclusion)" = "success"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11568143703 --jq .digest)" = "sha256:f5164ebe8e2ddf0db0acb0cefa5f11f90ac02ad39743959a19fda06829fb3420"
          mkdir -p /tmp/shadow-download /tmp/shadow-exact
          gh run download 37818985343 --repo "$GITHUB_REPOSITORY" --name all-64-source-state-shadow-observer-falsifier --dir /tmp/shadow-download
          for name in \
            abi_shadow_pull_cube_chunk_0.json \
            abi_shadow_pull_cube_chunk_1.json \
            abi_shadow_pull_cube_chunk_2.json \
            abi_shadow_pull_cube_chunk_3.json \
            abi_shadow_stack_cube_chunk_0.json \
            abi_shadow_stack_cube_chunk_1.json \
            abi_shadow_stack_cube_chunk_2.json \
            abi_shadow_stack_cube_chunk_3.json \
            shadow-64-full-aggregate.json; do
            mapfile -t found < <(find /tmp/shadow-download -type f -name "$name")
            test "${#found[@]}" -eq 1
            cp "${found[0]}" "/tmp/shadow-exact/$name"
          done
          python -m research.frozen_policy_transfer.verify_shadow_source --input-dir /tmp/shadow-exact --sha256-file /tmp/shadow-exact/SHA256SUMS
          
      - name: Fail-closed adversarial auditor checks
        run: python -m unittest discover -s tests -p 'test_action_abi_shadow_observer_auditor.py' -v

  trusted-main-source-byte-archive:
    if: github.event_name != 'pull_request'
    needs: immutable-original-source-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck exact original workflow provenance, downloaded source and every seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object research/ACTION_ABI_SHADOW_OBSERVER_PREREG_V1.json)" = "285a7457e4aa05240b970e5550bcf06942535ceb"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37818985343 --jq .head_sha)" = "f2bee90ef7ff2550351f579056688bd441044857"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37818985343 --jq .conclusion)" = "success"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11568143703 --jq .digest)" = "sha256:f5164ebe8e2ddf0db0acb0cefa5f11f90ac02ad39743959a19fda06829fb3420"
          mkdir -p /tmp/shadow-download /tmp/shadow-exact
          gh run download 37818985343 --repo "$GITHUB_REPOSITORY" --name all-64-source-state-shadow-observer-falsifier --dir /tmp/shadow-download
          for name in \
            abi_shadow_pull_cube_chunk_0.json \
            abi_shadow_pull_cube_chunk_1.json \
            abi_shadow_pull_cube_chunk_2.json \
            abi_shadow_pull_cube_chunk_3.json \
            abi_shadow_stack_cube_chunk_0.json \
            abi_shadow_stack_cube_chunk_1.json \
            abi_shadow_stack_cube_chunk_2.json \
            abi_shadow_stack_cube_chunk_3.json \
            shadow-64-full-aggregate.json; do
            mapfile -t found < <(find /tmp/shadow-download -type f -name "$name")
            test "${#found[@]}" -eq 1
            cp "${found[0]}" "/tmp/shadow-exact/$name"
          done
          python -m research.frozen_policy_transfer.verify_shadow_source --input-dir /tmp/shadow-exact --sha256-file /tmp/shadow-exact/SHA256SUMS
          
      - name: Persist exactly nine verified original JSONs plus checksums
        run: |
          set -euo pipefail
          dest=research/frozen_policy_transfer/evidence/shadow_observer_64_71001_81032
          mkdir -p "$dest"
          cp /tmp/shadow-exact/*.json "$dest/"
          cp /tmp/shadow-exact/SHA256SUMS "$dest/"
          cat > "$dest/README.md" <<'EOF'
          # Original complete 64-state shadow target-memory observer evidence
          This is an author-run genuine ManiSkill PhysX frozen-policy test, NOT an independent third-party simulation or real robot safety proof.
          Frozen source protocol: ed979138bed2cd4ac6b3e5c4137799ce7c73711a, Git blob 285a7457e4aa05240b970e5550bcf06942535ceb.
          Successful ORIGINAL exact-head CI: 37818985343, commit f2bee90ef7ff2550351f579056688bd441044857.
          Original 9-JSON archive artifact: GitHub Actions artifact 11568143703, ZIP digest sha256:f5164ebe8e2ddf0db0acb0cefa5f11f90ac02ad39743959a19fda06829fb3420.
          All nine JSON files are COPIED byte-for-byte from that artifact, not recreated from narrative reports. SHA256SUMS pins their content.
          PullCube seeds 71001–71032: source 32, naive 12, state-blind 12, exact-only/refuse 13, live bounded 32, history-reconstructed shadow bounded 32.
          StackCube seeds 81001–81032: source 29, naive 1, state-blind 1, exact-only/refuse 14, live bounded 29, shadow bounded 29.
          Every original binary paired shadow/live success agrees, with zero discordants in both tasks. Native target-state reconstruction error in the simulator is zero at recorded precision, but this 'shadow' runner STILL uses source controller target transformation code and checks the observation memory slice; it is NOT a fully private-state-blind implementation.
          See the separate stronger, acknowledged-action-only observer in ManiSkill research/action_abi_history_observer.py and its distinct 16-state prospective study.
          Bounded projected action is NOT_EXACT. All performance results are limited to the same Panda controller-family semantic mismatch.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"
          if git diff --cached --quiet; then
            echo 'Already source verified, no changes'
            exit 0
          fi
          git commit -m 'evidence: persist original 64-state shadow-memory PhysX JSONs and fixed SHA256SUMS'
          git pull --rebase origin main
          git push origin HEAD:main
