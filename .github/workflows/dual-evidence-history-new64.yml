name: "Original 64 matched-public dual-evidence guarded ACK PhysX"
on:
  push:
    branches: [research/dual-evidence-history-gate-new64-20261009]
    paths:
      - 'research/DUAL_EVIDENCE_HISTORY_NEW64_PREOUTCOME_V1.json'
      - 'research/frozen_ppo_dual_evidence_history_physx.py'
      - '.github/workflows/dual-evidence-history-new64.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prereg-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check frozen-before-new-results protocol and algorithm exact blobs
        run: |
          set -euo pipefail
          test "$(git hash-object research/DUAL_EVIDENCE_HISTORY_NEW64_PREOUTCOME_V1.json)" = "691adffdf1d1ec13f277f881dee35cb5e4fb5d56"
          test "$(git hash-object research/frozen_ppo_dual_evidence_history_physx.py)" = "19ac562ce020ff9c1867caca44c3399f4cdbe744"
          python -m py_compile research/frozen_ppo_dual_evidence_history_physx.py
          python - <<'PY'
          import json
          a=json.load(open("research/DUAL_EVIDENCE_HISTORY_NEW64_PREOUTCOME_V1.json"))
          assert a["schema"]=="preoutcome_dual_evidence_gate_frozen_ppo_ack_v1" and a["n"]==64 and a["tau"]==0.65
          assert a["registered_seeds"]=={"pull_cube":[1820001,1820009,1820017,1820025],"stack_cube":[1830001,1830009,1830017,1830025]}
          print("PASS: source/hash, two released policies, 0.65 dual-evidence gate frozen for all new64 before execution")
          PY
  real-native-physx:
    needs: prereg-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {task: pull_cube, first: 1820001}
          - {task: pull_cube, first: 1820009}
          - {task: pull_cube, first: 1820017}
          - {task: pull_cube, first: 1820025}
          - {task: stack_cube, first: 1830001}
          - {task: stack_cube, first: 1830009}
          - {task: stack_cube, first: 1830017}
          - {task: stack_cube, first: 1830025}
    env:
      ABI_TASK: ${{ matrix.task }}
      ABI_FIRST_SEED: ${{ matrix.first }}
      MS_SKIP_ASSET_DOWNLOAD_PROMPT: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install official CPU PhysX and frozen released PPO
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers libgl1 libosmesa6
          python -m pip install --upgrade pip
          python -m pip install -e . huggingface_hub
      - name: Run ten independently stepped actual controller worlds per registered original state
        run: |
          mkdir -p originals
          set -o pipefail
          PYTHONPATH="$PWD:$PWD/research" python -m research.frozen_ppo_dual_evidence_history_physx 2>&1 | tee originals/actual_native_physx.log
          mv "mixed_ack_${{ matrix.task }}_original8.json" originals/
      - name: Fail closed on missing physical prefixes, source truth, samples or success
        run: |
          python - <<'PY'
          import json,os,pathlib
          t=os.environ["ABI_TASK"]; f=int(os.environ["ABI_FIRST_SEED"])
          d=json.load(open(f"originals/mixed_ack_{t}_original8.json"))
          assert d["original_seed_population"]==list(range(f,f+8))
          assert d["real_physx_simulator"] is True and len(d["episodes"])==8
          A="fault_public_t3_fourhistory_or_t4_query"
          B="fault_same_public_posterior_or_query"
          F="fault_always_single_privileged_query"
          agg=dict(task=t,first=f,n=8,pub_success=0,post_success=0,fixed_success=0,
                   pub_reads=0,post_reads=0,fixed_reads=0,pub_unique=0,post_unique=0,
                   pub_wrong=0,post_wrong=0,prefix_matched=0,prefix_unmatched=0,
                   public_fault2_exposed=0,guarded_fault2_exposed=0,
                   public_XYZ_samples=0,guard_XYZ_samples=0,unmatched_seed_ids=[])
          for r in d["episodes"]:
            assert r["seed"] in range(f,f+8)
            idx=(r["seed"]-1)%4
            assert (r["original_precommitted_physical_t2_execution_truth"],r["original_precommitted_physical_t3_execution_truth"]) == (
                "applied" if idx in (1,3) else "held","applied" if idx in (2,3) else "held")
            for name in (A,B,F):
              faults=r["faults"].get(name,[])
              assert len(faults)<=2 and [v["step"] for v in faults] in ([],[2],[2,3])
              assert type(r["success_once"][name]) is bool
              assert type(r["privileged_target_readback_decision_count"][name]) is int
              assert 0<=r["privileged_target_readback_decision_count"][name]<=1
            a2=len(r["faults"].get(A,[]))==2
            b2=len(r["faults"].get(B,[]))==2
            agg["public_fault2_exposed"]+=int(a2)
            agg["guarded_fault2_exposed"]+=int(b2)
            c1=r.get("matched_prefix_physical_audit",{})
            c2=r.get("matched_posterior_prefix_audit",{})
            matched=bool(a2 and b2 and c1.get("valid_exact_prefix") and c2.get("valid_exact_prefix"))
            if matched:
              for c in (c1,c2):
                assert all(v<=5e-5 for v in c["native_fault_dispatch_linf_each"])
                assert c["pre_t5_achieved_position_max_abs_m"]<=5e-5
                assert c["pre_t5_target_position_max_abs_m"]<=5e-5
              agg["prefix_matched"]+=1
            else:
              assert (not a2 or not b2 or not c1.get("valid_exact_prefix") or not c2.get("valid_exact_prefix"))
              agg["prefix_unmatched"]+=1
              agg["unmatched_seed_ids"].append(r["seed"])
              print("REAL_PRE_FAULT_REFUSAL_NOT_MATCHED",t,r["seed"],r.get("refusals",{}).get(A),r.get("early_unmatched_fault"))
            for method,ev_key,reads_key,cost_key in (
              ("pub","public_t3_evidence",A,"public_XYZ_samples"),
              ("post","same_sensor_posterior_evidence",B,"guard_XYZ_samples")):
              ev=r.get(ev_key,{})
              count=r["public_motion_observation_cost_samples"].get(reads_key,0)
              assert count in (0,2),"One-sided public sample not allowed"
              agg[cost_key]+=count
              if count==2:
                assert type(ev.get("authorized")) is bool and type(ev.get("wrong_confident")) is bool
                assert r["privileged_target_readback_decision_count"][reads_key]==int(not ev["authorized"])
                if method=="post":
                  assert ev["posterior_threshold_predeclared"]==0.65
                  assert abs(sum(ev["posterior_weights"])-1)<1e-5
                  assert ev["authorized"] is False or ev["source_unique_compatibility"] is True
                agg[method+"_unique"]+=int(ev["authorized"])
                agg[method+"_wrong"]+=int(ev["wrong_confident"])
              else:
                assert ev.get("authorized") is not True
            for key,name in ((A,"pub"),(B,"post"),(F,"fixed")):
              agg[name+"_success"]+=int(r["success_once"][key])
              agg[name+"_reads"]+=r["privileged_target_readback_decision_count"][key]
          assert agg["prefix_matched"]+agg["prefix_unmatched"]==8
          pathlib.Path("originals/original8_verified_summary.json").write_text(json.dumps(agg,indent=2,sort_keys=True))
          print("AMENDED_NEW64_ORIGINAL_NATIVE_PHYSX_SHARD",json.dumps(agg,sort_keys=True))
          PY
      - name: Preserve original sources with SHA-256 and exact source pin
        if: always()
        run: |
          mkdir -p originals
          git rev-parse HEAD > originals/GIT_SOURCE_SHA.txt
          (cd originals && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-new64-${{ matrix.task }}-${{ matrix.first }}
          path: originals/
          retention-days: 90
  source-complete-original64-audit:
    needs: real-native-physx
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: original-new64-*
          path: /tmp/new64_orig
      - name: Verify exact all64 population without dropping contrary outcomes
        run: |
          python - <<'PY'
          import pathlib,json,collections
          root=pathlib.Path("/tmp/new64_orig")
          shard=list(root.rglob("original8_verified_summary.json"))
          assert len(shard)==8,(len(shard),shard)
          rows=[json.loads(p.read_text()) for p in shard]
          expected={("pull_cube",x) for x in (1820001,1820009,1820017,1820025)}|{("stack_cube",x) for x in (1830001,1830009,1830017,1830025)}
          assert {(r["task"],r["first"]) for r in rows}==expected
          assert all(r["n"]==8 for r in rows)
          keys=("n","pub_success","post_success","fixed_success","pub_reads","post_reads","fixed_reads",
             "pub_unique","post_unique","pub_wrong","post_wrong","prefix_matched","prefix_unmatched",
             "public_fault2_exposed","guarded_fault2_exposed","public_XYZ_samples","guard_XYZ_samples")
          out={k:sum(r[k] for r in rows) for k in keys}
          assert out["n"]==64 and out["prefix_matched"]+out["prefix_unmatched"]==64
          assert out["public_fault2_exposed"]<=64 and out["guarded_fault2_exposed"]<=64
          out["unmatched_seed_ids"]=[x for r in rows for x in r["unmatched_seed_ids"]]
          assert len(out["unmatched_seed_ids"])==out["prefix_unmatched"]
          out["source_kind"]="AUTHOR_OPERATED_REEXECUTION_AFTER_DISCLOSED_EARLY_REFUSAL_BOOKKEEPING_AMENDMENT"
          out["intention_to_test_original_reset_count"]=64
          out["controller_worlds_declared"]=640
          out["no_unqualified_all_prefix_causal_claim"]=True
          out["task_strata"]=rows
          pathlib.Path("new64_actual_physx_full_audit.json").write_text(json.dumps(out,indent=2,sort_keys=True))
          print("NEW64_ACTUAL_PHYSX_FULL_SOURCE_AUDIT",json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: new64-original-dual-evidence-640world-native-physx-audit
          path: new64_actual_physx_full_audit.json
