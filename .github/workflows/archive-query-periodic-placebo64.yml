      - name: Commit exact eight ORIGINAL byte-for-byte source JSONs and SHA256SUMS
        run: |
          set -euo pipefail
          dest=research/frozen_policy_transfer/evidence/certify_query_periodic_placebo_new64_260001_270032
          mkdir -p "$dest"
          cp /tmp/placebo64-unmodified/*.json "$dest/"
          (cd "$dest" && sha256sum ./*.json > SHA256SUMS && sha256sum -c SHA256SUMS)
          python -m research.audit_certify_query_periodic_placebo64 --input-dir "$dest" --output /tmp/certify-query-placebo-new64-after-copy-audit.json
          printf '%s\n' \
