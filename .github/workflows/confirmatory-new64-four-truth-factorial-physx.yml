name: "CONFIRMATORY new 64 independent same-seed ACK clusters 256 truth cells 2304 genuine PhysX worlds"
on:
  push:
    branches: [research/confirmatory-new64clusters-factorial-20261009]
    paths:
      - research/CONFIRMATORY_FOUR_TRUTH_NEW64CLUSTERS_PREOUTCOME_V1.json
      - research/frozen_ppo_numeric_parity_factorial_physx.py
      - research/run_confirmatory_four_truth_new64clusters.py
      - research/audit_confirmatory_four_truth_new64clusters.py
      - tests/test_confirmatory_four_truth_new64clusters.py
      - .github/workflows/confirmatory-new64-four-truth-factorial-physx.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prereg-source-freeze-and-adversarial-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze old model and pre-outcome factorial source identity
        run: |
          set -euo pipefail
          test "$(git hash-object research/TWO_UNKNOWN_ACK_TRUE_2X2_PPO64_PREOUTCOME_V1.json)" = 21465042519333ae948274a7f5ef02014efc6d19
          test "$(git hash-object research/frozen_ppo_true_twoack_2x2_physx.py)" = d9f1c435e6ad58ea4dc03189e51d532ac15ed351
          test "$(git hash-object research/empirical_probe_response_classifier.py)" = 064bb46831b61af73ad445bc836326837ec5468f
          test "$(git hash-object research/CONFIRMATORY_FOUR_TRUTH_NEW64CLUSTERS_PREOUTCOME_V1.json)" = ac563f4d2594c4d791b257c19e0a940393261fe8
          test "$(git hash-object research/frozen_ppo_numeric_parity_factorial_physx.py)" = 8022ab3a0d5bc97a982e78fc8ca17931aeae586c
          test "$(git hash-object research/run_confirmatory_four_truth_new64clusters.py)" = 2a9fcf978a84d22b1125930c26041c36f58ef418
          test "$(git hash-object research/audit_confirmatory_four_truth_new64clusters.py)" = 861100f728a4e0f7a8ac1f8ad027dc299c09de95
          python -m py_compile research/frozen_ppo_numeric_parity_factorial_physx.py research/run_confirmatory_four_truth_new64clusters.py research/audit_confirmatory_four_truth_new64clusters.py
      - name: Simulator-free falsification gates and seed-cluster statistics
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_confirmatory_four_truth_new64clusters.py

  physically-step-all-four-conditions-per-source-seed:
    needs: prereg-source-freeze-and-adversarial-tests
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        task: [pull_cube, stack_cube]
        chunk: [0, 1, 2, 3]
        truth_index: [0, 1, 2, 3]
    env:
      ABI_TASK: ${{ matrix.task }}
      CHUNK: ${{ matrix.chunk }}
      ABI_TRUTH_INDEX: ${{ matrix.truth_index }}
      PYTHONUNBUFFERED: '1'
      MS_SKIP_ASSET_DOWNLOAD_PROMPT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original frozen PPO and actual ManiSkill PhysX simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers libgl1 libosmesa6
          python -m pip install --upgrade pip
          python -m pip install -e . huggingface_hub
      - name: Save original source identity and runtime provenance
        run: |
          git rev-parse HEAD > FACTORIAL_SOURCE_COMMIT.txt
          python -m pip freeze --all > FACTORIAL_RUNTIME_PACKAGES.txt
      - name: Step eight reset IDs under one precommitted ACK truth condition
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD:$PWD/research" python research/run_confirmatory_four_truth_new64clusters.py \
            --task "$ABI_TASK" --chunk "$CHUNK" --truth-index "$ABI_TRUTH_INDEX" \
            2>&1 | tee factorial_physics_stdout.log
          test -s "factorial_${ABI_TASK}_chunk${CHUNK}_truth${ABI_TRUTH_INDEX}_original8.json"
          test -s "factorial_${ABI_TASK}_chunk${CHUNK}_truth${ABI_TRUTH_INDEX}_audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factorial-${{ matrix.task }}-chunk${{ matrix.chunk }}-truth${{ matrix.truth_index }}
          path: |
            factorial_*_original8.json
            factorial_*_audit.json
            factorial_physics_stdout.log
            FACTORIAL_SOURCE_COMMIT.txt
            FACTORIAL_RUNTIME_PACKAGES.txt
          retention-days: 90

  independent-all-population-paired-factorial-audit:
    needs: physically-step-all-four-conditions-per-source-seed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: factorial-*
          merge-multiple: true
          path: /tmp/ack_factorial_sources
      - name: Verify all 64 independent confirmatory original same-seed clusters contain all four real physical truths
        run: |
          set -euo pipefail
          python -m research.audit_numeric_parity_ack_factorial \
            --source-dir /tmp/ack_factorial_sources \
            --output /tmp/full_matched_factorial_128_native_physx_audit.json
          test -s /tmp/full_matched_factorial_128_native_physx_audit.json
          python - <<'PY'
          import json
          p='/tmp/full_matched_factorial_128_native_physx_audit.json'
          d=json.load(open(p))
          assert d["numerically_matched_public_source_observation_per_truth_verified"] is True
          assert d["numeric_max_public_policy_obs_gap"]<=5e-5
          assert d["numeric_max_initial_achieved_ee_pose_gap"]<=5e-5
          assert len(d["per_seed_full_four_truth_numeric_initial_parity"])==64
          assert d["registered_task_seed_truth_cells"]==256
          assert d["separate_physx_worlds"]==2304
          assert d["registered_source_reset_clusters"]==64
          assert len(d["complete_32_shard_sha256"])==64
          pairing=d["paired_public_vs_strong"]
          assert sum(pairing.values())==256
          # A scientifically NEGATIVE treatment effect is not a failed CI run.
          gain=d["method_success_delta_public_minus_strong_per_cell"]
          pvalue=d["seed_cluster_exact_swap_two_sided_sensitivity_p_not_randomized_proof"]
          print("CONFIRMATORY_PREREGISTERED_DECISION",json.dumps({
            "new_clusters":64,"cells":256,"native_worlds":2304,
            "gain":gain,"cluster_swap_p_descriptive":pvalue,
            "primary_practical_gain_at_least_004":gain>=.04,
            "primary_swap_p_at_most_005":pvalue<=.05,
            "claim_gate_under_exchangeability":gain>=.04 and pvalue<=.05,
            "outside_lab_reproduction":False},sort_keys=True))
          print("NUMERICALLY MATCHED NEW 64 SEED CLUSTERS; SOURCE-ONLY EXACT SAME-SEED FACTORIAL FULL AUDIT PASSED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CONFIRMATORY_numeric_parity_64clusters_256cells_2304worlds
          path: |
            /tmp/ack_factorial_sources/*.json
            /tmp/full_matched_factorial_128_native_physx_audit.json
          retention-days: 90
