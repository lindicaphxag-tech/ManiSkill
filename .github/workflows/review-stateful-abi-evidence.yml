name: External reviewer source-evidence verification (stdlib, no physics)

on:
  push:
    branches:
      - main
      - review/independent-stateful-abi-reproduction-20261009
  pull_request:
    paths:
      - 'research/frozen_policy_transfer/review/**'
      - 'research/frozen_policy_transfer/evidence/**'
      - '.github/workflows/review-stateful-abi-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-evidence:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run source-pinned full-denominator reviewer check with standard library only
        run: |
          python -m py_compile research/frozen_policy_transfer/review/verify_stateful_abi.py
          python research/frozen_policy_transfer/review/verify_stateful_abi.py
          python -m unittest discover -s research/frozen_policy_transfer/review -p test_paired_query_stats.py -v
          python research/frozen_policy_transfer/review/paired_query_stats.py --output /tmp/original_new64_paired_query_stats.json
          python -m research.audit_certify_query_periodic_placebo64 --input-dir research/frozen_policy_transfer/evidence/periodic_query_placebo_new64_260001_270032 --output /tmp/periodic_placebo_audit64.json
          python research/frozen_policy_transfer/review/one_extra_query_sensitivity.py --output /tmp/one_query_influence64.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/periodic_placebo_audit64.json'))
          y=json.load(open('/tmp/one_query_influence64.json'))
          assert x['original_new_distinct_seeds']==64
          assert x['adaptive_target_decision_reads']==17 and x['periodic_nonadaptive_target_decision_reads']==16
          assert x['native_task_success']['fault_robust_then_single_privileged_query']==58
          assert x['native_task_success']['fault_precommitted_seed_schedule_query']==47
          assert x['adaptive_vs_periodic']['adaptive_only']==12 and x['adaptive_vs_periodic']['comparator_only']==1
          assert y['remaining_worst_case_adaptive_success_min']==57
          assert y['worst_conditional_unadjusted_p_after_1_worst_case_flip']<=0.012939453125+1e-12
          assert y['status']=='THEORETICAL_SINGLE_EPISODE_INFLUENCE_NOT_SIMULATOR_RESULT'
          print('PASS: new truly disjoint 64-state near-matched-budget 58 vs47, 12 vs1 paired, one-read sensitivity clearly not a new experiment')
          PY
          python - <<'PY'
          import json
          r=json.load(open('/tmp/original_new64_paired_query_stats.json'))
          assert r['n']==64 and r['n_trained_policies']==2
          assert r['selective_privileged_decision_reads']==15
          assert r['mandatory_privileged_decision_reads']==64
          assert r['selective_success']==60 and r['mandatory_success']==57
          assert r['exact_two_sided_discordant_sign_test_p']==0.453125
          assert r['paired_risk_difference_95pct_joint_exact_conservative_ci'][0]<0
          assert r['paired_risk_difference_95pct_joint_exact_conservative_ci'][1]>0
          print('PASS: source-pinned paired inference, no unsupported noninferiority claim')
          PY
