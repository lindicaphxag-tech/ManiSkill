name: Validate CST trace semantics

concurrency:
  group: cst-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "research/controller-semantic-transport-v1"
    paths:
      - "cst_validation/**"
      - ".github/workflows/validate-cst-trace-semantics.yml"
  workflow_dispatch:

jobs:
  semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy pytest
      - name: Compile research modules
        run: |
          python -m py_compile cst_validation/controller_semantic_ir.py
          python -m py_compile cst_validation/semantic_morphism.py
          python -m py_compile cst_validation/trace_semantics.py
          python -m py_compile cst_validation/global_trace_morphism.py
          python -m py_compile cst_validation/contextual_trace_morphism.py
          python -m py_compile cst_validation/robosuite_joint_semantics.py
          python -m py_compile cst_validation/piecewise_affine_clip.py
      - name: Run controller semantic IR tests
        working-directory: cst_validation
        run: python -m pytest -q test_controller_semantic_ir.py
      - name: Run semantic morphism tests
        working-directory: cst_validation
        run: python -m pytest -q test_semantic_morphism.py
      - name: Run trace-semantic tests
        working-directory: cst_validation
        run: |
          python -m pytest -q test_trace_semantics.py --junitxml=trace-junit.xml

      - name: Run global trace morphism tests
        working-directory: cst_validation
        run: python -m pytest -q test_global_trace_morphism.py

      - name: Run contextual region compiler tests
        working-directory: cst_validation
        run: python -m pytest -q test_contextual_trace_morphism.py

      - name: Run robosuite affine-region semantic tests
        working-directory: cst_validation
        run: python -m pytest -q test_robosuite_joint_semantics.py

      - name: Run piecewise affine lowering tests
        working-directory: cst_validation
        run: python -m pytest -q test_piecewise_affine_clip.py

      - name: Upload trace-semantic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cst-trace-junit
          path: cst_validation/trace-junit.xml
          if-no-files-found: warn


  host-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ManiSkill and focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Match CST Trace IR against host PDJointPosController
        working-directory: cst_validation
        run: python -m pytest -q test_maniskill_host_parity.py


  robosuite-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned robosuite
        uses: actions/checkout@v4
        with:
          repository: ARISE-Initiative/robosuite
          ref: 5ce6643f3092639d08f7b0f90ed1c6a84f50552c
          path: robosuite-upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned robosuite and CST dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./robosuite-upstream
          python -m pip install numpy scipy pytest
      - name: Match CST against robosuite JointPositionController
        working-directory: cst_validation
        run: python -m pytest -q test_robosuite_host_parity.py
