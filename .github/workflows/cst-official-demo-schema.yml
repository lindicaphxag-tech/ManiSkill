name: Inspect official ManiSkill CST data

on:
  push:
    branches:
      - "validation/cst-semantic-reachability"
    paths:
      - "cst_validation/inspect_official_demo.py"
      - ".github/workflows/cst-official-demo-schema.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inspection dependencies
        run: python -m pip install numpy h5py
      - name: Inspect official PickCube trajectory schema
        run: python cst_validation/inspect_official_demo.py
