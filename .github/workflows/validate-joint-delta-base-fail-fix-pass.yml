name: Joint delta-pos base-fail fix-pass

on:
  push:
    branches:
      - "validation/joint-delta-to-pos-base-fail-fix-pass"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          path: validation
      - name: Checkout upstream-base snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - name: Checkout proposed fix
        uses: actions/checkout@v4
        with:
          ref: fix/joint-delta-to-joint-pos-pr
          path: patch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared ManiSkill dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "patch[dev]"
      - name: Baseline must fail the new semantic regression
        shell: bash
        run: |
          cp patch/tests/test_pd_joint_delta_to_pos_regression.py base/tests/
          set +e
          (cd base && PYTHONPATH=. python -m pytest -q tests/test_pd_joint_delta_to_pos_regression.py) | tee base.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "ERROR: baseline unexpectedly passes the regression"
            exit 1
          fi
          grep -E "FAILED|ERROR" base.log
          echo "BASE_EXPECTED_FAIL_EXIT=$code"
      - name: Proposed fix must pass the same semantic regression
        run: |
          cd patch
          PYTHONPATH=. python -m pytest -q tests/test_pd_joint_delta_to_pos_regression.py | tee ../patch.log
          grep -E "passed" ../patch.log
