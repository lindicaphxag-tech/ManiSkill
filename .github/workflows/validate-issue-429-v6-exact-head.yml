name: Validate issue 429 v6 exact head

on:
  push:
    branches:
      - validation/issue-429-v6-exact-head
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Assert exact v6 production identity
        shell: bash
        run: |
          set -euo pipefail
          PATCH=b0e1b85d5002ead77fc42a793183e5e0c72e01cb
          git merge-base --is-ancestor "$PATCH" HEAD
          test "$(git hash-object mani_skill/trajectory/utils/actions/conversion.py)" = "d816b2da557a1bc2909e79fa2caddcf60e66c57c"
          test "$(git hash-object tests/test_pd_joint_delta_to_pos_semantics.py)" = "faa049981d8a9de887b701a12062027e98ac6da1"
          changed="$(git diff --name-only "$PATCH"..HEAD | sort)"
          expected=".github/workflows/validate-issue-429-v6-exact-head.yml"
          test "$changed" = "$expected"

      - name: Install ManiSkill test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Freeze reproducer
        run: cp tests/test_pd_joint_delta_to_pos_semantics.py /tmp/test_issue_429_semantics.py

      - name: PATCH must pass exact frozen reproducer
        run: |
          python -m pytest -q /tmp/test_issue_429_semantics.py
          echo "PATCH_PASS_CONFIRMED=true" >> "$GITHUB_ENV"

      - name: UPSTREAM BASE must fail at original NumPy/Torch boundary
        shell: bash
        run: |
          git checkout 62ff3a5896b4d5b4cf0ac4c8d79afe600c9404a3
          set +e
          python -m pytest -q /tmp/test_issue_429_semantics.py > /tmp/base_failure.txt 2>&1
          code=$?
          set -e
          cat /tmp/base_failure.txt
          if [ "$code" -eq 0 ]; then
            echo "Frozen reproducer unexpectedly passes upstream base"
            exit 1
          fi
          if ! grep -E "TypeError:.*clip\\(\\)|got \\(numpy\\.ndarray" /tmp/base_failure.txt; then
            echo "Upstream base failed, but not at the frozen NumPy/Torch clip boundary"
            exit 1
          fi
          echo "BASE_FAIL_AT_NUMPY_TORCH_BOUNDARY=true" >> "$GITHUB_ENV"

      - name: Assert differential evidence
        run: |
          test "$PATCH_PASS_CONFIRMED" = "true"
          test "$BASE_FAIL_AT_NUMPY_TORCH_BOUNDARY" = "true"
          {
            echo "### ManiSkill #429 exact-head differential"
            echo "- clean patch: b0e1b85d5002ead77fc42a793183e5e0c72e01cb"
            echo "- production diff: 1 commit / 2 files"
            echo "- patch: frozen semantic reproducer passes"
            echo "- upstream base: original NumPy/Torch boundary failure reproduced"
          } >> "$GITHUB_STEP_SUMMARY"
