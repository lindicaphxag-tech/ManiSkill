name: Frozen two-ACK recovery action matrix native PhysX

on:
  push:
    branches:
      - "research/multiack-real-recovery-matrix-20261013"
    paths:
      - "research/TWO_ACK_REAL_RECOVERY_MATRIX_PREREG_20261013.json"
      - "research/two_ack_real_recovery_physx.py"
      - ".github/workflows/two-ack-real-recovery-physx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-ack-physx:
    name: Real PhysX ${{ matrix.robot }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        robot: [panda, xarm6_robotiq]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Provision real headless PhysX and robot assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers libgl1 libosmesa6
          python -m pip install --disable-pip-version-check -e .
      - name: Run complete frozen 4-seed x 4-hidden-truth x 5-recovery cells
        env:
          PYTHONUNBUFFERED: "1"
          MS_SKIP_ASSET_DOWNLOAD_PROMPT: "1"
        run: |
          set -o pipefail
          python -m research.two_ack_real_recovery_physx --robot ${{ matrix.robot }} 2>&1 | tee "two_ack_recovery_${{ matrix.robot }}_run.log"
          test -s "two_ack_recovery_matrix_${{ matrix.robot }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-two-ack-physx-${{ matrix.robot }}
          path: |
            two_ack_recovery_matrix_${{ matrix.robot }}.json
            two_ack_recovery_${{ matrix.robot }}_run.log
