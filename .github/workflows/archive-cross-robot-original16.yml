name: Permanently archive pristine original Panda xArm6 real PhysX results
on:
  push:
    branches: [evidence/panda-xarm6-original-cross-robot16-20261009, main]
    paths:
      - '.github/workflows/archive-cross-robot-original16.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  exact-source-run-and-original-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Attest source original genuine PhysX run artifact digest and all 16 original rows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object research/CROSS_EMBODIMENT_ACK_PREOUTCOME_V1.json)" = "4e10a144cdf5b2a3b5186629e93e1091d879cd64"
          test "$(git hash-object research/action_abi_history_observer.py)" = "2aa52e477c202386fb6a7e43586d246026b6041d"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37899544825 --jq .head_sha)" = "9e59c32043324180b671fa0ac5384917e1f95e3b"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37899544825 --jq .conclusion)" = "success"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11600894857 --jq .digest)" = "sha256:034622fad55b50a8ef13ef1de5036c6a933f51aa43d113eb2bded31f06e4bf10"
          mkdir -p /tmp/cross-robot-original16
          gh run download 37899544825 --repo "$GITHUB_REPOSITORY" --name entire-original-Panda-xArm6-real-physx-source-and-audit --dir /tmp/cross-robot-original16
          test "$(find /tmp/cross-robot-original16 -type f -name 'cross_robot_ack_*_original4.json' | wc -l)" = 4
          test "$(find /tmp/cross-robot-original16 -type f -name 'cross_robot_full_original16_audit.json' | wc -l)" = 1
          # The GitHub original full-source artifact preserves task/chunk subfolders.
          # Collect only the EXACT four expected filenames, each once. No renames,
          # cherry-picking or omission is permitted by the independent verifier.
          mkdir -p /tmp/cross-robot-flat
          for robot in panda xarm6_robotiq; do
            for chunk in 0 1; do
              name="cross_robot_ack_${robot}_chunk${chunk}_original4.json"
              mapfile -t matched < <(find /tmp/cross-robot-original16 -type f -name "$name")
              test "${#matched[@]}" = 1
              cp "${matched[0]}" "/tmp/cross-robot-flat/$name"
            done
          done
          mapfile -t aggregate < <(find /tmp/cross-robot-original16 -type f -name "cross_robot_full_original16_audit.json")
          test "${#aggregate[@]}" = 1
          cp "${aggregate[0]}" /tmp/cross-robot-flat/cross_robot_full_original16_audit.json
          python -m research.audit_cross_robot_ack_physx --input-dir /tmp/cross-robot-flat --output /tmp/cross_robot_recomputed_full16.json
          cmp /tmp/cross_robot_recomputed_full16.json /tmp/cross-robot-flat/cross_robot_full_original16_audit.json
          python -m unittest discover -s tests -p 'test_cross_robot_ack_audit.py' -v

  trusted-main-permanent-original-source-copy:
    if: github.ref == 'refs/heads/main'
    needs: exact-source-run-and-original-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repeat complete original archive evidence validation on trusted default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object research/CROSS_EMBODIMENT_ACK_PREOUTCOME_V1.json)" = "4e10a144cdf5b2a3b5186629e93e1091d879cd64"
          test "$(git hash-object research/action_abi_history_observer.py)" = "2aa52e477c202386fb6a7e43586d246026b6041d"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37899544825 --jq .head_sha)" = "9e59c32043324180b671fa0ac5384917e1f95e3b"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/37899544825 --jq .conclusion)" = "success"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11600894857 --jq .digest)" = "sha256:034622fad55b50a8ef13ef1de5036c6a933f51aa43d113eb2bded31f06e4bf10"
          mkdir -p /tmp/cross-robot-original16
          gh run download 37899544825 --repo "$GITHUB_REPOSITORY" --name entire-original-Panda-xArm6-real-physx-source-and-audit --dir /tmp/cross-robot-original16
          test "$(find /tmp/cross-robot-original16 -type f -name 'cross_robot_ack_*_original4.json' | wc -l)" = 4
          test "$(find /tmp/cross-robot-original16 -type f -name 'cross_robot_full_original16_audit.json' | wc -l)" = 1
          # The GitHub original full-source artifact preserves task/chunk subfolders.
          # Collect only the EXACT four expected filenames, each once. No renames,
          # cherry-picking or omission is permitted by the independent verifier.
          mkdir -p /tmp/cross-robot-flat
          for robot in panda xarm6_robotiq; do
            for chunk in 0 1; do
              name="cross_robot_ack_${robot}_chunk${chunk}_original4.json"
              mapfile -t matched < <(find /tmp/cross-robot-original16 -type f -name "$name")
              test "${#matched[@]}" = 1
              cp "${matched[0]}" "/tmp/cross-robot-flat/$name"
            done
          done
          mapfile -t aggregate < <(find /tmp/cross-robot-original16 -type f -name "cross_robot_full_original16_audit.json")
          test "${#aggregate[@]}" = 1
          cp "${aggregate[0]}" /tmp/cross-robot-flat/cross_robot_full_original16_audit.json
          python -m research.audit_cross_robot_ack_physx --input-dir /tmp/cross-robot-flat --output /tmp/cross_robot_recomputed_full16.json
          cmp /tmp/cross_robot_recomputed_full16.json /tmp/cross-robot-flat/cross_robot_full_original16_audit.json
          python -m unittest discover -s tests -p 'test_cross_robot_ack_audit.py' -v
      - name: Publish untouched original real PhysX JSONs with individual SHA256 source seals
        run: |
          set -euo pipefail
          dest=research/frozen_policy_transfer/evidence/cross_robot_panda_xarm6_original16_420001_430008
          mkdir -p "$dest"
          cp /tmp/cross-robot-flat/*.json "$dest/"
          (cd "$dest" && sha256sum *.json > SHA256SUMS && sha256sum -c SHA256SUMS)
          cat > "$dest/README.md" <<'EOF'
          # Cross-embodiment Panda / xArm6 stateful ACK ambiguity (mechanism, NOT policy transfer)

          **Preregistered before any runner implementation**: commit baa0c1f577902e9c1f782c348feaac7a4b3448a9; protocol Git blob 4e10a144cdf5b2a3b5186629e93e1091d879cd64.

          ORIGINAL first fully green real PhysX job 37899544825, source Git head 9e59c32043324180b671fa0ac5384917e1f95e3b. Exact 5-JSON original full source ZIP artifact 11600894857 digest sha256:034622fad55b50a8ef13ef1de5036c6a933f51aa43d113eb2bded31f06e4bf10. The five JSONs here are BYTE-FOR-BYTE original physical evidence from that run, not synthetic tests or later rerolled/edited results.

          Robot Panda actual native PickCube-v1 target pose controller: new seeds 420001–420008, 8/8 distinct target-hypothesis executions after unknown ACK, maximum per-step after-physics target history reconstruction 1.431e-8 meters; actual end-effector position separation between applied-v-held physical worlds after common zero action probe: 37.61–38.51 mm.

          Robot xArm6 Robotiq ORIGINAL distinct URDF/articulation: new seeds 430001–430008, 8/8 distinct target histories, maximum per-step reconstructed target error 1.431e-8 meters; achieved end-effector branch separation 41.55–41.70 mm after common zero-action probe. This robot uses DIFFERENT arm/gripper_active/gripper_passive action contract; no Panda robot substitution was permitted. The original source-complete full auditor checked 16/16 trial conditions across four PhysX shards.

          The earlier jobs initially FAILED because xArm6 has different composite action keys, then because CI reused one literal artifact name across shards. Both issues remain publicly verifiable. Only robot-specific native action packing and CI artifact names changed; preregistered seeds, fault, probe and action-history estimator were not tuned to results. The fully sourced 37899544825 run is a technical data-collection rerun, NOT new independent confirmatory seeds.

          Limits: THIS DOES NOT RUN A PRETRAINED PANDA PPO ON xArm6. These are controlled scripted native commands, not a new action-learning policy, active classifier or manipulation task-success result. The observer is told the two hypothetical actuator-delivery histories and correctly predicts each corresponding commanded target. It does NOT infer which hidden delivery actually occurred from a SINGLE online physical observation. Controller target state was accessed AFTER actual env.step exclusively for audit. No ROS/network packet loss, hardware/contact/collision safety, unknown controller model recovery or independent lab reproduction.

          Verification (stdlib, original branch source script available on public main):
          sha256sum -c SHA256SUMS
          python -m research.audit_cross_robot_ack_physx --input-dir research/frozen_policy_transfer/evidence/cross_robot_panda_xarm6_original16_420001_430008 --output /tmp/verified_original16.json
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"
          if git diff --cached --quiet; then echo "Original source already archived"; exit 0; fi
          git commit -m 'evidence: preserve real original Panda+xArm6 16-state native PhysX trials and SHA256SUMS'
          git pull --rebase origin main
          git push origin HEAD:main
