name: Validate issue 429 semantic ABI design

on:
  push:
    branches:
      - validation/issue-429-semantic-abi-design
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identify-action-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Assert exact production and solver identities
        shell: bash
        run: |
          set -euo pipefail
          PATCH=b0e1b85d5002ead77fc42a793183e5e0c72e01cb
          git merge-base --is-ancestor "$PATCH" HEAD
          test "$(git hash-object mani_skill/trajectory/utils/actions/conversion.py)" = "d816b2da557a1bc2909e79fa2caddcf60e66c57c"
          test "$(git hash-object .github/validation/embodied_semantic_experiment_design.py)" = "b375929fa17aeabdbc6d62dc865da64c0e26e92d"
          test "$(git hash-object tests/test_issue_429_semantic_abi_design.py)" = "4ab8db71c60dcb34cb1e1a8d20e29d16af22411d"

      - name: Install ManiSkill test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run production-grounded semantic ABI identification
        run: |
          python -m pytest -q -s tests/test_issue_429_semantic_abi_design.py

      - name: Record claim boundary
        run: |
          {
            echo "### ManiSkill #429 semantic ABI experiment design"
            echo "- production patch head: b0e1b85d5002ead77fc42a793183e5e0c72e01cb"
            echo "- candidate semantics: source-native passthrough / physical-qpos passthrough / target-chart re-encoding"
            echo "- neutral zero action: intentionally uninformative"
            echo "- asymmetric nonzero action: frozen discriminating probe"
            echo "- solver optimum: scoped to the supplied finite candidate experiment table"
            echo "- external adoption credit: 0"
          } >> "$GITHUB_STEP_SUMMARY"
