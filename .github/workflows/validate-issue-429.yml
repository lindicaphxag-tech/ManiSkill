name: Validate issue 429 conversion fix

on:
  push:
    branches:
      - "fix/429-joint-delta-to-pos-conversion"
    paths:
      - "mani_skill/trajectory/utils/actions/conversion.py"
      - "tests/test_joint_delta_to_pos_conversion.py"
      - ".github/workflows/validate-issue-429.yml"

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run focused conversion regressions
        run: python -m pytest -q tests/test_joint_delta_to_pos_conversion.py
      - name: Syntax and whitespace checks
        run: |
          python -m py_compile mani_skill/trajectory/utils/actions/conversion.py
          git diff --check HEAD^
