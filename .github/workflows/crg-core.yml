name: Robust CRG Core

on:
  pull_request:
    paths:
      - "research/crg_core/**"
      - "tests/test_crg_core.py"
      - "tests/test_crg_active_probe.py"
      - "tests/test_crg_local_model.py"
      - "tests/test_crg_replication_record.py"
      - "tests/test_crg_independent_proof_checker.py"
      - "tests/test_crg_clustered_evidence_audit.py"
      - "tests/test_crg_20case_evidence_replay.py"
      - "tests/test_crg_request_conditional_transfer.py"
      - "tests/test_crg_paired_state_conformal_transfer.py"
      - "tests/test_crg_transfer_authorization_ledger.py"
      - "tests/test_crg_fresh13_archive_replay.py"
      - "tests/test_crg_directional_anytime_probes.py"
      - ".github/workflows/crg-core.yml"
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q numpy pytest
      - run: python -m pytest -q tests/test_crg_core.py tests/test_crg_active_probe.py tests/test_crg_local_model.py tests/test_crg_replication_record.py tests/test_crg_independent_proof_checker.py tests/test_crg_clustered_evidence_audit.py tests/test_crg_20case_evidence_replay.py tests/test_crg_request_conditional_transfer.py tests/test_crg_paired_state_conformal_transfer.py tests/test_crg_transfer_authorization_ledger.py tests/test_crg_fresh13_archive_replay.py tests/test_crg_directional_anytime_probes.py
      - run: python research/crg_core/demo.py
      - name: Exercise external-replication seal and validator
        run: |
          cp research/crg_core/replication_example.json /tmp/crg-replication.json
          python -m research.crg_core.seal_replication /tmp/crg-replication.json
          python -m research.crg_core.replication_record /tmp/crg-replication.json
      - name: Reconstruct frozen 20-case negative result and clustered sensitivity
        run: |
          python -m research.crg_core.evidence.pusht_cross_policy_20case_v2.replay --output /tmp/clustered_negative_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: crg-frozen-20case-v2-negative-clustered-audit
          path: /tmp/clustered_negative_result.json
          retention-days: 90
      - name: Reconstruct original 13-state pilot and correctly count only transfer authorizations
        run: |
          python -m research.crg_core.evidence.conformal_fresh_13state_v1.replay_archive --output /tmp/crg-fresh13-zero-utility-replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: crg-fresh13-original-zero-utility-and-transfer-ledger
          path: /tmp/crg-fresh13-zero-utility-replay.json
          retention-days: 90
