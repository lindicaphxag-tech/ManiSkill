name: Validate CST semantic morphisms

on:
  push:
    branches:
      - "fix/joint-delta-to-joint-pos-semantics"
    paths:
      - "cst_validation/semantic_morphism.py"
      - "cst_validation/test_semantic_morphism.py"
      - ".github/workflows/validate-cst-semantic-morphisms.yml"
  workflow_dispatch:

jobs:
  morphism:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pytest
      - name: Run semantic morphism tests
        working-directory: cst_validation
        run: |
          python -m py_compile semantic_morphism.py
          python -m pytest -vv test_semantic_morphism.py
