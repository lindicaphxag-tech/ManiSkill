name: JAX upstream PR 41227 exact-source CPU numerical and grad verification
on:
  push:
    branches: [validation/jax41227-exact-pr-source-20261010]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-exact-review-head:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      JAX_ENABLE_X64: 'true'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lindicaphxag-tech/jax
          ref: 7cada74c6baf4d1b3343265cc12329637fdc2894
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify submitted source blob hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7cada74c6baf4d1b3343265cc12329637fdc2894
          test "$(git hash-object jax/_src/scipy/stats/t.py)" = 8629860616333c599791c43d6c6366d9e87ab533
          test "$(git hash-object tests/scipy_stats_test.py)" = c18d8a90ac3982aa483a6f0151ebddc8ff60e92c
          python -m py_compile jax/_src/scipy/stats/t.py tests/scipy_stats_test.py
          echo EXACT_JAX_41227_HEAD_ACCEPTED_SOURCE_IDENTIFIED
      - name: Install exact JAX source against published CPU jaxlib
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[ci]' pytest absl-py hypothesis parameterized portpicker
      - name: Maintainer-requested vectorized float32/64 regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/scipy_stats_test.py -k 'testTLogPdfLargeDf' | tee large_df_native_jax_test.log
      - name: Verify eager / JIT / gradients against independent SciPy values
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee student_t_differential.log
          import numpy as np, scipy.stats as ref
          import jax, jax.numpy as jnp
          from jax.scipy.stats import t
          print('JAX_VERSION',jax.__version__, 'JAXLIB',jax.lib.__version__)
          for dtype in [jnp.float32,jnp.float64]:
              x=jnp.array([-3.,-1.,0.,1.,3.],dtype=dtype)
              df=jnp.array([30.,1e3,1e4,1e5,1e7],dtype=dtype)
              got=np.asarray(t.logpdf(x,df))
              jit=np.asarray(jax.jit(t.logpdf)(x,df))
              expected=ref.t.logpdf(np.asarray(x,dtype=np.float64),np.asarray(df,dtype=np.float64))
              np.testing.assert_allclose(got,expected,rtol=3e-5,atol=3e-5)
              np.testing.assert_allclose(jit,expected,rtol=3e-5,atol=3e-5)
              gr=np.asarray(jax.grad(lambda z: t.logpdf(z,jnp.array(1e4,dtype=dtype)))(jnp.asarray(1.,dtype=dtype)))
              assert np.isfinite(gr).all(),gr
              print('PASS',dtype,'max_scipy_error',float(np.max(np.abs(got-expected))),'grad',gr)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-jax41227-${{ matrix.python }}
          path: |
            large_df_native_jax_test.log
            student_t_differential.log
          if-no-files-found: warn
