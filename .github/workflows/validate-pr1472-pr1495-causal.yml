name: PR1472 + PR1495 causal closure

on:
  push:
    branches:
      - validation/pr1495-with-pr1472
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Prove overlay identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object mani_skill/trajectory/utils/actions/conversion.py)" =                "8fd5e77f5db8a3be668174decc96b9afbd2ecd36"
          grep -q 'rot_action = rot_action \* self.config.rot_upper'             mani_skill/agents/controllers/pd_ee_pose.py
          test "$(git rev-parse HEAD^)" = "486943f33b525a6a83c2ea8ada11f32ed6371c4c" || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused ManiSkill environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run both upstream-focused suites
        run: |
          python -m pytest -q             tests/test_action_conversion.py             tests/test_pr1472_pr1495_factorial.py

      - name: Emit factorial evidence
        run: |
          python -m pytest -q -s tests/test_pr1472_pr1495_factorial.py
