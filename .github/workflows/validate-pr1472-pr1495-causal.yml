name: PR1472 + PR1495 causal closure

on:
  push:
    branches:
      - validation/pr1495-with-pr1472
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact production identities
        shell: bash
        run: |
          set -euo pipefail
          PR1495=cdd6db713ffe7edc3e0df3abfab51ea5320c1c0b
          git merge-base --is-ancestor "$PR1495" HEAD
          test "$(git hash-object mani_skill/trajectory/utils/actions/conversion.py)" = \
               "8fd5e77f5db8a3be668174decc96b9afbd2ecd36"
          test "$(git hash-object mani_skill/agents/controllers/pd_ee_pose.py)" = \
               "bc4e811f336ef67d0f6cccf30116be238bb4031d"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused ManiSkill environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run representation and factorial regressions
        run: |
          python -m pytest -q \
            tests/test_action_conversion.py \
            tests/test_pr1472_pr1495_factorial.py

      - name: Emit factorial evidence
        run: python -m pytest -q -s tests/test_pr1472_pr1495_factorial.py

      - name: Publish causal-closure status on PR1495 head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: cdd6db713ffe7edc3e0df3abfab51ea5320c1c0b
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["PR_HEAD"]
          url = f"https://api.github.com/repos/{repo}/statuses/{sha}"
          payload = json.dumps(
              {
                  "state": "success",
                  "context": "fork/causal-closure",
                  "description": "#1472 + #1495 close the rotation contract together",
                  "target_url": os.environ["RUN_URL"],
              }
          ).encode()
          request = urllib.request.Request(
              url,
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request) as response:
              print(response.read().decode())
          PY
